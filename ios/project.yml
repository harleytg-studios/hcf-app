name: HarleysClanForum
options:
  bundleIdPrefix: com.harleytg
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  HCFModules:
    path: Packages/HCFModules

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(HCF_DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG HCF_DEV
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES

configFiles:
  Debug: Config/Dev.xcconfig
  Release: Config/Release.xcconfig

targets:
  HarleysClanForum:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HarleysClanForum
        excludes:
          - Resources/Info.plist
          - Resources/HCF.entitlements
          - Resources/PrivacyInfo.xcprivacy
          - Resources/Assets.xcassets
    resources:
      - path: HarleysClanForum/Resources/Assets.xcassets
      - path: HarleysClanForum/Resources/PrivacyInfo.xcprivacy
    info:
      path: HarleysClanForum/Resources/Info.plist
    entitlements:
      path: HarleysClanForum/Resources/HCF.entitlements
    dependencies:
      - package: HCFModules
        product: HCFCore
      - package: HCFModules
        product: HCFForum
      - package: HCFModules
        product: HCFUI
      - package: HCFModules
        product: HCFNotifications
      - package: HCFModules
        product: HCFUpdates
      - package: HCFModules
        product: HCFPlatform
      - target: HCFWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harleytg.forum.dev
        PRODUCT_NAME: Harley's Clan Forum
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 100000105
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Harley's Clan Forum [Beta]
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Sync HCF logo assets
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../source code/res/drawable-nodpi-v4/htg_app_logo.png"
          APP_ICON="${SRCROOT}/HarleysClanForum/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          LOGO="${SRCROOT}/HarleysClanForum/Resources/Assets.xcassets/HTGLogo.imageset/HTGLogo.png"
          if [ ! -f "$SRC" ]; then
            echo "error: HCF logo source not found: $SRC"
            exit 1
          fi
          /usr/bin/sips -z 1024 1024 "$SRC" --out "$APP_ICON" >/dev/null
          cp "$SRC" "$LOGO"

  HCFWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HCFWidgetExtension
        excludes:
          - Info.plist
          - HCFWidget.entitlements
          - PrivacyInfo.xcprivacy
    resources:
      - path: HCFWidgetExtension/PrivacyInfo.xcprivacy
    info:
      path: HCFWidgetExtension/Info.plist
    entitlements:
      path: HCFWidgetExtension/HCFWidget.entitlements
    dependencies:
      - package: HCFModules
        product: HCFCore
      - package: HCFModules
        product: HCFWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harleytg.forum.dev.widget
        PRODUCT_NAME: HCFWidgetExtension
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 100000105
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  HCFModulesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/HCFModules/Tests/HCFIntegrationTests
    dependencies:
      - target: HarleysClanForum
      - package: HCFModules
        product: HCFCore
      - package: HCFModules
        product: HCFForum
      - package: HCFModules
        product: HCFUpdates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harleytg.forum.dev.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HCF Dev:
    build:
      targets:
        HarleysClanForum: all
        HCFWidgetExtension: all
        HCFModulesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HCFModulesTests
    archive:
      config: Release
