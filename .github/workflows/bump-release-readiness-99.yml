name: Align Dev Release Gate 10000099

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/bump-release-readiness-99.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Update release readiness version
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/scripts/verify-release-readiness.py'
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(encoding='utf-8'); s=s.replace('EXPECTED_VERSION_CODE = 10000098','EXPECTED_VERSION_CODE = 10000099',1); s=s.replace('canonical v10000098 workflow missing','canonical v10000099 workflow missing',1); s=s.replace('build-dev-v10000098.yml','build-dev-v10000099.yml',1); p.write_text(s,encoding='utf-8')"
          grep -Fq 'EXPECTED_VERSION_CODE = 10000099' "$FILE"
          grep -Fq 'build-dev-v10000099.yml' "$FILE"
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m 'ci: align release readiness with v10000099'
          git push origin HEAD:dev
