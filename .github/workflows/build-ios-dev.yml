name: Build iPhone & iPad Dev IPA

on:
  push:
    branches:
      - dev
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS / iPadOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Reconstruct iOS source project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/generated
          cat ios/source/HCF-iOS-source.part*.b64 > /tmp/hcf-ios-source.b64
          /usr/bin/base64 -D -i /tmp/hcf-ios-source.b64 -o /tmp/hcf-ios-source.tar.gz
          tar -xzf /tmp/hcf-ios-source.tar.gz -C ios/generated

          PROJECT="$(find ios/generated -name 'HarleysClanForumIOS.xcodeproj' -type d -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo 'HarleysClanForumIOS.xcodeproj was not found after source reconstruction.'
            find ios/generated -maxdepth 6 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          echo "APP_SOURCE=$(dirname "$PROJECT")/HarleysClanForumIOS" >> "$GITHUB_ENV"

      - name: Confirm iPhone and iPad target only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' "$PROJECT/project.pbxproj"
          grep -q 'SUPPORTS_MACCATALYST = NO' "$PROJECT/project.pbxproj"
          echo 'Target: iPhone + iPad (iOS/iPadOS). Mac Catalyst is disabled.'

      - name: Generate app icon assets
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ROOT="$APP_SOURCE/Assets.xcassets"
          ICON_DIR="$ASSET_ROOT/AppIcon.appiconset"
          LOGO_DIR="$ASSET_ROOT/AppLogo.imageset"
          mkdir -p "$ICON_DIR" "$LOGO_DIR"

          cat > "$RUNNER_TEMP/make_hcf_icon.swift" <<'SWIFT'
          import AppKit
          import Foundation

          func render(size: Int, output: String) throws {
              let s = CGFloat(size)
              let image = NSImage(size: NSSize(width: s, height: s))
              image.lockFocus()

              NSColor(calibratedRed: 0.027, green: 0.059, blue: 0.090, alpha: 1).setFill()
              NSBezierPath(rect: NSRect(x: 0, y: 0, width: s, height: s)).fill()

              let cyan = NSColor(calibratedRed: 0.0, green: 0.72, blue: 0.94, alpha: 1)
              cyan.setStroke()
              let inset = s * 0.07
              let border = NSBezierPath(roundedRect: NSRect(x: inset, y: inset, width: s-inset*2, height: s-inset*2), xRadius: s*0.16, yRadius: s*0.16)
              border.lineWidth = max(2, s * 0.025)
              border.stroke()

              cyan.setFill()
              func circle(_ x: CGFloat, _ y: CGFloat, _ r: CGFloat) {
                  NSBezierPath(ovalIn: NSRect(x: x-r, y: y-r, width: r*2, height: r*2)).fill()
              }
              circle(s*0.50, s*0.58, s*0.09)
              circle(s*0.38, s*0.70, s*0.052)
              circle(s*0.48, s*0.74, s*0.055)
              circle(s*0.59, s*0.70, s*0.052)
              circle(s*0.68, s*0.61, s*0.049)

              let p = NSMutableParagraphStyle()
              p.alignment = .center
              let font = NSFont.boldSystemFont(ofSize: s * 0.16)
              let attrs: [NSAttributedString.Key: Any] = [.font: font, .foregroundColor: NSColor.white, .paragraphStyle: p]
              NSString(string: "HCF").draw(in: NSRect(x: 0, y: s*0.19, width: s, height: s*0.2), withAttributes: attrs)

              image.unlockFocus()
              guard let data = image.tiffRepresentation,
                    let rep = NSBitmapImageRep(data: data),
                    let png = rep.representation(using: .png, properties: [:]) else {
                  throw NSError(domain: "HCFIcon", code: 1)
              }
              try png.write(to: URL(fileURLWithPath: output))
          }

          let args = CommandLine.arguments
          try render(size: Int(args[1])!, output: args[2])
          SWIFT

          make_icon() {
            /usr/bin/swift "$RUNNER_TEMP/make_hcf_icon.swift" "$1" "$2"
          }

          make_icon 1024 "$LOGO_DIR/AppLogo.png"

          for px in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            make_icon "$px" "$ICON_DIR/AppIcon-$px.png"
          done

          cat > "$LOGO_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "AppLogo.png", "idiom" : "universal", "scale" : "1x" },
              { "idiom" : "universal", "scale" : "2x" },
              { "idiom" : "universal", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename":"AppIcon-40.png",  "idiom":"iphone", "scale":"2x", "size":"20x20" },
              { "filename":"AppIcon-60.png",  "idiom":"iphone", "scale":"3x", "size":"20x20" },
              { "filename":"AppIcon-58.png",  "idiom":"iphone", "scale":"2x", "size":"29x29" },
              { "filename":"AppIcon-87.png",  "idiom":"iphone", "scale":"3x", "size":"29x29" },
              { "filename":"AppIcon-80.png",  "idiom":"iphone", "scale":"2x", "size":"40x40" },
              { "filename":"AppIcon-120.png", "idiom":"iphone", "scale":"3x", "size":"40x40" },
              { "filename":"AppIcon-120.png", "idiom":"iphone", "scale":"2x", "size":"60x60" },
              { "filename":"AppIcon-180.png", "idiom":"iphone", "scale":"3x", "size":"60x60" },
              { "filename":"AppIcon-20.png",  "idiom":"ipad", "scale":"1x", "size":"20x20" },
              { "filename":"AppIcon-40.png",  "idiom":"ipad", "scale":"2x", "size":"20x20" },
              { "filename":"AppIcon-29.png",  "idiom":"ipad", "scale":"1x", "size":"29x29" },
              { "filename":"AppIcon-58.png",  "idiom":"ipad", "scale":"2x", "size":"29x29" },
              { "filename":"AppIcon-40.png",  "idiom":"ipad", "scale":"1x", "size":"40x40" },
              { "filename":"AppIcon-80.png",  "idiom":"ipad", "scale":"2x", "size":"40x40" },
              { "filename":"AppIcon-76.png",  "idiom":"ipad", "scale":"1x", "size":"76x76" },
              { "filename":"AppIcon-152.png", "idiom":"ipad", "scale":"2x", "size":"76x76" },
              { "filename":"AppIcon-167.png", "idiom":"ipad", "scale":"2x", "size":"83.5x83.5" },
              { "filename":"AppIcon-1024.png", "idiom":"ios-marketing", "scale":"1x", "size":"1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Show Apple build tools
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned iPhone and iPad app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/hcf-derived"

          xcodebuild \
            -project "$PROJECT" \
            -scheme HarleysClanForumIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/hcf-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package compiled iOS app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/hcf-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo 'Compiled iOS .app was not found.'
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-unsigned.ipa" Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-app.zip"

          echo "Compiled iOS/iPadOS app: $APP"
          ls -lh "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-app.zip"

      - name: Upload compiled iPhone and iPad app
        uses: actions/upload-artifact@v4
        with:
          name: HarleysClanForum-iOS-v1.0-dev
          if-no-files-found: error
          retention-days: 30
          path: |
            HarleysClanForum-iOS-v1.0-dev-unsigned.ipa
            HarleysClanForum-iOS-v1.0-dev-app.zip
