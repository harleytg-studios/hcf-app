name: One-time v10000097 Loader Chrome Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10000097-loader-chrome-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/status/v10000097-chromefix-run-${GITHUB_RUN_ID} --force

      - name: Verify fixed handoff source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'dockBackdropBelowChrome();' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'hcf_startup_handoff' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'android:versionCode="10000097"' 'source code/AndroidManifest.xml'
          grep -Fq 'VERSION_CODE = 10000097;' 'source code/src/com/harleytg/forum/HcfApplication.java'
          test "$(find 'source code/src/com/harleytg/forum' -maxdepth 1 -name '*.java' | wc -l)" -eq 8

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile v10000097 chrome-fix APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-v10000097-chromefix"
          OUT="$GITHUB_WORKSPACE/out-v10000097-chromefix"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT/signing-tools/lib"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000097-LoaderChromeFix-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000097'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000097)'" "$OUT/APK-BADGING.txt"

          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq 'dock backdrop:' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'hcf_startup_handoff' "$OUT/DEX-STRINGS.txt"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"

          cp "$BT/apksigner" "$OUT/signing-tools/apksigner"
          cp "$BT/lib/apksigner.jar" "$OUT/signing-tools/lib/apksigner.jar"

      - name: Upload chrome-fix artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000097-LoaderChromeFix-Unsigned
          path: out-v10000097-chromefix/
          if-no-files-found: error
          retention-days: 7
