name: Temporary HCF Dark Default APK Export

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-dark-default-apk-export.yml'

permissions:
  contents: read

jobs:
  build-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4

      - name: Run release source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          grep -Fq 'getString("app_theme", DARK)' 'source code/src/com/harleytg/forum/ThemeManager.java'
          grep -Fq 'return DARK;' 'source code/src/com/harleytg/forum/ThemeManager.java'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and verify dark-default APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-dark-v10000092"
          OUT="$GITHUB_WORKSPACE/dark-export"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000092-DarkDefault-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000092'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000092)'" "$OUT/APK-BADGING.txt"
          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq "Welcome to Harley's Clan Forum" "$OUT/DEX-STRINGS.txt"
          grep -Fq 'Development Build / Beta' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'same build code, revised APK hash' "$OUT/DEX-STRINGS.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$APK" "$OUT/apksigner.jar" > "$OUT/SHA256SUMS.txt"

      - name: Upload unsigned APK and official signer
        uses: actions/upload-artifact@v4
        with:
          name: HCF-DarkDefault-v10000092-Export
          path: dark-export/
          if-no-files-found: error
          retention-days: 1

      - name: Intentional export marker for retrieval
        shell: bash
        run: |
          echo 'Temporary artifact export completed. This failure is intentional so the run ID is surfaced for retrieval.'
          exit 1
