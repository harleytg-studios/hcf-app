name: Temporary Build Harley's Security APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-build-harleys-security.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Harley's Security branch
        uses: actions/checkout@v4
        with:
          ref: harleys-security-apk-build
          token: ${{ github.token }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: harleys-security
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and publish APK to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harleys-security/build-output
          APK='harleys-security/app/build/outputs/apk/debug/app-debug.apk'
          OUT='harleys-security/build-output/HarleysSecurity-v0.1-alpha.apk'
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee harleys-security/build-output/APK-BADGING.txt
          grep -q "package: name='com.harleytg.security' versionCode='1' versionName='0.1-alpha'" harleys-security/build-output/APK-BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee harleys-security/build-output/APK-SIGNATURE.txt
          sha256sum "$OUT" | tee harleys-security/build-output/APK-SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harleys-security/build-output/
          git commit -m "[skip ci] Publish Harley's Security v0.1 Alpha APK"
          git push origin HEAD:harleys-security-apk-build
