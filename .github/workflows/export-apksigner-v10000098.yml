name: Export Android APK Signer Tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-apksigner-v10000098.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apksigner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record signer-tool run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          cat > build-output/APKSIGNER-TOOL-RUN.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          status=started
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/APKSIGNER-TOOL-RUN.txt
          git commit -m 'Record APK signer tool export' || true
          git push origin HEAD:main

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.0'

      - name: Package apksigner tool
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OUT="$GITHUB_WORKSPACE/apksigner-tool"
          mkdir -p "$OUT/lib"
          cp "$BT/apksigner" "$OUT/apksigner"
          cp -a "$BT/lib/." "$OUT/lib/"
          chmod +x "$OUT/apksigner"
          "$OUT/apksigner" --version

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-ApkSigner-35.0.0
          path: apksigner-tool/
          if-no-files-found: error
          retention-days: 1

      - name: Mark signer-tool export successful
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cat > build-output/APKSIGNER-TOOL-RUN.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          status=success
          artifact=Android-ApkSigner-35.0.0
          EOF
          git add build-output/APKSIGNER-TOOL-RUN.txt
          git commit -m 'Mark APK signer tool export successful' || true
          git push origin HEAD:main
