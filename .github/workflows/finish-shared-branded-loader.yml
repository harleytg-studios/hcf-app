name: Finish Shared Branded Loader Patch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/finish-shared-branded-loader.yml'

permissions:
  contents: write

jobs:
  finish-loader-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Reuse focused patch and update release source set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-shared-branded-loader.yml')
          raw = workflow.read_text(encoding='utf-8').splitlines()
          start = None
          script = []
          for index, line in enumerate(raw):
              if line == "          python3 - <<'PY'":
                  start = index + 1
                  break
          if start is None:
              raise SystemExit('Unable to locate focused patch script')
          for line in raw[start:]:
              if line == '          PY':
                  break
              script.append(line[10:] if line.startswith('          ') else line)
          if not script:
              raise SystemExit('Focused patch script was empty')
          exec(compile('\n'.join(script), str(workflow), 'exec'), {})

          verifier = Path('.github/scripts/verify-release-readiness.py')
          body = verifier.read_text(encoding='utf-8')
          if '"HcfBrandedLoader.java",' not in body:
              anchor = '    "HcfApplication.java",\n'
              if anchor not in body:
                  raise SystemExit('Release verifier Java source-set anchor missing')
              body = body.replace(anchor, anchor + '    "HcfBrandedLoader.java",\n', 1)
              verifier.write_text(body, encoding='utf-8')

          # These are one-shot write-enabled patch helpers. Remove them before release validation.
          for temporary in (
              Path('.github/workflows/patch-shared-branded-loader.yml'),
              Path('.github/workflows/restore-settings-back-comments.yml'),
              Path('.github/workflows/finish-shared-branded-loader.yml'),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY2

      - name: Run unchanged release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-hcf-notifications-v2.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          grep -Fq 'private boolean handleSettingsBack()' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          grep -Fq 'if (!handleSettingsBack()) finish();' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          grep -Fq 'public final class HcfBrandedLoader' 'source code/src/com/harleytg/forum/HcfBrandedLoader.java'
          grep -Fq 'showConnecting(str)' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'showReconnecting(reconnectHost)' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'brandedLoader.hide(true)' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq '"HcfBrandedLoader.java",' '.github/scripts/verify-release-readiness.py'

      - name: Commit focused runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Use shared branded loader for connect and reconnect'
          git push origin HEAD:dev
