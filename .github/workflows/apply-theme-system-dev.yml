name: Apply Dev Theme System

on:
  push:
    branches: [dev]
    paths:
      - 'build-output/APPLY-THEME-SYSTEM-DEV.txt'

permissions:
  contents: write

jobs:
  patch-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Record run ID
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/HCF-THEME-SYSTEM-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'dev'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'dev', sha,
              message: '[skip ci] Record theme-system update run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch Settings Appearance UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source code/src/com/harleytg/forum/SettingsActivity.java')
          text = path.read_text(encoding='utf-8')

          old_method = '''    private View themeModeSelector() {
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(0, dp(4), 0, dp(2));
              root.setTag(TARGET_TAG_PREFIX + "theme");
              LinearLayout first = new LinearLayout(this);
              first.setOrientation(LinearLayout.HORIZONTAL);
              first.setWeightSum(2.0f);
              LinearLayout second = new LinearLayout(this);
              second.setOrientation(LinearLayout.HORIZONTAL);
              second.setWeightSum(2.0f);
              String mode = ThemeManager.mode(this);
              first.addView(themeChoiceButton("Forum Auto", "auto_forum", "auto_forum".equals(mode)), themeChoiceParams(false));
              first.addView(themeChoiceButton("Phone Auto", "auto_phone", "auto_phone".equals(mode)), themeChoiceParams(true));
              boolean dark = "dark".equals(mode) || "amoled".equals(mode);
              second.addView(themeChoiceButton("Light", "light", "light".equals(mode)), themeChoiceParams(false));
              second.addView(themeChoiceButton("Dark", "dark", dark), themeChoiceParams(true));
              root.addView(first);
              LinearLayout.LayoutParams secondLp = new LinearLayout.LayoutParams(-1, -2);
              secondLp.topMargin = dp(8);
              root.addView(second, secondLp);
              return root;
          }
          '''

          new_method = '''    private View themeModeSelector() {
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(0, dp(4), 0, dp(2));
              root.setTag(TARGET_TAG_PREFIX + "theme");

              LinearLayout first = new LinearLayout(this);
              first.setOrientation(LinearLayout.HORIZONTAL);
              first.setWeightSum(2.0f);
              LinearLayout second = new LinearLayout(this);
              second.setOrientation(LinearLayout.HORIZONTAL);
              second.setWeightSum(2.0f);
              LinearLayout third = new LinearLayout(this);
              third.setOrientation(LinearLayout.HORIZONTAL);
              third.setWeightSum(1.0f);

              String mode = ThemeManager.mode(this);
              first.addView(themeChoiceButton("Forum Auto", "auto_forum", "auto_forum".equals(mode)), themeChoiceParams(false));
              first.addView(themeChoiceButton("Phone Auto", "auto_phone", "auto_phone".equals(mode)), themeChoiceParams(true));
              second.addView(themeChoiceButton("Light", "light", "light".equals(mode)), themeChoiceParams(false));
              second.addView(themeChoiceButton("Dark", "dark", "dark".equals(mode)), themeChoiceParams(true));
              third.addView(themeChoiceButton("AMOLED", "amoled", "amoled".equals(mode)), themeChoiceParams(false));

              root.addView(first);
              LinearLayout.LayoutParams secondLp = new LinearLayout.LayoutParams(-1, -2);
              secondLp.topMargin = dp(8);
              root.addView(second, secondLp);
              LinearLayout.LayoutParams thirdLp = new LinearLayout.LayoutParams(-1, -2);
              thirdLp.topMargin = dp(8);
              root.addView(third, thirdLp);

              TextView live = text(ThemeManager.autoSourceLabel(this), 10, getColor(R.color.hcf_cyan));
              live.setPadding(dp(2), dp(8), dp(2), 0);
              root.addView(live);
              return root;
          }
          '''

          old_helper = '        card.addView(text("Forum Auto follows your forum Night Mode setting; Phone Auto follows Android directly.", 10, getColor(R.color.hcf_muted)));'
          new_helper = '''        card.addView(text(
                  "Forum Auto follows Flarum Night Mode (uses last known value on startup). "
                          + "Phone Auto follows Android. Light / Dark / AMOLED force the app chrome immediately.",
                  10, getColor(R.color.hcf_muted)));'''

          if old_method not in text:
              raise SystemExit('themeModeSelector old block not found; refusing ambiguous patch')
          if old_helper not in text:
              raise SystemExit('Appearance helper text not found; refusing ambiguous patch')

          text = text.replace(old_method, new_method, 1)
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate theme-system update
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ThemeManager.applyToApplication(this);' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'static void applyToApplication(Application application)' 'source code/src/com/harleytg/forum/ThemeManager.java'
          grep -Fq 'return mode(context) + ":" + resolvedNightMode(context) + (isAmoled(context) ? ":amoled" : "");' 'source code/src/com/harleytg/forum/ThemeManager.java'
          grep -Fq 'themeChoiceButton("AMOLED", "amoled", "amoled".equals(mode))' 'source code/src/com/harleytg/forum/SettingsActivity.java'
          grep -Fq 'ThemeManager.autoSourceLabel(this)' 'source code/src/com/harleytg/forum/SettingsActivity.java'
          grep -Fq 'uses last known value on startup' 'source code/src/com/harleytg/forum/SettingsActivity.java'

      - name: Commit theme-system source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/SettingsActivity.java'
          if git diff --cached --quiet; then
            echo 'No SettingsActivity changes required.'
            exit 0
          fi
          git commit -m '[skip ci] fix(theme): AMOLED chip and live Appearance status'
          git push origin HEAD:dev
