name: Build Stable v10000032 Stable Branding APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-stable-branding-fix-main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable source
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo
          token: ${{ github.token }}

      - name: Checkout main Stable branding
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Prepare Stable branding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow
          SRC="$GITHUB_WORKSPACE/stable-repo/source code"
          test -f "$SRC/AndroidManifest.xml"
          test -f "$SRC/build-release.sh"
          test -f "$GITHUB_WORKSPACE/main-repo/assets/stable.png"
          grep -q 'package="com.harleytg.forum"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionCode="10000032"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionName="1.0"' "$SRC/AndroidManifest.xml"
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os, hashlib
          w = Path(os.environ['GITHUB_WORKSPACE'])
          src = w/'stable-repo'/'source code'
          stable = w/'main-repo'/'assets'/'stable.png'
          im = Image.open(stable).convert('RGBA')
          print('USING STABLE ASSET', stable, im.size, hashlib.sha256(stable.read_bytes()).hexdigest())
          # In-app, splash and adaptive icon foreground.
          p = src/'res'/'drawable-nodpi'/'htg_app_logo.png'
          p.parent.mkdir(parents=True, exist_ok=True)
          im.resize((512,512), Image.Resampling.LANCZOS).save(p)
          # Source branding copy.
          bp = src/'branding'/'HTG-App-Icon.png'
          bp.parent.mkdir(parents=True, exist_ok=True)
          im.save(bp)
          # Legacy launcher + round launcher resources.
          for density,size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              d=src/'res'/f'mipmap-{density}'
              d.mkdir(parents=True, exist_ok=True)
              icon=im.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png')
              icon.save(d/'ic_launcher_round.png')
          PY

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create temporary APK signer
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hcf-stable-v10000032.jks" \
            -storepass hcf-stable-v10000032 \
            -keypass hcf-stable-v10000032 \
            -alias hcf-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Harley's Clan Forum Stable v10000032,O=Harley's Studios,C=US"
          printf '%s\n' hcf-stable-v10000032 > "$RUNNER_TEMP/hcf-pass.txt"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/stable-repo/source code"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          chmod +x "$SRC/build-release.sh"
          ANDROID_SDK_ROOT="$ANDROID_HOME" \
          BUILD_TOOLS_VERSION='35.0.0' \
          ANDROID_PLATFORM_VERSION='35' \
          HCF_KEYSTORE="$RUNNER_TEMP/hcf-stable-v10000032.jks" \
          HCF_KEY_ALIAS='hcf-release' \
          HCF_KEY_PASSWORD_FILE="$RUNNER_TEMP/hcf-pass.txt" \
          HCF_OUTPUT_DIR="$OUT" \
          "$SRC/build-release.sh"
          mv "$OUT/HarleysClanForum-1.0.apk" "$OUT/HCF-Stable-v1.0-v10000032.apk"

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/out/HCF-Stable-v1.0-v10000032.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "package: name='com.harleytg.forum' versionCode='10000032' versionName='1.0'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/out/APK-SIGNATURE.txt"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/out/APK-SHA256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000032-Stable-Branding
          path: |
            out/HCF-Stable-v1.0-v10000032.apk
            out/APK-BADGING.txt
            out/APK-SIGNATURE.txt
            out/APK-SHA256.txt
          if-no-files-found: error

      - name: Publish APK to Stable branch
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE/stable-repo"
          mkdir -p "$REPO/build-output"
          cp "$GITHUB_WORKSPACE/out/HCF-Stable-v1.0-v10000032.apk" "$REPO/build-output/HCF-Stable-v1.0-v10000032.apk"
          cp "$GITHUB_WORKSPACE/out/APK-SHA256.txt" "$REPO/build-output/APK-SHA256.txt"
          printf 'run_id=%s\nartifact=%s\napk=%s\npackage=%s\nversionName=%s\nversionCode=%s\nbranding=%s\n' \
            "$GITHUB_RUN_ID" \
            'HCF-Stable-v10000032-Stable-Branding' \
            'HCF-Stable-v1.0-v10000032.apk' \
            'com.harleytg.forum' '1.0' '10000032' 'main/assets/stable.png' \
            > "$REPO/build-output/BUILD.txt"
          cd "$REPO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/
          git commit -m "[skip ci] Stable v10000032 APK with Stable branding"
          git push origin HEAD:stable
