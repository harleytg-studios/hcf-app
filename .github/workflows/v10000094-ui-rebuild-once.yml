name: One-time v10000094 UI Rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10000094-ui-rebuild-once.yml'

permissions:
  contents: write

jobs:
  bump-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/status/v10000094-run-${GITHUB_RUN_ID} --force

      - name: Bump app source to v10000094
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          manifest = root / 'source code/AndroidManifest.xml'
          app = root / 'source code/src/com/harleytg/forum/HcfApplication.java'
          readme = root / 'README.md'

          def rep(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          rep(manifest, '10000093', '10000094')
          rep(app, '10000093', '10000094')
          rep(app, 'static final int INTERNAL_BUILD = 113;', 'static final int INTERNAL_BUILD = 114;')
          rep(readme, '10000093', '10000094')
          rep(readme, 'Internal build: `113`', 'Internal build: `114`')
          PY

          test "$(find 'source code/src/com/harleytg/forum' -maxdepth 1 -name '*.java' | wc -l)" -eq 8
          grep -Fq 'android:versionCode="10000094"' 'source code/AndroidManifest.xml'
          grep -Fq 'android:versionName="1.0 (10000094)"' 'source code/AndroidManifest.xml'
          grep -Fq 'VERSION_CODE = 10000094;' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'INTERNAL_BUILD = 114;' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'HCF-Beta-v10000094.apk' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'Welcome To' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq "Harley's Clan Forum" 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          test "$(grep -Fc '@drawable/url_control_button_background' 'source code/res/layout/activity_main.xml')" -eq 4

      - name: Commit v10000094 source to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/AndroidManifest.xml' 'source code/src/com/harleytg/forum/HcfApplication.java' README.md
          git commit -m 'Bump Dev UI polish build to v10000094'
          git push origin HEAD:dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build v10000094 unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          W="$RUNNER_TEMP/hcf-v10000094"
          O="$GITHUB_WORKSPACE/out-v10000094"
          mkdir -p "$W/gen" "$W/classes" "$W/dex" "$O/signing-tools/lib"

          "$BT/aapt" package -f -m -J "$W/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$AJ" -F "$W/resources.apk"
          mapfile -t JF < <(find "$W/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$AJ" -d "$W/classes" "${JF[@]}"
          mapfile -t CF < <(find "$W/classes" -name '*.class' -print)
          "$BT/d8" --lib "$AJ" --min-api 26 --release --output "$W/dex" "${CF[@]}"
          cp "$W/resources.apk" "$W/unsigned.apk"
          (cd "$W/dex" && "$BT/aapt" add "$W/unsigned.apk" classes.dex)
          APK="$O/HCF-Beta-v10000094-UI-Polish-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$W/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | head -1 | tee "$O/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$O/APK-BADGING.txt"
          grep -q "versionCode='10000094'" "$O/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000094)'" "$O/APK-BADGING.txt"
          unzip -p "$APK" classes.dex | strings > "$O/DEX-STRINGS.txt"
          grep -Fq 'Welcome To' "$O/DEX-STRINGS.txt"
          cp "$BT/apksigner" "$O/signing-tools/apksigner"
          cp "$BT/lib/apksigner.jar" "$O/signing-tools/lib/apksigner.jar"
          sha256sum "$APK" | tee "$O/SHA256SUMS.txt"

      - name: Upload v10000094 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000094-UI-Polish-Unsigned
          path: out-v10000094/
          if-no-files-found: error
          retention-days: 7
