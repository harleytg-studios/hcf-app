name: Build Stable 10000032 Branding Fix

on:
  push:
    branches:
      - stable

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable source
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo

      - name: Checkout main branding
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Apply exact Stable icons and logo
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/stable-repo/source code"
          STABLE="$GITHUB_WORKSPACE/main-repo/assets/stable.png"
          test -f "$SRC/AndroidManifest.xml"
          test -f "$SRC/build-release.sh"
          test -f "$STABLE"
          grep -q 'package="com.harleytg.forum"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionCode="10000032"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionName="1.0"' "$SRC/AndroidManifest.xml"
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          root = Path(os.environ['GITHUB_WORKSPACE'])
          src = root/'stable-repo'/'source code'
          stable = root/'main-repo'/'assets'/'stable.png'
          im = Image.open(stable).convert('RGBA')
          # Exact Stable artwork for the in-app/splash/adaptive foreground.
          out = src/'res'/'drawable-nodpi'/'htg_app_logo.png'
          out.parent.mkdir(parents=True, exist_ok=True)
          im.resize((512,512), Image.Resampling.LANCZOS).save(out)
          # Keep source branding copy aligned too.
          brand = src/'branding'/'HTG-App-Icon.png'
          brand.parent.mkdir(parents=True, exist_ok=True)
          im.save(brand)
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              d = src/'res'/f'mipmap-{density}'
              d.mkdir(parents=True, exist_ok=True)
              icon = im.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png')
              icon.save(d/'ic_launcher_round.png')
          print('Applied Stable branding:', stable)
          PY

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hcf-stable-temp.jks" \
            -storepass hcf-stable-10000032 \
            -keypass hcf-stable-10000032 \
            -alias hcf-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Harley's Clan Forum Stable Build,O=Harley's Studios,C=US"
          printf '%s\n' hcf-stable-10000032 > "$RUNNER_TEMP/hcf-pass.txt"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/stable-repo/source code"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          chmod +x "$SRC/build-release.sh"
          ANDROID_SDK_ROOT="$ANDROID_HOME" \
          BUILD_TOOLS_VERSION='35.0.0' \
          ANDROID_PLATFORM_VERSION='35' \
          HCF_KEYSTORE="$RUNNER_TEMP/hcf-stable-temp.jks" \
          HCF_KEY_ALIAS='hcf-release' \
          HCF_KEY_PASSWORD_FILE="$RUNNER_TEMP/hcf-pass.txt" \
          HCF_OUTPUT_DIR="$OUT" \
          "$SRC/build-release.sh"
          mv "$OUT/HarleysClanForum-1.0.apk" "$OUT/HCF-Stable-v1.0-v10000032-STABLE-BRANDING.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/out/HCF-Stable-v1.0-v10000032-STABLE-BRANDING.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "package: name='com.harleytg.forum' versionCode='10000032' versionName='1.0'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/out/APK-SIGNATURE.txt"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/out/APK-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000032-STABLE-BRANDING
          path: |
            out/HCF-Stable-v1.0-v10000032-STABLE-BRANDING.apk
            out/APK-BADGING.txt
            out/APK-SIGNATURE.txt
            out/APK-SHA256.txt
          if-no-files-found: error
