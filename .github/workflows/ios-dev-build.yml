name: iOS Dev Build

on:
  push:
    branches: [ios-dev]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dev-build.yml'
      - 'source code/res/drawable-nodpi-v4/htg_app_logo.png'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dev-build.yml'
      - 'source code/res/drawable-nodpi-v4/htg_app_logo.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare preview assets
        working-directory: ios
        run: |
          set -euo pipefail
          SRC="../source code/res/drawable-nodpi-v4/htg_app_logo.png"
          test -f "$SRC"
          mkdir -p HarleysClanForum/Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p HarleysClanForum/Resources/Assets.xcassets/HTGLogo.imageset
          /usr/bin/sips -z 1024 1024 "$SRC" --out HarleysClanForum/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
          cp "$SRC" HarleysClanForum/Resources/Assets.xcassets/HTGLogo.imageset/HTGLogo.png

          python3 - <<'PY'
          from pathlib import Path
          path = Path('project.yml')
          text = path.read_text()
          marker = '    preBuildScripts:\n      - name: Sync HCF logo assets'
          if marker in text:
              start = text.index(marker)
              end_marker = '\n\n  HCFWidgetExtension:'
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
              path.write_text(text)
          PY

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Apply preview SwiftUI compatibility patch
        working-directory: ios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Packages/HCFModules/Sources/HCFUI/HCFUI.swift')
          text = path.read_text()

          replacements = {
              '    public let preferences: PreferencesStore':
              '    @Published public var preferences: PreferencesStore',
              '    public init(preferences: PreferencesStore = .init()) { self.preferences = preferences }':
              '    public init(preferences: PreferencesStore? = nil) { self.preferences = preferences ?? PreferencesStore() }',
              '    public init(model: HCFAppModel = .init()) { _model = StateObject(wrappedValue: model) }':
              '    @MainActor public init(model: HCFAppModel? = nil) { _model = StateObject(wrappedValue: model ?? HCFAppModel()) }',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HarleysClanForum.xcodeproj \
            -scheme 'HCF Dev' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            build | xcpretty

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print("platform=iOS Simulator,id=" + device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")')
          xcodebuild \
            -project HarleysClanForum.xcodeproj \
            -scheme 'HCF Dev' \
            -configuration Debug \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            test | xcpretty

      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf build/DeviceDerivedData build/Payload build/HCF-iOS-v1.1-hf2-a1-100000105-unsigned.ipa
          xcodebuild \
            -project HarleysClanForum.xcodeproj \
            -scheme 'HCF Dev' \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_VERSION=5 \
            build | xcpretty

          APP_PATH=$(find build/DeviceDerivedData/Build/Products/Debug-iphoneos -maxdepth 1 -type d -name '*.app' ! -name '*Tests*' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo 'No device .app was produced.' >&2
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/HarleysClanForum.app
          (
            cd build
            /usr/bin/zip -qry HCF-iOS-v1.1-hf2-a1-100000105-unsigned.ipa Payload
          )
          ls -lh build/HCF-iOS-v1.1-hf2-a1-100000105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HCF-iOS-v1.1-hf2-a1-100000105-unsigned
          path: ios/build/HCF-iOS-v1.1-hf2-a1-100000105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
