name: Temporary Stable Silent Alert Repair

on:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable

      - name: Patch Java notification engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source code/src/com/harleytg/forum/HcfNotificationEngine.java")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f"Expected pattern missing: {label}")
              text = text.replace(old, new, 1)

          replace(
          '''            if (!hasSession(context) || NotificationHelper.silencePassiveEnabled(context)) {
                          stop(context);
                          return;
                      }
          ''',
          '''            if (!hasSession(context)) {
                          stop(context);
                          return;
                      }
          ''',
          "foreground service start gate")

          replace(
          '''            if (NotificationHelper.silencePassiveEnabled(context)) requestOneShotSync(context);
                      else startWithAction(context, ACTION_SYNC_NOW);
          ''',
          '''            startWithAction(context, ACTION_SYNC_NOW);
          ''',
          "immediate sync gate")

          replace(
          '''            if (NotificationHelper.silencePassiveEnabled(context)) {
                          if (ACTION_SYNC_NOW.equals(action)) requestOneShotSync(context);
                          else stop(context);
                          return;
                      }
          ''',
          '''''',
          "startWithAction silence gate")

          replace(
          '''                NotificationChannel notificationChannel = new NotificationChannel(CHANNEL_ID, CHANNEL_NAME, 4);
          ''',
          '''                NotificationChannel notificationChannel = new NotificationChannel(CHANNEL_ID, CHANNEL_NAME, NotificationManager.IMPORTANCE_HIGH);
          ''',
          "alerts importance")

          replace(
          '''                NotificationChannel notificationChannel2 = new NotificationChannel(SILENT_CHANNEL_ID, SILENT_CHANNEL_NAME, 2);
          ''',
          '''                NotificationChannel notificationChannel2 = new NotificationChannel(SILENT_CHANNEL_ID, SILENT_CHANNEL_NAME, NotificationManager.IMPORTANCE_LOW);
          ''',
          "silent importance")

          replace(
          '''                    NotificationChannel notificationChannel3 = new NotificationChannel(TEST_CHANNEL_ID, TEST_CHANNEL_NAME, 3);
          ''',
          '''                    NotificationChannel notificationChannel3 = new NotificationChannel(TEST_CHANNEL_ID, TEST_CHANNEL_NAME, NotificationManager.IMPORTANCE_DEFAULT);
          ''',
          "test importance")

          replace(
          '''    static void refreshChannels(Context context) {
                  createChannel(context);
              }
          ''',
          '''    static void refreshChannels(Context context) {
                  createChannel(context);
                  if (silencePassiveEnabled(context)) cancelOptionalSilentAlerts(context);
              }

              static void cancelOptionalSilentAlerts(Context context) {
                  if (context == null) return;
                  try {
                      NotificationManager manager = (NotificationManager) context.getSystemService("notification");
                      if (manager == null) return;
                      android.service.notification.StatusBarNotification[] active = manager.getActiveNotifications();
                      if (active == null) return;
                      int cancelled = 0;
                      for (android.service.notification.StatusBarNotification item : active) {
                          if (item == null || item.getNotification() == null) continue;
                          if (SILENT_CHANNEL_ID.equals(item.getNotification().getChannelId())
                                  && item.getId() != HcfNotificationEngine.InstantNotificationService.SERVICE_NOTIFICATION_ID) {
                              manager.cancel(item.getTag(), item.getId());
                              cancelled++;
                          }
                      }
                      AppLogger.info(context, "silent_alert_suppressed",
                              "cleared_optional=" + cancelled + " • live_service_preserved");
                  } catch (Throwable error) {
                      AppLogger.warn(context, "silent_alert_suppressed",
                              "clear_failed_" + error.getClass().getSimpleName());
                  }
              }
          ''',
          "refresh channel cleanup")

          replace(
          '''        return context.getSharedPreferences("hcf_app", 0).getBoolean("silence_background_service_notification", false);
          ''',
          '''        // Legacy preference key retained for existing installs. This controls only
                  // optional quiet status notifications, never the required foreground service.
                  return context.getSharedPreferences("hcf_app", 0).getBoolean("silence_background_service_notification", false);
          ''',
          "preference semantics")

          replace(
          '''    static String channelStatus(Context context, String str) {
                  int channelImportance = channelImportance(context, str);
                  if (channelImportance == 0) {
                      return "Off";
                  }
                  if (SILENT_CHANNEL_ID.equals(str)) {
                      return silencePassiveEnabled(context) ? "Disabled by app setting" : "Enabled • Silent";
                  }
                  if (channelImportance >= 4) {
                      return "On • High priority";
                  }
                  if (channelImportance >= 3) {
                      return "On • Normal";
                  }
                  return "On • Low priority";
              }
          ''',
          '''    static String channelStatus(Context context, String str) {
                  int importance = channelImportance(context, str);
                  if (importance == NotificationManager.IMPORTANCE_NONE) {
                      return "Off";
                  }
                  if (SILENT_CHANNEL_ID.equals(str)) {
                      return silencePassiveEnabled(context)
                              ? "Live service active • optional status alerts silenced"
                              : "Enabled • Silent";
                  }
                  if (importance >= NotificationManager.IMPORTANCE_HIGH) {
                      return "On • High priority";
                  }
                  if (importance >= NotificationManager.IMPORTANCE_DEFAULT) {
                      return "On • Normal";
                  }
                  return "On • Low priority";
              }
          ''',
          "channel status")

          replace(
          '''    static boolean canPostOnChannel(Context context, String str) {
                  if (SILENT_CHANNEL_ID.equals(str) && silencePassiveEnabled(context)) return false;
                  return isEnabledByUser(context) && hasRuntimePermission(context) && areAppNotificationsEnabled(context) && channelImportance(context, str) != 0;
              }
          ''',
          '''    static boolean canPostOnChannel(Context context, String str) {
                  if (context == null || str == null || str.isEmpty()) return false;
                  return isEnabledByUser(context)
                          && hasRuntimePermission(context)
                          && areAppNotificationsEnabled(context)
                          && channelImportance(context, str) != NotificationManager.IMPORTANCE_NONE;
              }

              static boolean canPostOptionalSilentAlert(Context context) {
                  return !silencePassiveEnabled(context) && canPostOnChannel(context, SILENT_CHANNEL_ID);
              }
          ''',
          "channel availability")

          replace(
          '''            if (str3 == null) {
                          str3 = z2 ? SILENT_CHANNEL_ID : CHANNEL_ID;
                      }
                      if (!canPostOnChannel(context, str3)) {
          ''',
          '''            if (str3 == null) {
                          str3 = z2 ? SILENT_CHANNEL_ID : CHANNEL_ID;
                      }
                      if (SILENT_CHANNEL_ID.equals(str3) && silencePassiveEnabled(context)) {
                          AppLogger.info(context, "silent_alert_suppressed",
                                  "optional status alert • live service preserved");
                          return;
                      }
                      if (!canPostOnChannel(context, str3)) {
          ''',
          "optional post gate")

          replace(
          '''    static Notification buildInstantServiceNotification(Context context) {
                  Intent intent = new Intent(context, (Class<?>) HcfMainActivities.MainActivity.class);
                  intent.addFlags(603979776);
                  return new Notification.Builder(context, SILENT_CHANNEL_ID).setSmallIcon(R.drawable.ic_notification_paw).setContentTitle("Harley's Clan Forum").setContentText("Live alerts active • checking in real time").setContentIntent(PendingIntent.getActivity(context, 41070, intent, 201326592)).setOngoing(true).setOnlyAlertOnce(true).setShowWhen(false).setCategory("service").setVisibility(0).setPriority(-2).build();
              }
          ''',
          '''    static Notification buildInstantServiceNotification(Context context) {
                  createChannel(context);
                  Intent intent = new Intent(context, (Class<?>) HcfMainActivities.MainActivity.class);
                  intent.addFlags(603979776);
                  return new Notification.Builder(context, SILENT_CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_notification_paw)
                          .setContentTitle("Harley's Clan Forum")
                          .setContentText("Live alerts active • checking in real time…")
                          .setContentIntent(PendingIntent.getActivity(context,
                                  HcfNotificationEngine.InstantNotificationService.SERVICE_NOTIFICATION_ID,
                                  intent, 201326592))
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .setCategory(Notification.CATEGORY_SERVICE)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setPriority(Notification.PRIORITY_LOW)
                          .setSilent(true)
                          .build();
              }
          ''',
          "foreground notification builder")

          replace(
          '''            if (silencePassiveEnabled(context)) {
                          AppLogger.info(context, "silent_alert_suppressed", "group notification summary");
                          return;
                      }
                      if (canPostOnChannel(context, SILENT_CHANNEL_ID)) {
                          Notification.Builder builder = new Notification.Builder(context, SILENT_CHANNEL_ID);
                          builder.setSmallIcon(R.drawable.ic_notification_paw).setLargeIcon(largeIcon(context)).setContentTitle("Harley's Clan Forum").setContentText(i + " new forum alerts").setContentIntent(activity).setGroup(FORUM_GROUP_KEY).setGroupSummary(true).setNumber(i).setAutoCancel(true).setCategory("status").setVisibility(0).setPriority(-1);
                          NotificationManager notificationManager = (NotificationManager) context.getSystemService("notification");
                          if (notificationManager != null) {
                              notificationManager.notify(FORUM_SUMMARY_ID, builder.build());
                          }
                      }
          ''',
          '''            if (!canPostOptionalSilentAlert(context)) {
                          AppLogger.info(context, "silent_alert_suppressed",
                                  "group notification summary • live service preserved");
                          return;
                      }
                      Notification.Builder builder = new Notification.Builder(context, SILENT_CHANNEL_ID);
                      builder.setSmallIcon(R.drawable.ic_notification_paw)
                              .setLargeIcon(largeIcon(context))
                              .setContentTitle("Harley's Clan Forum")
                              .setContentText(i + " new forum alerts")
                              .setContentIntent(activity)
                              .setGroup(FORUM_GROUP_KEY)
                              .setGroupSummary(true)
                              .setNumber(i)
                              .setAutoCancel(true)
                              .setCategory(Notification.CATEGORY_STATUS)
                              .setVisibility(Notification.VISIBILITY_PUBLIC)
                              .setPriority(Notification.PRIORITY_LOW)
                              .setOnlyAlertOnce(true);
                      NotificationManager notificationManager = (NotificationManager) context.getSystemService("notification");
                      if (notificationManager != null) {
                          notificationManager.notify(FORUM_SUMMARY_ID, builder.build());
                      }
          ''',
          "group summary gate")

          replace(
          '''            String userId = prefs.getString("session_user_id", "");
                      boolean silenceForegroundStatus = prefs.getBoolean("silence_background_service_notification", false);

                      if (userId != null && !userId.trim().isEmpty()) {
                          if (silenceForegroundStatus) {
                              // Android requires a visible notification for a foreground service.
                              // Honor the user's silence switch by stopping that foreground service.
                              // Foreground WebSocket events can still request silent one-shot syncs,
                              // while JobScheduler remains the background fallback.
                              HcfNotificationEngine.InstantNotificationService.stop(context);
                              AppLogger.info(context, "notification_sync_mode", "silent fallback • foreground service stopped");
                          } else {
                              HcfNotificationEngine.InstantNotificationService.start(context);
                              AppLogger.info(context, "notification_sync_mode", "foreground live sync");
                          }
                      } else {
          ''',
          '''            String userId = prefs.getString("session_user_id", "");

                      if (userId != null && !userId.trim().isEmpty()) {
                          // Signed-in + background sync enabled always keeps the legal foreground
                          // service active. The optional-silence toggle only suppresses extra status posts.
                          HcfNotificationEngine.InstantNotificationService.start(context);
                          AppLogger.info(context, "notification_sync_mode", "foreground live sync • signed-in");
                      } else {
          ''',
          "scheduler foreground policy")

          if text == original:
              raise SystemExit("No Java changes produced")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -F 'Live service active • optional status alerts silenced' 'source code/src/com/harleytg/forum/HcfNotificationEngine.java'
          grep -F 'foreground live sync • signed-in' 'source code/src/com/harleytg/forum/HcfNotificationEngine.java'
          if grep -Fq 'if (!hasSession(context) || NotificationHelper.silencePassiveEnabled(context))' 'source code/src/com/harleytg/forum/HcfNotificationEngine.java'; then
            echo 'Old foreground-service silence gate still present' >&2
            exit 1
          fi

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/HcfNotificationEngine.java'
          git commit -m 'Fix Stable optional silent alert behavior'
          git push origin HEAD:stable
