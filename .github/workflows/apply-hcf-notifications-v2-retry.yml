name: Retry HCF Notifications v2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-hcf-notifications-v2-retry.yml'

permissions:
  contents: write

jobs:
  patch-verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reuse corrected v2 patch program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/apply-hcf-notifications-v2.yml')
          text = wf.read_text(encoding='utf-8')
          bad = "''').replace('\\n          ', '\\n').lstrip(), encoding='utf-8')"
          good = "'''.replace('\\n          ', '\\n').lstrip(), encoding='utf-8')"
          if bad not in text:
              raise SystemExit('Could not locate verifier write_text syntax to repair')
          text = text.replace(bad, good, 1)

          marker = '      - name: Apply HCF Notifications v2 Java patch'
          pos = text.index(marker)
          start_marker = "          python3 - <<'PY'\n"
          start = text.index(start_marker, pos) + len(start_marker)
          end = text.index('\n          PY', start)
          script = textwrap.dedent(text[start:end])

          old_scheduler = '''s = regex_once(s,
              r'    static void apply\\(Context context\\) \\{.*?\\n    static void schedule',
              scheduler_apply, 'scheduler apply')'''
          new_scheduler = '''scheduler_start = s.index("final class NotificationSyncScheduler {")
          scheduler_tail = s[scheduler_start:]
          scheduler_tail = regex_once(scheduler_tail,
              r'    static void apply\\(Context context\\) \\{.*?\\n    static void schedule',
              scheduler_apply, 'scheduler apply')
          s = s[:scheduler_start] + scheduler_tail'''
          if old_scheduler not in script:
              raise SystemExit('Could not locate scheduler patch block to scope it safely')
          script = script.replace(old_scheduler, new_scheduler, 1)

          compile(script, '<hcf-notifications-v2-patch>', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

      - name: Verify notification contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-hcf-notifications-v2.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .

      - name: Generate encrypted Discord webhook binding
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${DISCORD_WEBHOOK_URL:-}" || { echo 'DISCORD_WEBHOOK_URL secret missing'; exit 1; }
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://www.discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*|https://www.discordapp.com/api/webhooks/*) ;;
            *) echo 'Unsupported Discord webhook URL'; exit 1 ;;
          esac
          GEN_DIR="$GITHUB_WORKSPACE/source code/src/com/harleytg/forum"
          TMP="$RUNNER_TEMP/hcf-discord-secret"
          mkdir -p "$TMP"
          chmod 700 "$TMP"
          printf '%s' "$DISCORD_WEBHOOK_URL" > "$TMP/plain.txt"
          openssl rand 32 > "$TMP/key.bin"
          openssl rand 16 > "$TMP/iv.bin"
          KEY_HEX="$(xxd -p -c 256 "$TMP/key.bin")"
          IV_HEX="$(xxd -p -c 256 "$TMP/iv.bin")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in "$TMP/plain.txt" -out "$TMP/cipher.bin"
          python3 - "$TMP/key.bin" "$TMP/iv.bin" "$TMP/cipher.bin" "$GEN_DIR/HcfDiscordSecret.java" <<'PY'
          import pathlib, sys
          key_path, iv_path, cipher_path, out_path = map(pathlib.Path, sys.argv[1:])
          def java_bytes(data): return ', '.join(f'(byte)0x{value:02x}' for value in data)
          source = f'''package com.harleytg.forum.dev;

          import java.nio.charset.StandardCharsets;
          import javax.crypto.Cipher;
          import javax.crypto.spec.IvParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          public final class HcfDiscordSecret {{
              private static final byte[] KEY = new byte[]{{{java_bytes(key_path.read_bytes())}}};
              private static final byte[] IV = new byte[]{{{java_bytes(iv_path.read_bytes())}}};
              private static final byte[] DATA = new byte[]{{{java_bytes(cipher_path.read_bytes())}}};
              private HcfDiscordSecret() {{}}
              public static String decrypt() throws Exception {{
                  Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                  cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(KEY, "AES"), new IvParameterSpec(IV));
                  return new String(cipher.doFinal(DATA), StandardCharsets.UTF_8);
              }}
          }}
          '''
          out_path.write_text(source, encoding='utf-8')
          PY
          rm -rf "$TMP"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile full patched source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-notifications-v2"
          OUT="$GITHUB_WORKSPACE/out-notifications-v2"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000099-HCF-Notifications-v2-Patch-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev' versionCode='10000099' versionName='1.0 (10000099)'" "$OUT/APK-BADGING.txt"

          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          for marker in \
            hcf_notification_channels_v2 \
            hcf_alerts_v2 \
            hcf_silent_alerts_v2 \
            hcf_test_alerts_v2 \
            hcf_alerts_group_v2 \
            hcf_silent_status_group_v2 \
            'Silence HCF Silent Alerts' \
            'scheduled jobs only'; do
            grep -Fq "$marker" "$OUT/DEX-STRINGS.txt"
          done
          ! grep -Fq 'live_service_preserved' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'required live-service notification stays on' "$OUT/DEX-STRINGS.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"

      - name: Upload patch build
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000099-HCF-Notifications-v2-Patch-Unsigned
          path: out-notifications-v2/
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified Java changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f 'source code/src/com/harleytg/forum/HcfDiscordSecret.java'
          rm -f '.github/workflows/apply-hcf-notifications-v2.yml'
          rm -f '.github/workflows/apply-hcf-notifications-v2-retry.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement HCF Notifications v2'
          git push origin HEAD:dev

      - name: Remove outdated branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in ci/apply-startup-setup-ban-fix ci/fix-silent-alert-toggle ci/stable-dev-sync-validation-20260824; do
            git push origin --delete "$branch"
          done
          git ls-remote --heads origin | tee /tmp/heads.txt
          grep -q 'refs/heads/main$' /tmp/heads.txt
          grep -q 'refs/heads/stable$' /tmp/heads.txt
          grep -q 'refs/heads/dev$' /tmp/heads.txt
          test "$(wc -l < /tmp/heads.txt)" -eq 3
