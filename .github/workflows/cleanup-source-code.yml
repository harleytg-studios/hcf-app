name: Clean unused DEV source

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/cleanup-source-code.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Clean source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('source code')

          # MainActivity: remove obsolete hidden bottom navigation implementation.
          p = root/'src/com/harleytg/forum/MainActivity.java'
          s = p.read_text()
          for line in [
              '    private View bottomNav;\n',
              '    private TextView bottomHome;\n',
              '    private TextView bottomBrowse;\n',
              '    private TextView bottomCreate;\n',
              '    private TextView bottomAlerts;\n',
              '    private TextView bottomProfile;\n',
              '            FaIcons.applyTop(bottomHome, R.drawable.fa_house);\n',
              '            FaIcons.applyTop(bottomBrowse, R.drawable.fa_list);\n',
              '            FaIcons.applyTop(bottomCreate, R.drawable.fa_plus);\n',
              '            FaIcons.applyTop(bottomAlerts, R.drawable.fa_bell);\n',
              '            FaIcons.applyTop(bottomProfile, R.drawable.fa_user);\n',
              '                            .remove(AppPrefs.SHOW_BOTTOM_NAV)\n',
              '        bottomNav = findViewById(R.id.bottomNav);\n',
              '        bottomHome = findViewById(R.id.bottomHome);\n',
              '        bottomBrowse = findViewById(R.id.bottomBrowse);\n',
              '        bottomCreate = findViewById(R.id.bottomCreate);\n',
              '        bottomAlerts = findViewById(R.id.bottomAlerts);\n',
              '        bottomProfile = findViewById(R.id.bottomProfile);\n',
              '        bottomHome.setOnClickListener(v -> navigateForumPath("/", "bottom_home"));\n',
              '        bottomBrowse.setOnClickListener(v -> navigateForumPath("/all", "bottom_browse"));\n',
              '        bottomCreate.setOnClickListener(v -> navigateForumPath("/compose", "bottom_create"));\n',
              '        bottomAlerts.setOnClickListener(v -> navigateForumPath("/notifications", "bottom_alerts"));\n',
              '        bottomProfile.setOnClickListener(v -> openCurrentProfile());\n',
              '        if (bottomNav != null) bottomNav.setVisibility(View.GONE);\n',
          ]:
              s = s.replace(line, '')
          s = re.sub(r'\n\s*if \(bottomAlerts != null\) \{\n\s*bottomAlerts\.setText\(safe > 0 \? badge \+ "\\nAlerts" : "Alerts"\);\n\s*bottomAlerts\.setTextColor\(getColor\(safe > 0 \? R\.color\.hcf_cyan_bright : R\.color\.hcf_muted\)\);\n\s*\}\n', '\n', s)
          p.write_text(s)

          # Remove obsolete preference keys and unused Firebase config scaffolding.
          p = root/'src/com/harleytg/forum/AppPrefs.java'
          s = p.read_text()
          for line in [
              '    static final String SHOW_BOTTOM_NAV = "show_bottom_nav";\n',
              '    static final String FIREBASE_CONFIG_URL = "firebase_config_url";\n',
              '    static final String FIREBASE_CONFIG_CACHE = "firebase_config_cache";\n',
              '    static final String FIREBASE_CONFIG_SOURCE = "firebase_config_source";\n',
          ]:
              s = s.replace(line, '')
          p.write_text(s)

          p = root/'src/com/harleytg/forum/UiPreferences.java'
          s = p.read_text()
          s = s.replace('        // Preserve the compact native header and no-bottom-nav layout while advancing\n        // the migration marker for the diagnostics/title-case stability pass.\n', '        // Preserve the compact native header while advancing the migration marker.\n')
          s = s.replace('                .putBoolean(AppPrefs.COMPACT_HEADER, true)\n                .putBoolean(AppPrefs.SHOW_BOTTOM_NAV, false)\n                .putInt(AppPrefs.UI_REVAMP_VERSION, CURRENT_REVAMP);', '                .putBoolean(AppPrefs.COMPACT_HEADER, true)\n                .putInt(AppPrefs.UI_REVAMP_VERSION, CURRENT_REVAMP);')
          for line in [
              '                AppPrefs.SHOW_BOTTOM_NAV,\n',
              '                AppPrefs.FIREBASE_CONFIG_URL,\n',
              '                AppPrefs.FIREBASE_CONFIG_CACHE,\n',
              '                AppPrefs.FIREBASE_CONFIG_SOURCE,\n',
          ]:
              s = s.replace(line, '')
          p.write_text(s)

          # Remove bottom navigation XML from the main layout.
          p = root/'res/layout/activity_main.xml'
          s = p.read_text()
          marker = '        <LinearLayout\n            android:id="@+id/bottomNav"'
          if marker in s:
              start = s.index(marker)
              end = s.index('        </LinearLayout>\n    </LinearLayout>', start) + len('        </LinearLayout>\n')
              s = s[:start] + s[end:]
          p.write_text(s)

          # Assets directory is no longer needed by the build.
          p = root/'build-release.sh'
          s = p.read_text().replace('  -S "$project_dir/res" \\\n  -A "$project_dir/assets" \\\n  -I "$android_jar" \\\n', '  -S "$project_dir/res" \\\n  -I "$android_jar" \\\n')
          p.write_text(s)

          # Remove unused values.
          for file, names in [
              (root/'res/values/strings.xml', ['status_checking','status_unavailable','settings']),
              (root/'res/values/colors.xml', ['hcf_surface2','hcf_chip_selected_text','hcf_startup_start','hcf_startup_end','transparent','hcf_logs_viewer','hcf_chip_selected_bg','hcf_host_badge_bg','hcf_settings_button_bg','hcf_settings_button_pressed','hcf_settings_hero_start','hcf_settings_hero_center','hcf_settings_hero_end','hcf_url_overlay','hcf_url_overlay_border']),
          ]:
              s = file.read_text()
              tag = 'string' if file.name == 'strings.xml' else 'color'
              for name in names:
                  s = re.sub(r'\n\s*<'+tag+r' name="'+re.escape(name)+r'">.*?</'+tag+r'>', '', s)
              file.write_text(s)

          for p in root.glob('res/values*/dimens.xml'):
              s = re.sub(r'\n\s*<dimen name="bottom_nav_height">.*?</dimen>', '', p.read_text())
              p.write_text(s)

          p = root/'res/values/styles.xml'
          s = re.sub(r'\n\s*<style name="HcfBottomNavItem".*?</style>', '', p.read_text(), flags=re.S)
          p.write_text(s)

          # Historical notes are not part of the buildable source tree.
          for p in list(root.iterdir()):
              if p.is_file() and p.suffix.lower() in {'.md', '.txt'}:
                  p.unlink()

          # Remove unused code/assets and duplicate launcher resources.
          for p in [root/'src/com/harleytg/forum/FirebaseConfigLoader.java', root/'assets/firebase-config.js']:
              if p.exists(): p.unlink()
          if (root/'assets').exists() and not any((root/'assets').iterdir()):
              (root/'assets').rmdir()
          if (root/'branding').exists():
              shutil.rmtree(root/'branding')
          for d in (root/'res').glob('mipmap-*'):
              if d.is_dir(): shutil.rmtree(d)

          for name in [
              'bottom_bar_background','bottom_nav_action_background','bottom_nav_item_background','dev_badge_background',
              'fa_arrow_right','fa_check','host_badge_background','htg_icon_foreground','logs_action_background',
              'logs_chip_background','logs_chip_selected_background','logs_segment_background','logs_segment_selected_background',
              'logs_status_background','logs_viewer_background','panel_background','settings_button_background',
              'settings_hero_background','startup_card_background','url_bar_background'
          ]:
              p = root/'res/drawable'/(name + '.xml')
              if p.exists(): p.unlink()

          (root/'README.md').write_text("""# Harley's Clan Forum [Beta] — Android Source

Current source for the DEV/Beta Android app.

- Package: `com.harleytg.forum.dev`
- Version: `1.0`
- versionCode: `10000032`
- Min SDK: 26
- Target SDK: 34

## Project layout

- `src/` — Java source
- `res/` — Android resources
- `AndroidManifest.xml` — app manifest
- `build-release.sh` — release build/signing script
- `app-links/` — Digital Asset Links files for supported forum hosts

Historical patch notes, duplicate branding assets, obsolete bottom-navigation code/resources, unused Firebase config scaffolding, and unreferenced resources were removed. Signing keys and passwords are intentionally not stored in the repository.
""")
          PY

      - name: Verify cleaned resources and Java
        shell: bash
        run: |
          set -euo pipefail
          ROOT="source code"
          ! grep -R -n -E 'SHOW_BOTTOM_NAV|FirebaseConfigLoader|FIREBASE_CONFIG_|firebase-config\.js|bottomNav|bottomHome|bottomBrowse|bottomCreate|bottomAlerts|bottomProfile' "$ROOT/src" "$ROOT/res" "$ROOT/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('source code')
          for p in list((root/'res').rglob('*.xml')) + [root/'AndroidManifest.xml']:
              ET.parse(p)
          print('XML verification: PASS')
          PY
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          ANDROID_JAR="$SDK/platforms/android-35/android.jar"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/gen" "$WORK/classes"
          "$AAPT" package -f -m -J "$WORK/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -I "$ANDROID_JAR"
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" $(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          echo "Java/resource compile: PASS"

      - name: Commit cleaned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/cleanup-source-code.yml
          git add -A "source code"
          git commit -m "Clean unused v10000032 source files"
          git push origin HEAD:dev
