name: Restore dev source to v10000033

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Replace source code from v10000033 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="HCF-Beta-v10000033-v2key-source.zip"
          TARGET="source code"
          TEMP=".restore-v10000033"
          WORKFLOW=".github/workflows/restore-v10000033-source.yml"

          test -f "$ZIP"
          rm -rf "$TARGET" "$TEMP"
          mkdir -p "$TEMP" "$TARGET"
          unzip -q "$ZIP" -d "$TEMP"
          cp -a "$TEMP"/. "$TARGET"/
          rm -rf "$TEMP"

          FILE_COUNT="$(find "$TARGET" -type f | wc -l | tr -d ' ')"
          test "$FILE_COUNT" -eq 179

          rm -f "$WORKFLOW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$TARGET" "$WORKFLOW"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Restore dev source code to v10000033"
          git push origin HEAD:dev
