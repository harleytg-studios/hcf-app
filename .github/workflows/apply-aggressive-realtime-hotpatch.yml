name: Apply aggressive realtime hotpatch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-aggressive-realtime-hotpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply realtime patch
        run: python3 .github/scripts/apply-aggressive-realtime-hotpatch.py

      - name: Validate diff
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "source code/src/com/harleytg/forum/HcfApplication.java" \
                  "source code/src/com/harleytg/forum/HcfForumEngine.java" \
                  "source code/src/com/harleytg/forum/HcfNotificationEngine.java" \
                  "source code/src/com/harleytg/forum/HcfMainActivities.java"
          git commit -m "perf(dev): enable ultra-low-latency realtime updates"
          git push origin HEAD:dev
