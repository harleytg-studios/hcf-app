name: Build HCF v10000080 APKs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v10000080-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record build run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/V10000080-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record v10000080 build run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

  build:
    needs: record
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Stable
            ref: stable
            package: com.harleytg.forum
            output: HCF-Stable-v10000080
          - label: Beta
            ref: dev
            package: com.harleytg.forum.dev
            output: HCF-Beta-v10000080

    steps:
      - name: Checkout ${{ matrix.label }} source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app-repo

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Normalize v10000080 visible release identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/app-repo/source code"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app-repo/source code')
          release = root / 'src/com/harleytg/forum/ReleaseNotes.java'
          if release.exists():
              s = release.read_text(encoding='utf-8')
              for old in ('10000072','10000077','10000078','10000079'):
                  s = s.replace(old, '10000080')
              release.write_text(s, encoding='utf-8')
          PY
          if [[ "${{ matrix.ref }}" == "dev" ]]; then
            rm -f "$ROOT/res/values/public.xml"
          fi
          grep -q 'android:versionCode="10000080"' "$ROOT/AndroidManifest.xml"
          grep -q 'android:versionName="1.0 (10000080)"' "$ROOT/AndroidManifest.xml"
          grep -q 'package="${{ matrix.package }}"' "$ROOT/AndroidManifest.xml"

      - name: Compile and align ${{ matrix.label }} APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/app-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-${{ matrix.ref }}"
          OUT="$GITHUB_WORKSPACE/out-${{ matrix.ref }}"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"

          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release \
            --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/${{ matrix.output }}-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/${{ matrix.output }}-aligned-unsigned.apk"
          "$BT/aapt" dump badging "$OUT/${{ matrix.output }}-aligned-unsigned.apk" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='${{ matrix.package }}'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000080'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000080)'" "$OUT/APK-BADGING.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"

      - name: Upload ${{ matrix.label }} unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: hcf-${{ matrix.ref }}-v10000080-unsigned
          path: out-${{ matrix.ref }}/
          if-no-files-found: error
          retention-days: 1
