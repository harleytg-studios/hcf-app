name: Unpack v10000032 source

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/unpack-v10000032-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "source code"
          mkdir -p "source code"
          unzip -q "HCF-Beta-v10000032-source(1).zip" -d "source code"
          find "source code" -type f \( -name '*.keystore' -o -name '*.jks' -o -name '*password*' -o -name '*signing-backup*' \) -delete

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "source code"
          if git diff --cached --quiet; then
            echo "Source code folder already matches archive."
            exit 0
          fi
          git commit -m "Unpack v10000032 source into source code"
          git push origin HEAD:dev
