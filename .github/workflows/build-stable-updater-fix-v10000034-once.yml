name: Build Stable v10000034 Updater Fix Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-stable-updater-fix-v10000034-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater-fix source
        uses: actions/checkout@v4
        with:
          ref: fix/stable-updater-unavailable-v10000034
          path: fix-repo

      - name: Checkout main metadata branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          token: ${{ github.token }}

      - name: Record build run ID
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE/main-repo"
          mkdir -p "$REPO/build-output"
          printf 'run_id=%s\nartifact=HCF-Stable-v10000034-UpdaterFix-unsigned\nsource_branch=fix/stable-updater-unavailable-v10000034\n' \
            "$GITHUB_RUN_ID" > "$REPO/build-output/STABLE-V10000034-UPDATER-FIX-RUN.txt"
          cd "$REPO"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/STABLE-V10000034-UPDATER-FIX-RUN.txt
          git commit -m '[skip ci] Record Stable v10000034 updater-fix run'
          git push origin HEAD:main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Android SDK and install components
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$RUNNER_TEMP/cmdline-tools.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$RUNNER_TEMP/cmdline-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-unpacked"
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/cmdline-unpacked/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Compile unsigned Stable updater-fix APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/fix-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-stable-v10000034-updater-fix"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          grep -q 'package="com.harleytg.forum"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionCode="10000034"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionName="1.0 (10000034)"' "$SRC/AndroidManifest.xml"
          grep -q 'releases/latest' "$SRC/src/com/harleytg/forum/UpdateChecker.java"
          grep -q 'latest/download' "$SRC/src/com/harleytg/forum/UpdateChecker.java"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$SRC/AndroidManifest.xml" \
            -S "$SRC/res" \
            -A "$SRC/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          find "$WORK/gen" "$SRC/src" -name '*.java' -print0 | \
            xargs -0 javac \
              --release 8 \
              -classpath "$ANDROID_JAR" \
              -d "$WORK/classes"

          find "$WORK/classes" -name '*.class' -print0 | \
            xargs -0 "$BT/d8" \
              --lib "$ANDROID_JAR" \
              --min-api 26 \
              --release \
              --output "$WORK/dex"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (
            cd "$WORK/dex"
            "$BT/aapt" add "$WORK/unsigned.apk" classes.dex
          )
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Stable-v10000034-UpdaterFix-unsigned.apk"

      - name: Verify unsigned package
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/out/HCF-Stable-v10000034-UpdaterFix-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "package: name='com.harleytg.forum' versionCode='10000034' versionName='1.0 (10000034)'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          unzip -t "$APK" | tee "$GITHUB_WORKSPACE/out/ZIP-VERIFY.txt"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/out/APK-SHA256.txt"

      - name: Upload unsigned artifact and signer tooling
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000034-UpdaterFix-unsigned
          path: |
            out/HCF-Stable-v10000034-UpdaterFix-unsigned.apk
            out/APK-BADGING.txt
            out/ZIP-VERIFY.txt
            out/APK-SHA256.txt
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
