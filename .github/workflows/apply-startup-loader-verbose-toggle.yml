name: Apply Startup Loader Verbose Toggle

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-startup-loader-verbose-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Add startup-loader verbosity setting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui_path = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          settings_path = Path('source code/src/com/harleytg/forum/HcfSubActivities.java')

          ui = ui_path.read_text(encoding='utf-8')
          settings = settings_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Search/index entry in Settings.
          settings = replace_once(
              settings,
              '                new SettingTarget("show_startup_screen", "Show startup connection screen", "startup launch connection screen", "appearance", "appearance_performance"),\n',
              '                new SettingTarget("show_startup_screen", "Show startup connection screen", "startup launch connection screen", "appearance", "appearance_performance"),\n'
              '                new SettingTarget("verbose_startup_loader", "Verbose startup loader", "startup loading detailed checks progress completed verbose compact", "appearance", "appearance_performance"),\n',
              'settings search target')

          # Native Appearance & Performance subsetting.
          settings = replace_once(
              settings,
              '            Switch startup = target(toggle("Show startup connection screen", prefs.getBoolean("show_startup_screen", true)), "show_startup_screen");\n'
              '            startup.setOnCheckedChangeListener((button, checked) -> prefs.edit().putBoolean("show_startup_screen", checked).apply());\n'
              '            card.addView(startup);\n'
              '            card.addView(text("Header: Classic compact • bottom app bar removed", 11, getColor(R.color.hcf_cyan)));\n',
              '            Switch startup = target(toggle("Show startup connection screen", prefs.getBoolean("show_startup_screen", true)), "show_startup_screen");\n'
              '            startup.setOnCheckedChangeListener((button, checked) -> prefs.edit().putBoolean("show_startup_screen", checked).apply());\n'
              '            card.addView(startup);\n'
              '            Switch verboseStartup = target(toggle("Verbose startup loader", prefs.getBoolean("startup_loader_verbose", true)), "verbose_startup_loader");\n'
              '            verboseStartup.setOnCheckedChangeListener((button, checked) -> {\n'
              '                prefs.edit().putBoolean("startup_loader_verbose", checked).apply();\n'
              '                AppLogger.info(this, "setting_startup_loader_verbose", Boolean.toString(checked));\n'
              '                Toast.makeText(this, checked ? "Detailed startup checks enabled." : "Startup loader will use the compact view.", Toast.LENGTH_SHORT).show();\n'
              '            });\n'
              '            card.addView(verboseStartup);\n'
              '            card.addView(text("When off, every startup safety and system check still runs; only the detailed descriptions and completed-check list are hidden.", 10, getColor(R.color.hcf_muted)));\n'
              '            card.addView(text("Header: Classic compact • bottom app bar removed", 11, getColor(R.color.hcf_cyan)));\n',
              'appearance setting')

          # Loader preference and UI state.
          ui = replace_once(
              ui,
              '        private static final String PREF_STARTUP_LAST_GOOD_HOST = "startup_last_good_host";\n',
              '        private static final String PREF_STARTUP_LAST_GOOD_HOST = "startup_last_good_host";\n'
              '        private static final String PREF_STARTUP_LOADER_VERBOSE = "startup_loader_verbose";\n',
              'loader preference constant')

          ui = replace_once(
              ui,
              '        private TextView loaderPercent;\n        private TextView completedTicker;\n',
              '        private TextView loaderPercent;\n        private TextView completedLabel;\n        private TextView completedTicker;\n',
              'completed label field')

          ui = replace_once(
              ui,
              '        private boolean quickPath;\n',
              '        private boolean quickPath;\n        private boolean verboseLoader = true;\n',
              'verbose state field')

          ui = replace_once(
              ui,
              '            TextView completedLabel = text("COMPLETED CHECKS", 9, getColor(R.color.hcf_meta));\n',
              '            completedLabel = text("COMPLETED CHECKS", 9, getColor(R.color.hcf_meta));\n',
              'completed label assignment')

          ui = replace_once(
              ui,
              '            completedWeight = 0;\n            loaderStarted = true;\n',
              '            completedWeight = 0;\n            verboseLoader = prefs == null || prefs.getBoolean(PREF_STARTUP_LOADER_VERBOSE, true);\n            loaderStarted = true;\n',
              'loader verbosity read')

          ui = replace_once(
              ui,
              '            resetLoaderVisuals();\n            animateLogoEntrance();\n',
              '            resetLoaderVisuals();\n            applyLoaderVerbosity();\n            animateLogoEntrance();\n',
              'apply verbosity at startup')

          marker = '''        private void resetLoaderVisuals() {\n            stopLoaderAnimations();\n            completedSteps.clear();\n'''
          replacement = '''        private void applyLoaderVerbosity() {\n            boolean verbose = prefs == null || prefs.getBoolean(PREF_STARTUP_LOADER_VERBOSE, true);\n            verboseLoader = verbose;\n            int visibility = verbose ? View.VISIBLE : View.GONE;\n            if (loaderDetail != null) loaderDetail.setVisibility(visibility);\n            if (completedLabel != null) completedLabel.setVisibility(visibility);\n            if (completedTicker != null) completedTicker.setVisibility(visibility);\n            if (loaderStatus != null) {\n                loaderStatus.setContentDescription(verbose\n                        ? "Startup check status with detailed diagnostics"\n                        : "Startup check status");\n            }\n        }\n\n        private void resetLoaderVisuals() {\n            stopLoaderAnimations();\n            completedSteps.clear();\n'''
          ui = replace_once(ui, marker, replacement, 'verbosity helper')

          ui = replace_once(
              ui,
              '            if (completedTicker != null) completedTicker.setText("Waiting for completed checks…");\n            if (retryButton != null) retryButton.setVisibility(View.GONE);\n',
              '            if (completedTicker != null) completedTicker.setText("Waiting for completed checks…");\n            applyLoaderVerbosity();\n            if (retryButton != null) retryButton.setVisibility(View.GONE);\n',
              'retry/reset verbosity')

          # A hard failure must always expose its explanation, even in compact mode.
          ui = replace_once(
              ui,
              '                    if (loaderStatus != null) loaderStatus.setText("Startup paused");\n',
              '                    if (loaderStatus != null) loaderStatus.setText("Startup paused");\n'
              '                    if (loaderDetail != null) loaderDetail.setVisibility(View.VISIBLE);\n',
              'hard failure detail visibility')

          ui_path.write_text(ui, encoding='utf-8')
          settings_path.write_text(settings, encoding='utf-8')

          # Source-level guards.
          assert 'PREF_STARTUP_LOADER_VERBOSE = "startup_loader_verbose"' in ui
          assert 'private void applyLoaderVerbosity()' in ui
          assert 'completedLabel.setVisibility(visibility)' in ui
          assert 'loaderDetail.setVisibility(View.VISIBLE)' in ui
          assert 'Verbose startup loader' in settings
          assert 'putBoolean("startup_loader_verbose", checked)' in settings
          assert 'every startup safety and system check still runs' in settings
          print('Startup loader verbosity setting patched successfully.')
          PY

      - name: Verify patch source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PREF_STARTUP_LOADER_VERBOSE = "startup_loader_verbose"' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'private void applyLoaderVerbosity()' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'Verbose startup loader' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          grep -Fq 'putBoolean("startup_loader_verbose", checked)' 'source code/src/com/harleytg/forum/HcfSubActivities.java'

      - name: Commit source change and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f '.github/workflows/apply-startup-loader-verbose-toggle.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/HcfUITheme.java' \
                  'source code/src/com/harleytg/forum/HcfSubActivities.java' \
                  '.github/workflows/apply-startup-loader-verbose-toggle.yml'
          git diff --cached --check
          git commit -m 'Add compact startup loader setting'
          git push origin HEAD:dev

      - name: Run Beta v10000098 release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-dev-v10000098.yml --ref dev
