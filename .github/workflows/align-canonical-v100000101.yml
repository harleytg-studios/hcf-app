name: Align canonical v100000101 workflow reference

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/align-canonical-v100000101.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Align release verifier workflow filename
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/verify-release-readiness.py')
          text = path.read_text(encoding='utf-8')
          old = 'require("canonical v10000099 workflow missing", any(path.name == "build-dev-v10000099.yml" for path in workflows))'
          new = 'require("canonical v100000101 workflow missing", any(path.name == "build-dev-v100000101.yml" for path in workflows))'
          if old not in text:
              raise SystemExit('Old canonical workflow assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/verify-release-readiness.py
          git diff --cached --check
          git commit -m 'Use canonical v100000101 release workflow'
          git push origin HEAD:dev
