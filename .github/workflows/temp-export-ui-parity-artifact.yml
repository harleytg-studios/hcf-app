name: TEMP Export Stable UI Parity Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-export-ui-parity-artifact.yml'

permissions:
  contents: write

jobs:
  export-parity-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Record export run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/TEMP-UI-PARITY-EXPORT-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record parity artifact export run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout temporary parity output
        uses: actions/checkout@v4
        with:
          ref: stable-ui-parity-test

      - name: Verify parity output exists
        shell: bash
        run: |
          set -euo pipefail
          test -f build-output/ui-parity-v10000076/HCF-Stable-v10000076-UI-Parity-aligned-unsigned.apk
          test -f build-output/ui-parity-v10000076/apksigner.jar
          cat build-output/ui-parity-v10000076/APK-BADGING.txt

      - name: Upload parity build files
        uses: actions/upload-artifact@v4
        with:
          name: hcf-stable-v10000076-parity-files
          path: build-output/ui-parity-v10000076/
          if-no-files-found: error
          retention-days: 1
