name: Apply v10000098 Native Settings Route Fix
# complete in-app URL routing pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-existing-loader-fix-v10000098.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main control
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 0

      - name: Record route-fix run
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/control"
          mkdir -p build-output
          cat > build-output/V10000098-APP-SETTINGS-ROUTE.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          status=started
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/V10000098-APP-SETTINGS-ROUTE.txt
          git commit -m 'Record v10000098 settings-route fix run' || true
          git push origin HEAD:main

      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: app-repo
          fetch-depth: 0

      - name: Recognize HTTPS /app/settings everywhere in app
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app-repo"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source code/src/com/harleytg/forum/HcfMainActivities.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          # One canonical route matcher handles the HTTPS app URL and the existing custom scheme.
          if 'private boolean isNativeSettingsRoute(Uri uri)' not in text:
              anchor = '''        /* JADX INFO: Access modifiers changed from: private */
        public boolean isNativeInstallRoute(Uri uri) {'''
              helper = '''        /** Native App Settings route for both public HCF URLs and the legacy custom scheme. */
        private boolean isNativeSettingsRoute(Uri uri) {
            if (uri == null) {
                return false;
            }
            if ("hcf-app".equalsIgnoreCase(uri.getScheme())
                    && "settings".equalsIgnoreCase(uri.getHost())) {
                return true;
            }
            if (!ForumUrlRouter.isForumUrl(uri)) {
                return false;
            }
            String path = uri.getPath();
            if (path == null) {
                return false;
            }
            String normalized = path.trim().toLowerCase(Locale.US);
            while (normalized.length() > 1 && normalized.endsWith("/")) {
                normalized = normalized.substring(0, normalized.length() - 1);
            }
            return "/app/settings".equals(normalized);
        }

'''
              if anchor not in text:
                  raise SystemExit('native install route anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          # Cold Android App Link: open native Settings instead of loading the web route.
          if 'openAppSettings("app_link_https")' not in text:
              replace_once(
                  '''                Uri data = getIntent() == null ? null : getIntent().getData();
                if (ForumUrlRouter.isForumUrl(data)) {''',
                  '''                Uri data = getIntent() == null ? null : getIntent().getData();
                if (isNativeSettingsRoute(data)) {
                    openAppSettings("app_link_https");
                    // Keep forum home ready behind native Settings instead of loading /app/settings.
                    data = null;
                }
                if (ForumUrlRouter.isForumUrl(data)) {''',
                  'cold app-link route')

          # URL typed into HCF's own address bar.
          if 'openAppSettings("address_bar")' not in text:
              replace_once(
                  '''                showUnavailable(externalBlocked, uri);
                return;
            }
            if (uri.getHost() != null) {''',
                  '''                showUnavailable(externalBlocked, uri);
                return;
            }
            if (isNativeSettingsRoute(uri)) {
                hideKeyboardAndReleaseAddressBar();
                openAppSettings("address_bar");
                return;
            }
            if (uri.getHost() != null) {''',
                  'address-bar route')

          # Flarum SPA/history navigation can bypass WebView's normal URL override callback.
          if 'openAppSettings("spa_route")' not in text:
              marker = '        public void handleSpaRouteChange(String str) {'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit('SPA route method missing')
              end = text.find('\n        private void updateDrawerActiveState', start)
              if end < 0:
                  raise SystemExit('SPA route method end missing')
              section = text[start:end]
              old = '''                Uri parse = Uri.parse(str);
                if (ForumUrlRouter.isForumUrl(parse)) {'''
              new = '''                Uri parse = Uri.parse(str);
                if (isNativeSettingsRoute(parse)) {
                    openAppSettings("spa_route");
                    return;
                }
                if (ForumUrlRouter.isForumUrl(parse)) {'''
              if section.count(old) != 1:
                  raise SystemExit(f'SPA route insertion expected one match, found {section.count(old)}')
              section = section.replace(old, new, 1)
              text = text[:start] + section + text[end:]

          # New App Link received while MainActivity is already alive.
          if 'openAppSettings("new_intent_https")' not in text:
              replace_once(
                  '''            Uri data = intent.getData();
            if (ForumUrlRouter.isForumUrl(data)) {''',
                  '''            Uri data = intent.getData();
            if (isNativeSettingsRoute(data)) {
                openAppSettings("new_intent_https");
                return;
            }
            if (ForumUrlRouter.isForumUrl(data)) {''',
                  'new-intent route')

          # Normal WebView navigation/click before the generic forum-host branch accepts it.
          if 'openAppSettings("in_app_url")' not in text:
              replace_once(
                  '''                Uri url = webResourceRequest.getUrl();
                if (MainActivity.this.isNativeInstallRoute(url)) {''',
                  '''                Uri url = webResourceRequest.getUrl();
                if (MainActivity.this.isNativeSettingsRoute(url)) {
                    MainActivity.this.openAppSettings("in_app_url");
                    return true;
                }
                if (MainActivity.this.isNativeInstallRoute(url)) {''',
                  'WebView route')

          # Last-resort interception if a WebView navigation has already begun.
          if 'openAppSettings("page_started")' not in text:
              marker = '            public void onPageStarted(WebView webView, String str, Bitmap bitmap) {'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit('onPageStarted missing')
              end = text.find('\n            @Override // android.webkit.WebViewClient\n            public void onPageCommitVisible', start)
              if end < 0:
                  raise SystemExit('onPageStarted end missing')
              section = text[start:end]
              old = '''                Uri parse = Uri.parse(str);
                if (!MainActivity.this.isNativeInstallRoute(parse)) {'''
              new = '''                Uri parse = Uri.parse(str);
                if (MainActivity.this.isNativeSettingsRoute(parse)) {
                    try {
                        webView.stopLoading();
                    } catch (Throwable ignored) {
                    }
                    MainActivity.this.openAppSettings("page_started");
                    return;
                }
                if (!MainActivity.this.isNativeInstallRoute(parse)) {'''
              if section.count(old) != 1:
                  raise SystemExit(f'onPageStarted insertion expected one match, found {section.count(old)}')
              section = section.replace(old, new, 1)
              text = text[:start] + section + text[end:]

          required = [
              'return "/app/settings".equals(normalized);',
              'openAppSettings("app_link_https")',
              'openAppSettings("address_bar")',
              'openAppSettings("spa_route")',
              'openAppSettings("new_intent_https")',
              'openAppSettings("in_app_url")',
              'openAppSettings("page_started")',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit('missing route guard: ' + item)

          path.write_text(text, encoding='utf-8')
          print('All /app/settings ingress paths now route to native App Settings.')
          PY

      - name: Compile-level source sanity
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app-repo"
          grep -Fq 'return "/app/settings".equals(normalized);' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'openAppSettings("in_app_url")' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'openAppSettings("app_link_https")' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'openAppSettings("new_intent_https")' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'openAppSettings("spa_route")' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'openAppSettings("address_bar")' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'openAppSettings("page_started")' 'source code/src/com/harleytg/forum/HcfMainActivities.java'

      - name: Commit route fix to Dev
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app-repo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          if git diff --cached --quiet; then
            echo 'Native /app/settings route already fixed.'
          else
            git commit -m 'Recognize /app/settings as native App Settings URL'
            git push origin HEAD:dev
          fi

      - name: Mark route fix successful
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/control"
          git pull --ff-only origin main
          cat > build-output/V10000098-APP-SETTINGS-ROUTE.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          status=success
          EOF
          git add build-output/V10000098-APP-SETTINGS-ROUTE.txt
          git commit -m 'Mark v10000098 settings-route fix successful' || true
          git push origin HEAD:main
