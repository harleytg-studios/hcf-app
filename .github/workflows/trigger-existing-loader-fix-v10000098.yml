name: Apply v10000098 Existing Loader Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-existing-loader-fix-v10000098.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Use original HCF loader for ban checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('source code/AndroidManifest.xml')
          ban = Path('source code/src/com/harleytg/forum/HcfBanSystem.java')
          ui = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          session = Path('source code/src/com/harleytg/forum/HcfSessionPersistence.java')

          # Remove the temporary replacement loader class but keep cookie persistence.
          s = session.read_text(encoding='utf-8')
          marker = '    /**\n     * The only visible native startup loader.'
          bootstrap = '    /** Installs persistence before the first Activity/WebView is created. */'
          if 'class SingleLoaderActivity' in s:
              begin = s.index(marker)
              end = s.index(bootstrap, begin)
              s = s[:begin] + s[end:]
              session.write_text(s, encoding='utf-8')

          # Original HcfUITheme.StartupActivity is the sole launcher and App Link entry.
          m = manifest.read_text(encoding='utf-8')
          start = m.index('        <activity android:name="com.harleytg.forum.dev.HcfUITheme$StartupActivity"')
          end = m.index('        <service android:name="com.harleytg.forum.dev.HcfNotificationEngine$InstantNotificationService"', start)
          replacement = '\n'.join([
              '        <activity android:name="com.harleytg.forum.dev.HcfUITheme$StartupActivity" android:exported="true" android:launchMode="singleTop">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MAIN"/>',
              '                <category android:name="android.intent.category.LAUNCHER"/>',
              '            </intent-filter>',
              '            <intent-filter android:autoVerify="true">',
              '                <action android:name="android.intent.action.VIEW"/>',
              '                <category android:name="android.intent.category.DEFAULT"/>',
              '                <category android:name="android.intent.category.BROWSABLE"/>',
              '                <data android:scheme="https" android:host="forum.harleytg.com"/>',
              '            </intent-filter>',
              '            <intent-filter android:autoVerify="true">',
              '                <action android:name="android.intent.action.VIEW"/>',
              '                <category android:name="android.intent.category.DEFAULT"/>',
              '                <category android:name="android.intent.category.BROWSABLE"/>',
              '                <data android:scheme="https" android:host="harleysclan.freeflarum.com"/>',
              '            </intent-filter>',
              '        </activity>',
              '        <activity android:name="com.harleytg.forum.dev.HcfBanSystem$BanActivity" android:exported="false" android:launchMode="singleTop"/>',
              '        <activity android:name="com.harleytg.forum.dev.HcfBanSystem$GateActivity" android:exported="false" android:launchMode="singleTop"/>',
              ''
          ])
          m = m[:start] + replacement + m[end:]
          manifest.write_text(m, encoding='utf-8')

          # Expose one package-local ban check for the existing loader.
          b = ban.read_text(encoding='utf-8')
          if 'static CheckResult checkCurrentAccess(Context context)' not in b:
              anchor = '    private static RuntimeConfig loadRuntimeConfig(Context context) throws Exception {'
              helper = '\n'.join([
                  '    /** Runs the ban lookup as a stage of the existing HCF startup loader. */',
                  '    static CheckResult checkCurrentAccess(Context context) throws Exception {',
                  '        ForumIdentity.Snapshot identity = ForumIdentity.load(context);',
                  '        String username = identity != null && identity.loggedIn ? safe(identity.username) : "";',
                  '        RuntimeConfig config = loadRuntimeConfig(context);',
                  '        if (!config.ready()) {',
                  '            return new CheckResult(false, "", "", "", "", username, "", true);',
                  '        }',
                  '        PublicIp publicIp = resolvePublicIp(config);',
                  '        return checkBanList(config, identity, publicIp);',
                  '    }',
                  '',
                  ''
              ])
              if anchor not in b:
                  raise SystemExit('Ban helper insertion point missing')
              b = b.replace(anchor, helper + anchor, 1)
          b = b.replace(
              'startActivity(new Intent(BanActivity.this, GateActivity.class));',
              'startActivity(new Intent(BanActivity.this, HcfUITheme.StartupActivity.class));'
          )
          ban.write_text(b, encoding='utf-8')

          # Put the ban check inside the original pre-ban-system loading sequence.
          u = ui.read_text(encoding='utf-8')
          u = u.replace(
              '     * Welcome -> App Setup -> system checks -> header/URL handoff -> forum WebView.',
              '     * Welcome -> App Setup -> access check -> system checks -> header/URL handoff -> forum WebView.',
              1
          )
          if 'HcfBanSystem.checkCurrentAccess(this)' not in u:
              old = '        private void runSystemChecks() {\n            try {\n                prefs.getAll().size();\n                publishStage(12, "Loading native configuration", "Preferences and app configuration are readable.");'
              new = '\n'.join([
                  '        private void runSystemChecks() {',
                  '            try {',
                  '                publishStage(6, "Checking access status", "Checking account and network against the HCF ban list.");',
                  '                try {',
                  '                    HcfBanSystem.CheckResult access = HcfBanSystem.checkCurrentAccess(this);',
                  '                    if (access != null && access.banned) {',
                  '                        AppLogger.warn(this, "startup_ban_gate", "blocked | scope=" + access.scope + " | id=" + access.banId);',
                  '                        openAccessRestricted(access);',
                  '                        return;',
                  '                    }',
                  '                    publishStage(10, "Access allowed", "No active HCF ban was found.");',
                  '                } catch (Throwable accessError) {',
                  '                    AppLogger.warn(this, "startup_ban_gate", "fail-open | " + accessError.getClass().getSimpleName());',
                  '                    publishStage(10, "Access check unavailable", "The HCF ban list could not be reached; startup will continue.");',
                  '                }',
                  '',
                  '                HcfSessionPersistence.flushCookies();',
                  '                prefs.getAll().size();',
                  '                publishStage(12, "Loading native configuration", "Preferences and app configuration are readable.");'
              ])
              if old not in u:
                  raise SystemExit('Original loader system-check insertion point missing')
              u = u.replace(old, new, 1)

          if 'private void openAccessRestricted(final HcfBanSystem.CheckResult result)' not in u:
              anchor = '        private void beginChromeHandoff() {'
              method = '\n'.join([
                  '        private void openAccessRestricted(final HcfBanSystem.CheckResult result) {',
                  '            mainHandler.post(new Runnable() {',
                  '                @Override public void run() {',
                  '                    if (destroyed || isFinishing() || isDestroyed() || handoffStarted) return;',
                  '                    handoffStarted = true;',
                  '                    Intent intent = new Intent(StartupActivity.this, HcfBanSystem.BanActivity.class);',
                  '                    intent.putExtra("ban_id", result.banId);',
                  '                    intent.putExtra("reason", result.reason);',
                  '                    intent.putExtra("expires_at", result.expiresAt);',
                  '                    intent.putExtra("scope", result.scope);',
                  '                    intent.putExtra("username", result.username);',
                  '                    intent.putExtra("masked_ip", result.maskedIp);',
                  '                    intent.putExtra("appeal_allowed", result.appealAllowed);',
                  '                    startActivity(intent);',
                  '                    overridePendingTransition(0, 0);',
                  '                    finish();',
                  '                }',
                  '            });',
                  '        }',
                  '',
                  ''
              ])
              if anchor not in u:
                  raise SystemExit('Original loader handoff insertion point missing')
              u = u.replace(anchor, method + anchor, 1)

          u = u.replace(
              '        protected void onPause() {\n            resumed = false;\n            super.onPause();\n        }',
              '        protected void onPause() {\n            resumed = false;\n            HcfSessionPersistence.flushCookies();\n            super.onPause();\n        }',
              1
          )
          u = u.replace(
              '            mainHandler.removeCallbacksAndMessages(null);\n            destroyStartupWebView();\n            super.onDestroy();',
              '            mainHandler.removeCallbacksAndMessages(null);\n            HcfSessionPersistence.flushCookies();\n            destroyStartupWebView();\n            super.onDestroy();',
              1
          )
          ui.write_text(u, encoding='utf-8')

          # Assertions for the exact startup topology requested.
          m = manifest.read_text(encoding='utf-8')
          u = ui.read_text(encoding='utf-8')
          s = session.read_text(encoding='utf-8')
          if m.count('android.intent.category.LAUNCHER') != 1:
              raise SystemExit('Expected exactly one launcher')
          startup = m.split('HcfUITheme$StartupActivity', 1)[1].split('</activity>', 1)[0]
          if 'android.intent.category.LAUNCHER' not in startup:
              raise SystemExit('Original HCF loader is not launcher')
          if 'HcfSessionPersistence$SingleLoaderActivity' in m or 'class SingleLoaderActivity' in s:
              raise SystemExit('Temporary replacement loader still exists')
          if 'HcfBanSystem$GateActivity" android:exported="false"' not in m:
              raise SystemExit('Separate ban loader must be internal')
          if 'HcfBanSystem.checkCurrentAccess(this)' not in u:
              raise SystemExit('Ban check not integrated into original loader')
          print('PASS: original HCF loader is the only visible normal startup loader')
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          test "$(grep -c 'android.intent.category.LAUNCHER' 'source code/AndroidManifest.xml')" -eq 1
          grep -Fq 'HcfUITheme$StartupActivity" android:exported="true"' 'source code/AndroidManifest.xml'
          grep -Fq 'HcfBanSystem$GateActivity" android:exported="false"' 'source code/AndroidManifest.xml'
          ! grep -Fq 'HcfSessionPersistence$SingleLoaderActivity' 'source code/AndroidManifest.xml'

      - name: Commit fix to Dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/AndroidManifest.xml' \
                  'source code/src/com/harleytg/forum/HcfBanSystem.java' \
                  'source code/src/com/harleytg/forum/HcfUITheme.java' \
                  'source code/src/com/harleytg/forum/HcfSessionPersistence.java'
          if git diff --cached --quiet; then
            echo 'Original-loader fix already present.'
          else
            git commit -m 'Use existing startup loader for ban checks'
            git push origin HEAD:dev
          fi
