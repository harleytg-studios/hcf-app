name: Trigger v10000098 Existing Loader Fix
# rerun-with-status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-existing-loader-fix-v10000098.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record dispatcher run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          cat > build-output/V10000098-EXISTING-LOADER-FIX.txt <<EOF
          dispatcher_run_id=${GITHUB_RUN_ID}
          dispatcher_attempt=${GITHUB_RUN_ATTEMPT}
          status=dispatching
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/V10000098-EXISTING-LOADER-FIX.txt
          git commit -m 'Record existing-loader fix dispatch' || true
          git push origin HEAD:main

      - name: Dispatch original-loader fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/fix-existing-loader-v10000098.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Mark dispatcher successful
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cat > build-output/V10000098-EXISTING-LOADER-FIX.txt <<EOF
          dispatcher_run_id=${GITHUB_RUN_ID}
          dispatcher_attempt=${GITHUB_RUN_ATTEMPT}
          status=dispatched
          EOF
          git add build-output/V10000098-EXISTING-LOADER-FIX.txt
          git commit -m 'Mark existing-loader fix dispatched' || true
          git push origin HEAD:main
