name: Build HCF Beta v10000099 Permissions Patch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-permissions-patch-v10000099.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Verify patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-hcf-notifications-v2.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          grep -Fq 'Background battery access' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          grep -Fq 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          grep -Fq 'isIgnoringBatteryOptimizations' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          grep -Fq 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' 'source code/AndroidManifest.xml'
          grep -Fq 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' 'source code/AndroidManifest.xml'

      - name: Apply forum account onboarding
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-onboarding-account.py \
            'source code/src/com/harleytg/forum/HcfMainActivities.java' \
            'source code/src/com/harleytg/forum/HcfApplication.java'
          python3 .github/scripts/apply-onboarding-live-session.py \
            'source code/src/com/harleytg/forum/HcfMainActivities.java'

      - name: Generate encrypted Discord webhook binding
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 1; fi
          GEN_DIR="$GITHUB_WORKSPACE/source code/src/com/harleytg/forum"
          TMP="$RUNNER_TEMP/hcf-discord-secret"
          mkdir -p "$TMP"
          chmod 700 "$TMP"
          printf '%s' "$DISCORD_WEBHOOK_URL" > "$TMP/plain.txt"
          chmod 600 "$TMP/plain.txt"
          openssl rand 32 > "$TMP/key.bin"
          openssl rand 16 > "$TMP/iv.bin"
          KEY_HEX="$(xxd -p -c 256 "$TMP/key.bin")"
          IV_HEX="$(xxd -p -c 256 "$TMP/iv.bin")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in "$TMP/plain.txt" -out "$TMP/cipher.bin"
          python3 - "$TMP/key.bin" "$TMP/iv.bin" "$TMP/cipher.bin" "$GEN_DIR/HcfDiscordSecret.java" <<'PY'
          import pathlib, sys
          key_path, iv_path, cipher_path, out_path = map(pathlib.Path, sys.argv[1:])
          def java_bytes(data): return ", ".join(f"(byte)0x{value:02x}" for value in data)
          source = f'''package com.harleytg.forum.dev;

          import java.nio.charset.StandardCharsets;
          import javax.crypto.Cipher;
          import javax.crypto.spec.IvParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          public final class HcfDiscordSecret {{
              private static final byte[] KEY = new byte[]{{{java_bytes(key_path.read_bytes())}}};
              private static final byte[] IV = new byte[]{{{java_bytes(iv_path.read_bytes())}}};
              private static final byte[] DATA = new byte[]{{{java_bytes(cipher_path.read_bytes())}}};
              private HcfDiscordSecret() {{}}
              public static String decrypt() throws Exception {{
                  Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                  cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(KEY, "AES"), new IvParameterSpec(IV));
                  return new String(cipher.doFinal(DATA), StandardCharsets.UTF_8);
              }}
          }}
          '''
          out_path.write_text(source, encoding='utf-8')
          PY
          rm -rf "$TMP"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and package patch APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-v10000099-permissions-patch"
          OUT="$GITHUB_WORKSPACE/out-permissions-patch"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"
          "$BT/aapt" package -f -m -J "$WORK/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$ANDROID_JAR" -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000099-Permissions-Patch-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000099'" "$OUT/APK-BADGING.txt"
          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq 'Background battery access' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'hcf_notification_channels_v2' "$OUT/DEX-STRINGS.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"

      - name: Upload permissions patch APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000099-Permissions-Patch-Unsigned
          path: out-permissions-patch/
          if-no-files-found: error
          retention-days: 7
