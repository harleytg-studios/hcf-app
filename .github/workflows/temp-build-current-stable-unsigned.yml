name: TEMP Build Current Stable Unsigned

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-build-current-stable-unsigned.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record this temporary build run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/TEMP-STABLE-BUILD-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record temporary Stable build run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout current Stable source
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and zipalign Stable v10000072
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/stable-repo/source code"
          WORK="$RUNNER_TEMP/hcf-stable-current"
          OUT="$GITHUB_WORKSPACE/out"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"

          test -f "$SRC/AndroidManifest.xml"
          test -d "$SRC/src"
          test -d "$SRC/res"
          test -d "$SRC/assets"
          grep -q 'package="com.harleytg.forum"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionCode="10000072"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionName="1.0 (10000072)"' "$SRC/AndroidManifest.xml"

          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$WORK/src" "$OUT"
          cp -R "$SRC/src/." "$WORK/src/"

          # Apply the intended v10000072 notification-bridge change directly to
          # this isolated build copy. This avoids the legacy patch-file context
          # drift while preserving the exact intended behavior.
          python3 - "$WORK/src/com/harleytg/forum/MainActivity.java" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          field = "    private long lastBridgeNotificationAt;\n"
          gate = (
              "                long now = System.currentTimeMillis();\n"
              "                if (now - lastBridgeNotificationAt < 2500L) return;\n"
              "                lastBridgeNotificationAt = now;\n"
          )
          if field not in s:
              raise SystemExit("Expected v10000072 bridge field not found")
          if gate not in s:
              raise SystemExit("Expected v10000072 bridge cooldown block not found")
          s = s.replace(field, "", 1).replace(gate, "", 1)
          p.write_text(s, encoding="utf-8")
          PY

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$SRC/AndroidManifest.xml" \
            -S "$SRC/res" \
            -A "$SRC/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$WORK/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"

          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Stable-v10000072-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/HCF-Stable-v10000072-aligned-unsigned.apk"
          "$BT/aapt" dump badging "$OUT/HCF-Stable-v10000072-aligned-unsigned.apk" | head -n 1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000072'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000072)'" "$OUT/APK-BADGING.txt"

          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$OUT/HCF-Stable-v10000072-aligned-unsigned.apk" > "$OUT/UNSIGNED-SHA256.txt"

      - name: Upload unsigned build and signer
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000072-unsigned-build
          path: |
            out/HCF-Stable-v10000072-aligned-unsigned.apk
            out/apksigner.jar
            out/APK-BADGING.txt
            out/UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 1
