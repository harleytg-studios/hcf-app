name: Apply Startup Loader v2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-startup-loader-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Replace StartupActivity only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path

          target = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          chunks = sorted(Path('.github/tmp/startup-loader').glob('part*.b64'))
          if len(chunks) != 5:
              raise SystemExit(f'Expected 5 payload parts, found {len(chunks)}')
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          replacement = gzip.decompress(base64.b64decode(payload)).decode('utf-8').rstrip()

          text = target.read_text(encoding='utf-8')
          start_marker = '    public static final class StartupActivity extends ThemedActivity {'
          next_marker = '\n    /** MainActivity handoff host that lets the website own its own loading animation. */'
          start = text.index(start_marker)
          end = text.index(next_marker, start)

          if text.count(start_marker) != 1:
              raise SystemExit('StartupActivity marker is not unique')
          before_startup_main = text[end:]
          updated = text[:start] + replacement + '\n' + before_startup_main

          required = [
              'loaderProgress.setMax(1000)',
              'android.animation.ValueAnimator',
              'Step 0 of ',
              'startup_last_good_at',
              'startup_last_good_host',
              'QUICK_PATH_WINDOW_MS',
              'RemoteDomainConfig.refresh(this)',
              'NotificationSyncScheduler.apply(this)',
              'AppUpdateDownloader.cleanupIfCurrentVersionWasDownloaded(this)',
              'TelemetryService.hasPendingCrash(this)',
              'new android.os.StatFs',
              'connection.setConnectTimeout(2500)',
              'connection.setReadTimeout(2500)',
              'overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)',
              'target.putExtra(StartupMainActivity.EXTRA_STARTUP_HANDOFF, true)',
          ]
          for needle in required:
              if needle not in replacement:
                  raise SystemExit(f'Missing required startup-loader marker: {needle}')

          if updated.count('public static final class StartupMainActivity extends HcfMainActivities.MainActivity') != 1:
              raise SystemExit('StartupMainActivity structure changed unexpectedly')
          if updated.count(start_marker) != 1:
              raise SystemExit('StartupActivity replacement count invalid')

          target.write_text(updated, encoding='utf-8')
          PY

          git diff -- 'source code/src/com/harleytg/forum/HcfUITheme.java'
          test -n "$(git diff --name-only)"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'source code/src/com/harleytg/forum/HcfUITheme.java'

      - name: Commit startup loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/HcfUITheme.java'
          git commit -m 'Improve native startup loader: stages, animations, deeper checks, quick path'
          git push origin HEAD:dev
