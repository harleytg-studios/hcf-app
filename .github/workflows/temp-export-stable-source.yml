name: TEMP Export Stable Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-export-stable-source.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Record run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/TEMP-STABLE-EXPORT-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record Stable source export run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout Stable
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo

      - name: Package Stable source
        shell: bash
        run: |
          set -euo pipefail
          cd stable-repo
          zip -qr "$GITHUB_WORKSPACE/HCF-Stable-source-current.zip" 'source code'

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-source-current
          path: HCF-Stable-source-current.zip
          if-no-files-found: error
          retention-days: 1
