name: HCF Beta v10000086 GitHub Domain Config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-beta-v10000086-domain-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/V10000086-BETA-DOMAIN-CONFIG-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record Beta v10000086 domain-config run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

  build:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout known-good Stable runtime
        uses: actions/checkout@v4
        with:
          ref: stable
          path: app-repo

      - name: Checkout Dev Beta identity and domain config code
        uses: actions/checkout@v4
        with:
          ref: dev
          path: beta-meta
          sparse-checkout: |
            source code/res
            source code/src/com/harleytg/forum/BuildInfo.java
            source code/src/com/harleytg/forum/UpdateChecker.java
            source code/src/com/harleytg/forum/ForumConfig.java
            source code/src/com/harleytg/forum/RemoteDomainConfig.java
            source code/src/com/harleytg/forum/HcfApplication.java
          sparse-checkout-cone-mode: false

      - name: Convert runtime and overlay Beta domain config
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/app-repo/source code"
          META="$GITHUB_WORKSPACE/beta-meta/source code"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'app-repo' / 'source code'
          for p in list((root / 'src').rglob('*.java')) + [root / 'AndroidManifest.xml']:
              text = p.read_text(encoding='utf-8').replace('com.harleytg.forum', 'com.harleytg.forum.dev')
              p.write_text(text, encoding='utf-8')

          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:value="stable"', 'android:value="dev"')
          text = re.sub(r'android:versionCode="\d+"', 'android:versionCode="10000086"', text, count=1)
          text = re.sub(r'android:versionName="[^"]+"', 'android:versionName="1.0 (10000086)"', text, count=1)
          text = re.sub(r'(<meta-data\s+android:name="com\.harleytg\.APP_VERSION"\s+android:value=")[^"]+("/>)', r'\g<1>1.0 (10000086)\2', text)
          text = re.sub(r'(<meta-data\s+android:name="com\.harleytg\.APP_VERSION_CODE"\s+android:value=")[^"]+("/>)', r'\g<1>10000086\2', text)
          manifest.write_text(text, encoding='utf-8')
          PY

          cp -a "$META/res/." "$ROOT/res/"
          rm -f "$ROOT/res/values/public.xml"
          for f in BuildInfo.java UpdateChecker.java ForumConfig.java RemoteDomainConfig.java HcfApplication.java; do
            cp "$META/src/com/harleytg/forum/$f" "$ROOT/src/com/harleytg/forum/$f"
          done

          grep -q 'package="com.harleytg.forum.dev"' "$ROOT/AndroidManifest.xml"
          grep -q 'android:versionCode="10000086"' "$ROOT/AndroidManifest.xml"
          grep -q 'android:versionName="1.0 (10000086)"' "$ROOT/AndroidManifest.xml"
          grep -q 'VERSION_CODE = 10000086' "$ROOT/src/com/harleytg/forum/BuildInfo.java"
          grep -q 'DEFAULT_UPDATE_CHANNEL = "dev"' "$ROOT/src/com/harleytg/forum/BuildInfo.java"
          grep -q 'raw.githubusercontent.com/markhitchk/hcf-app/main/configs/domains.config' "$ROOT/src/com/harleytg/forum/RemoteDomainConfig.java"
          grep -q 'RemoteDomainConfig.initialize(this)' "$ROOT/src/com/harleytg/forum/HcfApplication.java"
          grep -q 'Release release = fetchDev();' "$ROOT/src/com/harleytg/forum/UpdateChecker.java"

      - name: Verify main-branch domain config is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 \
            'https://raw.githubusercontent.com/markhitchk/hcf-app/main/configs/domains.config' \
            -o "$RUNNER_TEMP/domains.config"
          grep -q '^domain=forum.harleytg.com$' "$RUNNER_TEMP/domains.config"
          grep -q '^domain_1=harleysclan.freeflarum.com$' "$RUNNER_TEMP/domains.config"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile dex align and validate Beta
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/app-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-10000086-domain-config"
          OUT="$GITHUB_WORKSPACE/out"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m -J "$WORK/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$ANDROID_JAR" -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Beta-v10000086-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/HCF-Beta-v10000086-aligned-unsigned.apk"

          "$BT/aapt" dump badging "$OUT/HCF-Beta-v10000086-aligned-unsigned.apk" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000086'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000086)'" "$OUT/APK-BADGING.txt"
          unzip -p "$OUT/HCF-Beta-v10000086-aligned-unsigned.apk" classes.dex | strings | grep -q 'raw.githubusercontent.com/markhitchk/hcf-app/main/configs/domains.config'

          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp "$RUNNER_TEMP/domains.config" "$OUT/domains.config"
          sha256sum "$OUT/HCF-Beta-v10000086-aligned-unsigned.apk" | tee "$OUT/SHA256SUMS.txt"

      - name: Upload unsigned Beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcf-beta-v10000086-domain-config-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 1
