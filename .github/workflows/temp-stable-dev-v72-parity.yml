name: TEMP Stable Dev v10000072 parity

on:
  push:
    branches: [stable]
    paths:
      - '.github/workflows/temp-stable-dev-v72-parity.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Fetch Dev v10000072 snapshot
        run: git fetch origin dev:refs/remotes/origin/dev

      - name: Port shared v10000072 source and UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          src = Path('source code/src/com/harleytg/forum')
          dev_prefix = 'source code/src/com/harleytg/forum'

          # Shared v10000072 classes that do not contain the known JADX-failed
          # methods. Stable's clean updater/MainActivity/notification/logging
          # implementations remain authoritative where Dev recovery is incomplete.
          port = [
              'AppExecutors.java',
              'AppLogger.java',
              'AppPrefs.java',
              'AppSecurity.java',
              'BootReceiver.java',
              'CookieManagerActivity.java',
              'ErrorSystem.java',
              'FaIcons.java',
              'FirebaseConfigLoader.java',
              'ForumConfig.java',
              'ForumIdentity.java',
              'ForumNotificationClient.java',
              'ForumNotificationSync.java',
              'ForumSecurity.java',
              'ForumUrlRouter.java',
              'HcfApplication.java',
              'HcfIntentChooser.java',
              'IdentityActivity.java',
              'LinkSafety.java',
              'LiveForumUpdater.java',
              'MediaViewerActivity.java',
              'NotificationSyncJobService.java',
              'NotificationSyncScheduler.java',
              'PerformanceProfile.java',
              'ReleaseNotes.java',
              'RuntimeDiagnostics.java',
              'RuntimeState.java',
              'SettingsActivity.java',
              'TelemetryService.java',
              'ThemeManager.java',
              'ThemedActivity.java',
              'UiButtons.java',
              'UiPreferences.java',
          ]

          for name in port:
              path = f'{dev_prefix}/{name}'
              text = subprocess.check_output(['git', 'show', f'origin/dev:{path}'], text=True)
              # Convert Dev application namespace to Stable without changing logic.
              text = text.replace('com.harleytg.forum.dev', 'com.harleytg.forum')
              text = text.replace('comharleytgforumdev', 'comharleytgforum')
              text = text.replace('com-harleytg-forum-dev', 'com-harleytg-forum')
              # User-facing channel branding must remain Stable.
              text = text.replace('"HCF-Beta', '"HCF-Stable')
              text = text.replace('"Beta"', '"Stable"')
              text = text.replace('"Dev"', '"Stable"')
              (src / name).write_text(text, encoding='utf-8')

          # Neutral UI chrome present in Dev v10000072 but previously absent
          # from Stable. Do not copy any logo, launcher, Font Awesome, provider,
          # or notification icon resources.
          shared_drawables = [
              'error_pill_background.xml',
              'error_primary_button_background.xml',
              'error_secondary_button_background.xml',
              'error_shell_background.xml',
              'error_technical_background.xml',
              'theme_choice_background.xml',
              'theme_choice_selected_background.xml',
          ]
          for name in shared_drawables:
              rp = f'source code/res/drawable/{name}'
              data = subprocess.check_output(['git', 'show', f'origin/dev:{rp}'])
              Path(rp).write_bytes(data)

          # Stable-specific identity/update files are intentionally untouched.
          protected = Path('source code/src/com/harleytg/forum/BuildInfo.java').read_text(encoding='utf-8')
          assert 'static final String CHANNEL = "Stable";' in protected
          assert 'static final String DEFAULT_UPDATE_CHANNEL = "stable";' in protected
          assert 'static final boolean ALLOW_UPDATE_CHANNEL_SWITCH = false;' in protected
          assert 'static final int VERSION_CODE = 10000072;' in protected

          # Contact Support was already adapted separately and must keep its
          # Stable BuildInfo-based labels instead of the raw Dev literals.
          support = Path('source code/src/com/harleytg/forum/SupportContactActivity.java').read_text(encoding='utf-8')
          assert 'BuildInfo.CHANNEL' in support
          assert 'package com.harleytg.forum;' in support
          PY

          # No Dev package may leak into Stable active source.
          if grep -R -n 'com\.harleytg\.forum\.dev' 'source code/src'; then
            echo 'Dev package leaked into Stable source' >&2
            exit 20
          fi

          # Refuse any accidental changes to Stable identity, update stack,
          # launcher/logo/icon set, build/signing files, or maintained files
          # that repair known decompiler failures.
          protected_re='(^|/)(AndroidManifest\.xml|BuildInfo\.java|AppUpdateDownloader\.java|InstantNotificationService\.java|LogsActivity\.java|MainActivity\.java|NotificationHelper\.java|SupportContactActivity\.java|UpdateAutomation\.java|UpdateCheckJobService\.java|UpdateChecker\.java|UpdateDownloadReceiver\.java|UpdateFileProvider\.java|UpdateScheduler\.java|build-release\.sh|RELEASE-SIGNING\.md|signing/|branding/|patches/|htg_app_logo|htg_icon|ic_launcher|fa_[^/]+|ic_notification_paw|ic_provider_)'
          if git diff --name-only -- 'source code' | grep -E "$protected_re"; then
            echo 'Protected Stable file changed during parity sync' >&2
            exit 21
          fi

      - name: Compile-check Stable source
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK"
          BT="$SDK/build-tools/35.0.0"
          ANDROID_JAR="$SDK/platforms/android-35/android.jar"
          test -x "$BT/aapt"
          test -f "$ANDROID_JAR"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/gen" "$WORK/classes"
          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M 'source code/AndroidManifest.xml' \
            -S 'source code/res' \
            -A 'source code/assets' \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"
          java -m jdk.compiler/com.sun.tools.javac.Main \
            --release 8 \
            -classpath "$ANDROID_JAR" \
            -d "$WORK/classes" \
            $(find "$WORK/gen" 'source code/src' -name '*.java' -print)

      - name: Commit shared parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          files=(
            'source code/src/com/harleytg/forum/AppExecutors.java'
            'source code/src/com/harleytg/forum/AppLogger.java'
            'source code/src/com/harleytg/forum/AppPrefs.java'
            'source code/src/com/harleytg/forum/AppSecurity.java'
            'source code/src/com/harleytg/forum/BootReceiver.java'
            'source code/src/com/harleytg/forum/CookieManagerActivity.java'
            'source code/src/com/harleytg/forum/ErrorSystem.java'
            'source code/src/com/harleytg/forum/FaIcons.java'
            'source code/src/com/harleytg/forum/FirebaseConfigLoader.java'
            'source code/src/com/harleytg/forum/ForumConfig.java'
            'source code/src/com/harleytg/forum/ForumIdentity.java'
            'source code/src/com/harleytg/forum/ForumNotificationClient.java'
            'source code/src/com/harleytg/forum/ForumNotificationSync.java'
            'source code/src/com/harleytg/forum/ForumSecurity.java'
            'source code/src/com/harleytg/forum/ForumUrlRouter.java'
            'source code/src/com/harleytg/forum/HcfApplication.java'
            'source code/src/com/harleytg/forum/HcfIntentChooser.java'
            'source code/src/com/harleytg/forum/IdentityActivity.java'
            'source code/src/com/harleytg/forum/LinkSafety.java'
            'source code/src/com/harleytg/forum/LiveForumUpdater.java'
            'source code/src/com/harleytg/forum/MediaViewerActivity.java'
            'source code/src/com/harleytg/forum/NotificationSyncJobService.java'
            'source code/src/com/harleytg/forum/NotificationSyncScheduler.java'
            'source code/src/com/harleytg/forum/PerformanceProfile.java'
            'source code/src/com/harleytg/forum/ReleaseNotes.java'
            'source code/src/com/harleytg/forum/RuntimeDiagnostics.java'
            'source code/src/com/harleytg/forum/RuntimeState.java'
            'source code/src/com/harleytg/forum/SettingsActivity.java'
            'source code/src/com/harleytg/forum/TelemetryService.java'
            'source code/src/com/harleytg/forum/ThemeManager.java'
            'source code/src/com/harleytg/forum/ThemedActivity.java'
            'source code/src/com/harleytg/forum/UiButtons.java'
            'source code/src/com/harleytg/forum/UiPreferences.java'
            'source code/res/drawable/error_pill_background.xml'
            'source code/res/drawable/error_primary_button_background.xml'
            'source code/res/drawable/error_secondary_button_background.xml'
            'source code/res/drawable/error_shell_background.xml'
            'source code/res/drawable/error_technical_background.xml'
            'source code/res/drawable/theme_choice_background.xml'
            'source code/res/drawable/theme_choice_selected_background.xml'
          )
          git add -- "${files[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Stable already has the selected Dev v10000072 parity changes.'
            exit 0
          fi
          git commit -m 'Align Stable shared UI and source with Dev v10000072'
          git push origin HEAD:stable
