name: One-time v10000097 URL Bar Size Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10000097-urlbar-size-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/status/v10000097-urlbarsize-run-${GITHUB_RUN_ID} --force

      - name: Lock startup chrome to final compact size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          text = ui.read_text(encoding='utf-8')

          old = '''            topAppBar = findViewById(R.id.topAppBar);\n            urlBar = findViewById(R.id.urlBar);\n            startupWebView = findViewById(R.id.webView);\n\n            if (topAppBar != null) {'''
          new = '''            topAppBar = findViewById(R.id.topAppBar);\n            urlBar = findViewById(R.id.urlBar);\n            startupWebView = findViewById(R.id.webView);\n\n            // MainActivity always applies the compact chrome profile. Apply the exact\n            // same dimensions before the startup chrome can ever become visible so\n            // the URL bar cannot appear at XML/default size and then snap smaller.\n            applyStartupChromeDensity();\n\n            if (topAppBar != null) {'''
          if old not in text:
              raise SystemExit('prepareNativeChrome insertion point not found')
          text = text.replace(old, new, 1)

          marker = '''        private void installStartupOverlay() {\n'''
          method = '''        private void applyStartupChromeDensity() {\n            setStartupHeight(topAppBar, R.dimen.compact_app_header_height);\n            setStartupSquare(findViewById(R.id.drawerButton), R.dimen.compact_app_header_button);\n            setStartupSquare(findViewById(R.id.appHeaderLogo), R.dimen.compact_app_header_logo);\n            setStartupSquare(findViewById(R.id.headerNotificationsButton), R.dimen.compact_app_header_button);\n\n            TextView title = findViewById(R.id.appHeaderTitle);\n            if (title != null) {\n                title.setTextSize(TypedValue.COMPLEX_UNIT_PX,\n                        getResources().getDimension(R.dimen.compact_app_header_title_text));\n            }\n\n            setStartupHeight(urlBar, R.dimen.compact_url_bar_height);\n            setStartupHeight(findViewById(R.id.urlBarInner), R.dimen.compact_url_bar_inner_height);\n            setStartupSquare(findViewById(R.id.urlBackButton), R.dimen.compact_url_reload_button);\n            setStartupSquare(findViewById(R.id.reloadButton), R.dimen.compact_url_reload_button);\n            setStartupSquare(findViewById(R.id.copyUrlButton), R.dimen.compact_url_copy_button);\n            setStartupSquare(findViewById(R.id.urlHomeButton), R.dimen.compact_url_reload_button);\n\n            if (topAppBar != null) {\n                int side = dp(6);\n                topAppBar.setPadding(side, 0, side, 0);\n            }\n            if (urlBar != null) {\n                int side = dp(6);\n                int vertical = dp(2);\n                urlBar.setPadding(side, vertical, side, vertical);\n            }\n\n            View secureLabel = findViewById(R.id.secureForumLabel);\n            if (secureLabel != null) secureLabel.setVisibility(View.GONE);\n        }\n\n        private void setStartupHeight(View view, int dimenRes) {\n            if (view == null || view.getLayoutParams() == null) return;\n            ViewGroup.LayoutParams lp = view.getLayoutParams();\n            lp.height = getResources().getDimensionPixelSize(dimenRes);\n            view.setLayoutParams(lp);\n            view.requestLayout();\n        }\n\n        private void setStartupSquare(View view, int dimenRes) {\n            if (view == null || view.getLayoutParams() == null) return;\n            int size = getResources().getDimensionPixelSize(dimenRes);\n            ViewGroup.LayoutParams lp = view.getLayoutParams();\n            lp.width = size;\n            lp.height = size;\n            view.setLayoutParams(lp);\n            view.requestLayout();\n        }\n\n'''
          if marker not in text:
              raise SystemExit('installStartupOverlay marker not found')
          text = text.replace(marker, method + marker, 1)
          ui.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'applyStartupChromeDensity();' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'R.dimen.compact_url_bar_height' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'R.id.urlBackButton' 'source code/src/com/harleytg/forum/HcfUITheme.java'

      - name: Commit fix to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Harleys Studios Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/HcfUITheme.java'
          git commit -m 'Fix startup URL bar compact sizing'
          git push origin HEAD:dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile fixed v10000097 APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-v10000097-urlbarsize"
          OUT="$GITHUB_WORKSPACE/out-v10000097-urlbarsize"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT/signing-tools/lib"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000097-URLBarSizeFix-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000097'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000097)'" "$OUT/APK-BADGING.txt"

          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq 'applyStartupChromeDensity' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'hcf_startup_handoff' "$OUT/DEX-STRINGS.txt"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"

          cp "$BT/apksigner" "$OUT/signing-tools/apksigner"
          cp "$BT/lib/apksigner.jar" "$OUT/signing-tools/lib/apksigner.jar"

      - name: Upload fixed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000097-URLBarSizeFix-Unsigned
          path: out-v10000097-urlbarsize/
          if-no-files-found: error
          retention-days: 7
