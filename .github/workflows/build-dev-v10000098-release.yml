name: Build HCF Beta v10000098 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dev-v10000098-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hcf-beta-v10000098-release
  cancel-in-progress: false

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Record run ID
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/V10000098-BETA-RUN.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record Beta v10000098 release run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: app-repo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bump Dev source identity to v10000098
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app-repo"
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('source code/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android:versionCode="10000097"' in text:
              text = text.replace('10000097', '10000098')
          if 'android:versionCode="10000098"' not in text or 'android:versionName="1.0 (10000098)"' not in text:
              raise SystemExit('Manifest did not resolve to v10000098')
          manifest.write_text(text, encoding='utf-8')

          app = Path('source code/src/com/harleytg/forum/HcfApplication.java')
          text = app.read_text(encoding='utf-8')
          if 'VERSION_CODE = 10000097;' in text:
              expected = {
                  'HCF-Beta-v10000097.apk': 'HCF-Beta-v10000098.apk',
                  'static final int INTERNAL_BUILD = 117;': 'static final int INTERNAL_BUILD = 118;',
                  'HarleysClanForumApp/1.0 Build/10000097': 'HarleysClanForumApp/1.0 Build/10000098',
                  'static final int VERSION_CODE = 10000097;': 'static final int VERSION_CODE = 10000098;',
              }
              for old, new in expected.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected BuildInfo marker: {old}')
                  text = text.replace(old, new, 1)
          required = [
              'APK_FILE_NAME = "HCF-Beta-v10000098.apk"',
              'INTERNAL_BUILD = 118',
              'Build/10000098',
              'VERSION_CODE = 10000098',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'BuildInfo v10000098 marker missing: {marker}')
          app.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('10000097', '10000098').replace('Internal build: `117`', 'Internal build: `118`')
          readme.write_text(text, encoding='utf-8')

          old = Path('.github/workflows/build-dev-v10000097.yml')
          new = Path('.github/workflows/build-dev-v10000098.yml')
          if old.exists() and not new.exists():
              new.write_text(old.read_text(encoding='utf-8').replace('10000097', '10000098'), encoding='utf-8')
              old.unlink()
          elif new.exists():
              new.write_text(new.read_text(encoding='utf-8').replace('10000097', '10000098'), encoding='utf-8')
          else:
              raise SystemExit('No Dev build workflow available to promote to v10000098')
          PY

          grep -q 'android:versionCode="10000098"' 'source code/AndroidManifest.xml'
          grep -q 'android:versionName="1.0 (10000098)"' 'source code/AndroidManifest.xml'
          grep -q 'APK_FILE_NAME = "HCF-Beta-v10000098.apk"' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -q 'VERSION_CODE = 10000098' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -q 'INTERNAL_BUILD = 118' 'source code/src/com/harleytg/forum/HcfApplication.java'

      - name: Run release source gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app-repo"
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          python3 -m json.tool configs/app-links/assetlinks.json >/dev/null

      - name: Verify live sanitized ban configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          urls = {
              'config': 'https://raw.githubusercontent.com/markhitchk/hcf-app/main/configs/ban-system.config',
              'list': 'https://raw.githubusercontent.com/markhitchk/hcf-app/main/configs/ban-list.json',
          }
          for name, url in urls.items():
              request = urllib.request.Request(url, headers={'User-Agent':'HCF-v10000098-release'})
              with urllib.request.urlopen(request, timeout=10) as response:
                  data = response.read().decode('utf-8')
              if name == 'config':
                  assert 'enabled=true' in data
                  assert '[ban_list]' in data
                  assert 'publish_raw_ips=false' in data
                  assert 'cloudfunctions.net' not in data
              else:
                  parsed = json.loads(data)
                  assert parsed.get('schema_version') == 1
                  assert isinstance(parsed.get('users'), dict)
                  assert isinstance(parsed.get('ip_sha256'), dict)
          print('Static HCF ban configuration verified.')
          PY

      - name: Commit v10000098 identity to Dev
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app-repo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/AndroidManifest.xml' 'source code/src/com/harleytg/forum/HcfApplication.java' README.md .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m 'Bump Dev to v10000098'
            git push origin HEAD:dev
          else
            echo 'Dev source is already v10000098.'
          fi

      - name: Generate encrypted Discord webhook binding
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo 'DISCORD_WEBHOOK_URL is not configured in GitHub Actions secrets.' >&2
            exit 40
          fi
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://www.discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*|https://www.discordapp.com/api/webhooks/*) ;;
            *) echo 'DISCORD_WEBHOOK_URL is not a supported Discord HTTPS webhook URL.' >&2; exit 41 ;;
          esac

          GEN_DIR="$GITHUB_WORKSPACE/app-repo/source code/src/com/harleytg/forum"
          TMP="$RUNNER_TEMP/hcf-discord-secret"
          mkdir -p "$TMP"
          chmod 700 "$TMP"
          printf '%s' "$DISCORD_WEBHOOK_URL" > "$TMP/plain.txt"
          chmod 600 "$TMP/plain.txt"
          openssl rand 32 > "$TMP/key.bin"
          openssl rand 16 > "$TMP/iv.bin"
          KEY_HEX="$(xxd -p -c 256 "$TMP/key.bin")"
          IV_HEX="$(xxd -p -c 256 "$TMP/iv.bin")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in "$TMP/plain.txt" -out "$TMP/cipher.bin"

          python3 - "$TMP/key.bin" "$TMP/iv.bin" "$TMP/cipher.bin" "$GEN_DIR/HcfDiscordSecret.java" <<'PY'
          import pathlib, sys
          key_path, iv_path, cipher_path, out_path = map(pathlib.Path, sys.argv[1:])
          def java_bytes(data):
              return ', '.join(f'(byte)0x{value:02x}' for value in data)
          source = f'''package com.harleytg.forum.dev;

          import java.nio.charset.StandardCharsets;
          import javax.crypto.Cipher;
          import javax.crypto.spec.IvParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          /** Generated only inside GitHub Actions. Never commit this file. */
          public final class HcfDiscordSecret {{
              private static final byte[] KEY = new byte[]{{{java_bytes(key_path.read_bytes())}}};
              private static final byte[] IV = new byte[]{{{java_bytes(iv_path.read_bytes())}}};
              private static final byte[] DATA = new byte[]{{{java_bytes(cipher_path.read_bytes())}}};
              private HcfDiscordSecret() {{}}
              public static String decrypt() throws Exception {{
                  Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                  cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(KEY, "AES"), new IvParameterSpec(IV));
                  return new String(cipher.doFinal(DATA), StandardCharsets.UTF_8);
              }}
          }}
          '''
          out_path.write_text(source, encoding='utf-8')
          PY

          rm -rf "$TMP"
          unset DISCORD_WEBHOOK_URL KEY_HEX IV_HEX
          test -s "$GEN_DIR/HcfDiscordSecret.java"
          ! grep -Fq 'https://discord.com/api/webhooks/' "$GEN_DIR/HcfDiscordSecret.java"
          ! grep -Fq 'https://discordapp.com/api/webhooks/' "$GEN_DIR/HcfDiscordSecret.java"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and validate v10000098
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/app-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-v10000098"
          OUT="$GITHUB_WORKSPACE/release-out"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000098-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000098'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000098)'" "$OUT/APK-BADGING.txt"

          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq 'same build code, revised APK hash' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'APK SHA-256 does not match' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'App Setup' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'HCF Alerts are the real forum alerts.' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'HcfDiscordSecret' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'configs/ban-list.json' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'https://discord.com/api/webhooks/' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'https://discordapp.com/api/webhooks/' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'cloudfunctions.net/hcfBanApi' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'Method not decompiled' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'Code decompiled incorrectly' "$OUT/DEX-STRINGS.txt"

          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"
          printf 'package=com.harleytg.forum.dev\nversionName=1.0 (10000098)\nversionCode=10000098\nchannel=dev\nsigning=local-existing-beta-v2\nban_system=github-static\ndiscord_observation=encrypted-build-binding\n' > "$OUT/RELEASE-METADATA.txt"

      - name: Upload v10000098 unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000098-Release-Candidate
          path: |
            release-out/HCF-Beta-v10000098-aligned-unsigned.apk
            release-out/apksigner.jar
            release-out/APK-BADGING.txt
            release-out/DEX-STRINGS.txt
            release-out/SHA256SUMS.txt
            release-out/RELEASE-METADATA.txt
          if-no-files-found: error
          retention-days: 7

      - name: Record successful release candidate
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/V10000098-BETA-SUCCESS.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const text = `run_id=${context.runId}\nversionCode=10000098\nartifact=HCF-Beta-v10000098-Release-Candidate\n`;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record successful Beta v10000098 candidate',
              content: Buffer.from(text).toString('base64')
            });

      - name: Remove generated webhook binding
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/app-repo/source code/src/com/harleytg/forum/HcfDiscordSecret.java"
