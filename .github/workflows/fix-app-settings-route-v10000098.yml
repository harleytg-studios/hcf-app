name: Fix Dev /app/settings Native Route
# rerun after workflow registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-app-settings-route-v10000098.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Route /app/settings to native App Settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source code/src/com/harleytg/forum/HcfMainActivities.java')
          verify = Path('.github/scripts/verify-release-readiness.py')
          text = source.read_text(encoding='utf-8')

          helper = '''        private boolean isNativeSettingsRoute(Uri uri) {
            if (uri == null) {
                return false;
            }
            if ("hcf-app".equalsIgnoreCase(uri.getScheme())
                    && "settings".equalsIgnoreCase(uri.getHost())) {
                return true;
            }
            if (!ForumUrlRouter.isForumUrl(uri)) {
                return false;
            }
            String path = uri.getPath();
            if (path == null) {
                return false;
            }
            String normalized = path.trim().toLowerCase(Locale.US);
            while (normalized.length() > 1 && normalized.endsWith("/")) {
                normalized = normalized.substring(0, normalized.length() - 1);
            }
            return "/app/settings".equals(normalized);
        }

'''
          anchor = '        public boolean isNativeInstallRoute(Uri uri) {'
          if 'private boolean isNativeSettingsRoute(Uri uri)' not in text:
              if anchor not in text:
                  raise SystemExit('isNativeInstallRoute anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old_nav = '''                Uri url = webResourceRequest.getUrl();
                if (MainActivity.this.isNativeInstallRoute(url)) {'''
          new_nav = '''                Uri url = webResourceRequest.getUrl();
                if (MainActivity.this.isNativeSettingsRoute(url)) {
                    MainActivity.this.openAppSettings("in_app_url");
                    return true;
                }
                if (MainActivity.this.isNativeInstallRoute(url)) {'''
          if 'openAppSettings("in_app_url")' not in text:
              if old_nav not in text:
                  raise SystemExit('WebView navigation anchor not found')
              text = text.replace(old_nav, new_nav, 1)

          old_deep = '''                Uri data = getIntent() == null ? null : getIntent().getData();
                if (ForumUrlRouter.isForumUrl(data)) {'''
          new_deep = '''                Uri data = getIntent() == null ? null : getIntent().getData();
                if (isNativeSettingsRoute(data)) {
                    openAppSettings("app_link_https");
                    // Do not load /app/settings as a forum page behind the native screen.
                    // Keep the normal forum home ready when Settings is closed.
                    data = null;
                }
                if (ForumUrlRouter.isForumUrl(data)) {'''
          if 'openAppSettings("app_link_https")' not in text:
              if old_deep not in text:
                  raise SystemExit('initial deep-link anchor not found')
              text = text.replace(old_deep, new_deep, 1)

          source.write_text(text, encoding='utf-8')

          gate = verify.read_text(encoding='utf-8')
          route_assert = 'require("HTTPS /app/settings native route missing", "isNativeSettingsRoute" in main_activity and \'"/app/settings"\' in main_activity and \'openAppSettings("in_app_url")\' in main_activity and \'openAppSettings("app_link_https")\' in main_activity)\n'
          anchor_gate = 'require("What\'s New is not rescheduled after Setup", "scheduleWhatsNew(true);" in main_activity)\n'
          if 'HTTPS /app/settings native route missing' not in gate:
              if anchor_gate not in gate:
                  raise SystemExit('release gate insertion anchor not found')
              gate = gate.replace(anchor_gate, anchor_gate + route_assert, 1)
              verify.write_text(gate, encoding='utf-8')

          final = source.read_text(encoding='utf-8')
          assert 'return "/app/settings".equals(normalized);' in final
          assert 'openAppSettings("in_app_url")' in final
          assert 'openAppSettings("app_link_https")' in final
          assert '"hcf-app".equalsIgnoreCase(uri.getScheme())' in final
          print('Native settings URL routing patched.')
          PY

      - name: Run source release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .

      - name: Commit fix to Dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/src/com/harleytg/forum/HcfMainActivities.java' '.github/scripts/verify-release-readiness.py'
          if git diff --cached --quiet; then
            echo 'Native /app/settings route already fixed.'
          else
            git commit -m 'Recognize /app/settings as native settings route'
            git push origin HEAD:dev
          fi
