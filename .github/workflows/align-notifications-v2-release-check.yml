name: Align Notifications v2 Release Check

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/align-notifications-v2-release-check.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Update forum-summary release assertion
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/scripts/verify-release-readiness.py'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/verify-release-readiness.py')
          s = p.read_text(encoding='utf-8')
          old = 'require("real alert fallback is not on HCF Alerts", "FORUM_SUMMARY_ID, true, false" in notification_helper)'
          new = 'require("real alert fallback is not on HCF Alerts", "new Notification.Builder(context, CHANNEL_ID)" in notification_helper and ".setGroup(FORUM_GROUP_KEY)" in notification_helper)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one old forum-summary assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'new Notification.Builder(context, CHANNEL_ID)' "$FILE"
          grep -Fq '.setGroup(FORUM_GROUP_KEY)' "$FILE"
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m 'ci: align release gate with Notifications v2 summary'
          git push origin HEAD:dev
