name: Temporary avatar XML fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-fix-avatar-xml.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Fix nested avatar view XML and stage final repo shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source code/res/layout/activity_main.xml')
          s = p.read_text(encoding='utf-8')
          old = '''                <com.harleytg.forum.dev.HcfMainActivities$IdentityAvatarView\n                    android:id="@+id/drawerIdentityAvatar"'''
          new = '''                <view\n                    class="com.harleytg.forum.dev.HcfMainActivities$IdentityAvatarView"\n                    android:id="@+id/drawerIdentityAvatar"'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one nested avatar tag, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/temp-fix-avatar-xml.yml

      - name: Run required validators on final repository shape
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('source code/res/layout/activity_main.xml')
          print('activity_main.xml: XML parse PASS')
          PY

      - name: Commit finished XML fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/res/layout/activity_main.xml'
          git diff --cached --check
          git commit -m 'Fix Forum Identity avatar XML inflation'
          git push origin HEAD:dev
