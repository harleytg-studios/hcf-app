name: Finalize Shared Loader Connect

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/finalize-shared-loader-connect.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Make showChecking always use branded loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source code/src/com/harleytg/forum/HcfMainActivities.java')
          text = path.read_text(encoding='utf-8')
          old = '''            if (this.brandedLoader != null) {
                if (z) {
                    this.brandedLoader.showConnecting(str);
                } else {
                    this.brandedLoader.hide(false);
                }
                this.statusOverlay.setVisibility(8);
                if (this.startupStateContainer != null) {
                    this.startupStateContainer.setVisibility(8);
                }
            } else {
                this.statusOverlay.setVisibility(z ? 0 : 8);
            }
'''
          new = '''            if (this.brandedLoader != null) {
                this.brandedLoader.showConnecting(str);
                this.statusOverlay.setVisibility(8);
                if (this.startupStateContainer != null) {
                    this.startupStateContainer.setVisibility(8);
                }
            } else {
                this.statusOverlay.setVisibility(z ? 0 : 8);
            }
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected showChecking loader block exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/finalize-shared-loader-connect.yml').unlink()
          PY

      - name: Run unchanged source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-hcf-notifications-v2.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          grep -Fq 'this.brandedLoader.showConnecting(str);' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'MainActivity.this.brandedLoader.showReconnecting(reconnectHost);' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          grep -Fq 'this.brandedLoader.hide(true);' 'source code/src/com/harleytg/forum/HcfMainActivities.java'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile full Java source
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-shared-loader-compile"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/secret-src/com/harleytg/forum"
          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"
          cat > "$WORK/secret-src/com/harleytg/forum/HcfDiscordSecret.java" <<'JAVA'
          package com.harleytg.forum.dev;
          public final class HcfDiscordSecret {
              private HcfDiscordSecret() {}
              public static String decrypt() { return ""; }
          }
          JAVA
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" "$WORK/secret-src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          test -f "$WORK/classes/com/harleytg/forum/dev/HcfBrandedLoader.class"
          echo 'Full Java compile: PASS'

      - name: Commit final focused adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Ensure every host connect uses shared loader'
          git push origin HEAD:dev
