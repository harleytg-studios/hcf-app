name: Temporary Java system consolidation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-theme-selection.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Consolidate related Java systems and theme controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('source code/src/com/harleytg/forum')

          def merge_java(target_name, source_names):
              paths = [src / name for name in source_names]
              missing = [str(p) for p in paths if not p.exists()]
              if missing:
                  raise SystemExit('Missing merge source(s): ' + ', '.join(missing))

              package = None
              imports = set()
              bodies = []
              for p in paths:
                  text = p.read_text(encoding='utf-8')
                  pm = re.search(r'(?m)^package\s+([^;]+);\s*$', text)
                  if not pm:
                      raise SystemExit(f'No package declaration in {p}')
                  current_package = pm.group(1).strip()
                  if package is None:
                      package = current_package
                  elif package != current_package:
                      raise SystemExit(f'Package mismatch in {p}: {current_package} != {package}')

                  # Only package-private helper classes are eligible for consolidation.
                  if re.search(r'(?m)^public\s+(?:(?:final|abstract)\s+)?(?:class|interface|enum)\s+', text):
                      raise SystemExit(f'Refusing to merge public Android/top-level component: {p.name}')

                  imports.update(re.findall(r'(?m)^import\s+[^;]+;\s*$', text))
                  body = re.sub(r'(?m)^package\s+[^;]+;\s*$', '', text, count=1)
                  body = re.sub(r'(?m)^import\s+[^;]+;\s*$', '', body)
                  body = body.strip()
                  bodies.append(f'// ===== Consolidated from {p.name} =====\n{body}')

              out = [f'package {package};', '']
              if imports:
                  out.extend(sorted(i.strip() for i in imports))
                  out.append('')
              out.append('\n\n'.join(bodies))
              out.append('')

              target = src / target_name
              for p in paths:
                  p.unlink()
              target.write_text('\n'.join(out), encoding='utf-8')

          merge_java('UiSystem.java', [
              'ThemeManager.java',
              'ThemedActivity.java',
              'UiButtons.java',
              'UiPreferences.java',
              'FaIcons.java',
              'PerformanceProfile.java',
              'ReleaseNotes.java',
          ])

          merge_java('NavigationSystem.java', [
              'LinkRouter.java',
              'LinkSafety.java',
              'HcfIntentChooser.java',
          ])

          merge_java('AccountSystem.java', [
              'ForumIdentity.java',
              'ForumSecurity.java',
          ])

          merge_java('DiagnosticsSystem.java', [
              'ErrorSystem.java',
              'AppLogger.java',
              'RuntimeDiagnostics.java',
              'TelemetryService.java',
          ])

          merge_java('RuntimeSystem.java', [
              'AppExecutors.java',
              'RuntimeState.java',
              'LiveForumUpdater.java',
          ])

          merge_java('AppCore.java', [
              'AppConfig.java',
              'AppSettings.java',
              'AppSecurity.java',
          ])

          merge_java('NotificationCenter.java', [
              'NotificationCenter.java',
              'ForumNotificationClient.java',
          ])

          merge_java('UpdateManager.java', [
              'UpdateManager.java',
              'UpdateChecker.java',
              'AppUpdateDownloader.java',
          ])

          # Replace the old theme-cycle control with four direct selection buttons.
          settings = src / 'SettingsActivity.java'
          text = settings.read_text(encoding='utf-8')
          if 'themeChoiceButton("Auto • Follow phone", ThemeManager.SYSTEM)' not in text:
              old = '''        Button themeButton = actionButton("Theme: " + ThemeManager.label(this), v -> {
              String next = ThemeManager.next(ThemeManager.mode(this));
              prefs.edit().putString(AppPrefs.APP_THEME, next).apply();
              AppLogger.info(this, "setting_theme", next + " | keep_section=" + currentSettingsSection);
              recreate();
          });
          themeButton.setContentDescription("Change app day, night and AMOLED theme");
          card.addView(themeButton);
          '''
              new = '''        TextView themeTitle = text("App Theme", 10, getColor(R.color.hcf_cyan));
          themeTitle.setTypeface(null, android.graphics.Typeface.BOLD);
          themeTitle.setPadding(0, dp(4), 0, dp(4));
          card.addView(themeTitle);

          card.addView(themeChoiceButton("Auto • Follow phone", ThemeManager.SYSTEM));
          card.addView(themeChoiceButton("Light • Day", ThemeManager.LIGHT));
          card.addView(themeChoiceButton("Dark • Night", ThemeManager.DARK));
          card.addView(themeChoiceButton("AMOLED • Black", ThemeManager.AMOLED));
          card.addView(text("Choose a theme directly. The selected theme is marked and App Settings stays on this page after the theme is applied.", 10, getColor(R.color.hcf_muted)));
          '''
              if old not in text:
                  raise SystemExit('Expected old theme-cycle control was not found')
              text = text.replace(old, new, 1)

              marker = '    private View connectionCard() {\n'
              helper = '''    private Button themeChoiceButton(String label, String mode) {
          boolean selected = mode != null && mode.equals(ThemeManager.mode(this));
          Button button = actionButton((selected ? "✓  " : "") + label, v -> selectTheme(mode));
          button.setContentDescription(label + (selected ? ", selected" : ", select theme"));
          button.setTextColor(getColor(selected ? R.color.hcf_cyan_bright : R.color.hcf_text));
          if (selected) button.setTypeface(null, android.graphics.Typeface.BOLD);
          return button;
      }

      private void selectTheme(String mode) {
          if (mode == null || mode.equals(ThemeManager.mode(this))) return;
          prefs.edit().putString(AppPrefs.APP_THEME, mode).apply();
          AppLogger.info(this, "setting_theme", mode + " | direct_selection | keep_section=" + currentSettingsSection);
          recreate();
      }

      '''
              if marker not in text:
                  raise SystemExit('connectionCard insertion marker not found')
              text = text.replace(marker, helper + marker, 1)
              settings.write_text(text, encoding='utf-8')

          # Make sure the expected new architecture exists and old helper files are gone.
          expected = [
              'UiSystem.java', 'NavigationSystem.java', 'AccountSystem.java',
              'DiagnosticsSystem.java', 'RuntimeSystem.java', 'AppCore.java',
              'NotificationCenter.java', 'UpdateManager.java'
          ]
          for name in expected:
              if not (src / name).exists():
                  raise SystemExit('Missing consolidated file: ' + name)

          retired = [
              'ThemeManager.java','ThemedActivity.java','UiButtons.java','UiPreferences.java','FaIcons.java','PerformanceProfile.java','ReleaseNotes.java',
              'LinkRouter.java','LinkSafety.java','HcfIntentChooser.java','ForumIdentity.java','ForumSecurity.java',
              'ErrorSystem.java','AppLogger.java','RuntimeDiagnostics.java','TelemetryService.java',
              'AppExecutors.java','RuntimeState.java','LiveForumUpdater.java',
              'AppConfig.java','AppSettings.java','AppSecurity.java',
              'ForumNotificationClient.java','UpdateChecker.java','AppUpdateDownloader.java'
          ]
          leftovers = [name for name in retired if (src / name).exists()]
          if leftovers:
              raise SystemExit('Retired helper file(s) still exist: ' + ', '.join(leftovers))
          PY

      - name: Compile consolidated Java source
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          rm -rf .java-check
          mkdir -p .java-check/gen .java-check/classes
          sed 's|@@HCF_APP_LINK_FILTERS@@||g' 'source code/AndroidManifest.xml.in' > .java-check/AndroidManifest.xml
          "$SDK_ROOT/build-tools/35.0.0/aapt" package -f -m \
            -J .java-check/gen \
            -M .java-check/AndroidManifest.xml \
            -S 'source code/res' \
            -I "$SDK_ROOT/platforms/android-35/android.jar"
          find 'source code/src' .java-check/gen -name '*.java' -print0 | \
            xargs -0 javac --release 8 -encoding UTF-8 \
              -cp "$SDK_ROOT/platforms/android-35/android.jar" \
              -d .java-check/classes
          rm -rf .java-check

      - name: Commit consolidated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'source code/src/com/harleytg/forum'
          git diff --cached --check
          git commit -m 'Consolidate related Java systems by feature area'
          git push origin HEAD:dev
