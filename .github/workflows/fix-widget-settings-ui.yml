name: Fix Widget Subsettings UI

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-widget-settings-ui.yml'

permissions:
  contents: write

jobs:
  patch-widget-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply shared subsettings UI patch
        run: python3 .github/scripts/fix-widget-settings-ui.py

      - name: Validate release/source checks
        run: python3 .github/scripts/verify-release-readiness.py

      - name: Commit shared Widget subsettings UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "source code/src/com/harleytg/forum/HcfUI.java" \
                  "source code/src/com/harleytg/forum/HcfWidget.java" \
                  ".github/scripts/verify-release-readiness.py" \
                  "README.md" \
                  "source code/ci/widget-settings-subscreen.txt"
          git commit -m "Use standard subsettings UI for widget settings"
          git push origin HEAD:dev
