name: Patch Build Identity and What's New

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-build-identity-whats-new.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary build identity patch workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply build identity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-build-identity-whats-new.py
          python3 -m py_compile .github/scripts/verify-release-readiness.py

      - name: Commit patched source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'source code/src/com/harleytg/forum/HcfCore.java' \
            'source code/src/com/harleytg/forum/HcfForum.java' \
            'source code/src/com/harleytg/forum/HcfUpdates.java' \
            'source code/ci/dev-build-identity.txt' \
            '.github/scripts/verify-release-readiness.py'
          git rm '.github/scripts/patch-build-identity-whats-new.py' '.github/workflows/patch-build-identity-whats-new.yml'
          git diff --cached --check
          git commit -m "Show full Dev build identity and refresh What's New"
          git push origin HEAD:dev
