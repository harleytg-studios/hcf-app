name: HCF Beta v10000090 HCF Alerts Final UI

on:
  push:
    branches: [dev]
    paths:
      - build-output/V10000090-HCF-ALERTS-FINAL.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-compile-package:
    runs-on: ubuntu-latest
    steps:
      - name: Record run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/HCF-Beta-v10000090-HCF-ALERTS-FINAL-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'dev'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'dev', sha,
              message: '[skip ci] Record V10000090 HCF Alerts final UI run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Apply final HCF Alerts expanded UI migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-hcf-alerts-v10000090-final.py "$GITHUB_WORKSPACE/source code"
          python3 .github/scripts/verify-hcf-alerts-ui.py "$GITHUB_WORKSPACE/source code"
          SRC='source code/src/com/harleytg/forum/SettingsActivity.java'
          grep -n 'HCF_ALERTS_RENDER_FINAL_V10000090' "$SRC"
          grep -n 'Background notification sync' "$SRC"
          grep -n 'Permission allowed' "$SRC"
          grep -n 'High priority' "$SRC"
          grep -n 'Open Android settings' "$SRC"
          grep -n 'HCF Alerts are the real forum alerts.' "$SRC"
          grep -n 'NOTIFICATION_LAST_SYNC_STATUS' "$SRC"
          ! grep -q 'Open HCF Alerts Android Settings' "$SRC"
          ! grep -q 'notificationStatus.setText((ready ?' "$SRC"
          grep -n 'VERSION_CODE = 10000090' 'source code/src/com/harleytg/forum/BuildInfo.java'
          grep -n 'android:versionCode="10000090"' 'source code/AndroidManifest.xml'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and package direct Dev source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-v10000090-alerts-final"
          OUT="$GITHUB_WORKSPACE/out-hcf-alerts-final"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"

          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Beta-v10000090-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/HCF-Beta-v10000090-aligned-unsigned.apk"

          "$BT/aapt" dump badging "$OUT/HCF-Beta-v10000090-aligned-unsigned.apk" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000090'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000090)'" "$OUT/APK-BADGING.txt"

          strings "$WORK/dex/classes.dex" > "$OUT/DEX-STRINGS.txt"
          grep -q 'Background notification sync' "$OUT/DEX-STRINGS.txt"
          grep -q 'Permission allowed' "$OUT/DEX-STRINGS.txt"
          grep -q 'Permission denied' "$OUT/DEX-STRINGS.txt"
          grep -q 'High priority' "$OUT/DEX-STRINGS.txt"
          grep -q 'Normal priority' "$OUT/DEX-STRINGS.txt"
          grep -q 'Low priority' "$OUT/DEX-STRINGS.txt"
          grep -q 'Blocked / off' "$OUT/DEX-STRINGS.txt"
          grep -q 'Open Android settings' "$OUT/DEX-STRINGS.txt"
          grep -q 'HCF Alerts are the real forum alerts.' "$OUT/DEX-STRINGS.txt"
          grep -q 'HCF Silent Alerts is only the silent service-status channel.' "$OUT/DEX-STRINGS.txt"
          grep -q 'For best reliability, set battery usage to Unrestricted' "$OUT/DEX-STRINGS.txt"
          ! grep -q 'Open HCF Alerts Android Settings' "$OUT/DEX-STRINGS.txt"
          ! grep -q 'Method not decompiled:' "$OUT/DEX-STRINGS.txt"

          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$OUT/HCF-Beta-v10000090-aligned-unsigned.apk" | tee "$OUT/SHA256SUMS.txt"

      - name: Commit final HCF Alerts source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'source code/src/com/harleytg/forum/SettingsActivity.java'
          if git diff --cached --quiet; then
            echo 'No SettingsActivity changes to commit.'
          else
            git commit -m 'Finalize V10000090 HCF Alerts expanded UI'
            git push origin HEAD:dev
          fi

      - name: Upload unsigned V10000090 APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000090-HCF-Alerts-Final-Unsigned
          path: out-hcf-alerts-final/
          if-no-files-found: error
          retention-days: 1
