name: Build Stable v10000078 Runtime Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-stable-v10000078-polish.yml'

permissions:
  contents: write

jobs:
  build-stable-v10000078:
    runs-on: ubuntu-latest
    steps:
      - name: Record build run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/STABLE-v10000078-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record Stable v10000078 build run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout current Stable source
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo
          token: ${{ github.token }}

      - name: Apply v10000078 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('stable-repo')
          src = repo / 'source code'

          p = src / 'src/com/harleytg/forum/UpdateAutomation.java'
          s = p.read_text(encoding='utf-8')
          old1 = '            final String str = "dev";'
          old2 = '            UpdateChecker.check(applicationContext, "dev", new UpdateChecker.Callback()'
          if old1 not in s or old2 not in s:
              raise SystemExit('UpdateAutomation Dev-channel pattern not found')
          s = s.replace(old1, '            final String str = BuildInfo.DEFAULT_UPDATE_CHANNEL;', 1)
          s = s.replace(old2, '            UpdateChecker.check(applicationContext, BuildInfo.DEFAULT_UPDATE_CHANNEL, new UpdateChecker.Callback()', 1)
          p.write_text(s, encoding='utf-8')

          p = src / 'src/com/harleytg/forum/NotificationHelper.java'
          s = p.read_text(encoding='utf-8')
          old = '''        AppLogger.info(context, "notification_count",
                (source == null ? "sync" : source) + " | count=" + normalized + " previous=" + previous);'''
          new = '''        if (!hadBaseline || normalized != previous) {
            AppLogger.info(context, "notification_count",
                    (source == null ? "sync" : source) + " | count=" + normalized + " previous=" + previous);
        }'''
          if old not in s:
              raise SystemExit('Notification count logger pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = src / 'src/com/harleytg/forum/MainActivity.java'
          s = p.read_text(encoding='utf-8')
          old = '''    public String chooseInitialHost() {
        if (this.prefs.getBoolean("auto_failover", true)) {
            return System.currentTimeMillis() < this.prefs.getLong("fallback_until", 0L) ? "harleysclan.freeflarum.com" : "forum.harleytg.com";
        }
        return "forum.harleytg.com";
    }'''
          new = '''    public String chooseInitialHost() {
        return ForumConfig.PRIMARY_HOST;
    }'''
          if old not in s:
              raise SystemExit('chooseInitialHost pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('10000072', '10000078').replace('10000077', '10000078')
          s = s.replace("Update when you're ready to test the latest build.",
                        "Update when you're ready to install the latest Stable build.")
          p.write_text(s, encoding='utf-8')

          for rel in [
              'src/com/harleytg/forum/BuildInfo.java',
              'src/com/harleytg/forum/ReleaseNotes.java',
              'AndroidManifest.xml',
          ]:
              p = src / rel
              s = p.read_text(encoding='utf-8')
              s = s.replace('10000072', '10000078').replace('10000077', '10000078')
              p.write_text(s, encoding='utf-8')

          for rel in ['README.md', 'STABLE-RELEASE.md']:
              p = repo / rel
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s = s.replace('10000072', '10000078').replace('10000077', '10000078')
                  p.write_text(s, encoding='utf-8')

          p = src / 'AndroidManifest.xml'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'android:versionCode="[0-9]+"', 'android:versionCode="10000078"', s, count=1)
          s = re.sub(r'android:versionName="[^"]+"', 'android:versionName="1.0 (10000078)"', s, count=1)
          s = re.sub(r'(android:name="com\.harleytg\.APP_VERSION"\s*\n\s*android:value=")[^"]+("/>)', r'\g<1>1.0 (10000078)\g<2>', s, count=1)
          s = re.sub(r'(android:name="com\.harleytg\.APP_VERSION_CODE"\s*\n\s*android:value=")[^"]+("/>)', r'\g<1>10000078\g<2>', s, count=1)
          p.write_text(s, encoding='utf-8')

          ua = (src / 'src/com/harleytg/forum/UpdateAutomation.java').read_text(encoding='utf-8')
          if 'UpdateChecker.check(applicationContext, "dev"' in ua or 'final String str = "dev";' in ua:
              raise SystemExit('Dev updater channel still present in UpdateAutomation')
          nh = (src / 'src/com/harleytg/forum/NotificationHelper.java').read_text(encoding='utf-8')
          if 'if (!hadBaseline || normalized != previous)' not in nh:
              raise SystemExit('Notification count log suppression missing')
          ma = (src / 'src/com/harleytg/forum/MainActivity.java').read_text(encoding='utf-8')
          if 'return ForumConfig.PRIMARY_HOST;' not in ma:
              raise SystemExit('Primary-first startup fix missing')
          bi = (src / 'src/com/harleytg/forum/BuildInfo.java').read_text(encoding='utf-8')
          if 'DEFAULT_UPDATE_CHANNEL = "stable"' not in bi or 'VERSION_CODE = 10000078' not in bi:
              raise SystemExit('Stable BuildInfo identity mismatch')
          print('Stable v10000078 fixes applied')
          PY

          grep -q 'android:versionCode="10000078"' 'stable-repo/source code/AndroidManifest.xml'
          grep -q 'android:versionName="1.0 (10000078)"' 'stable-repo/source code/AndroidManifest.xml'
          ! grep -n 'UpdateChecker.check(applicationContext, "dev"' 'stable-repo/source code/src/com/harleytg/forum/UpdateAutomation.java'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and align Stable v10000078
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/stable-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/build"
          rm -rf "$WORK" "$GITHUB_WORKSPACE/out"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$GITHUB_WORKSPACE/out"

          "$BT/aapt" package -f -m -J "$WORK/gen" -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" -A "$ROOT/assets" -I "$ANDROID_JAR" -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$GITHUB_WORKSPACE/out/HCF-Stable-v10000078-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$GITHUB_WORKSPACE/out/HCF-Stable-v10000078-aligned-unsigned.apk"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/out/HCF-Stable-v10000078-aligned-unsigned.apk" | head -1 | tee "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "versionCode='10000078'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          cp "$BT/lib/apksigner.jar" "$GITHUB_WORKSPACE/out/apksigner.jar"

      - name: Publish v10000078 Stable source
        shell: bash
        run: |
          set -euo pipefail
          cd stable-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code' README.md STABLE-RELEASE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Stable updater logging and primary-first startup v10000078'
            git push origin HEAD:stable
          fi

      - name: Upload unsigned v10000078 for Stable V2 signing
        uses: actions/upload-artifact@v4
        with:
          name: hcf-stable-v10000078-polish
          path: out/
          if-no-files-found: error
          retention-days: 1

