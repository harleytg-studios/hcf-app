name: HCF Stable v10000098 Release Gate

on:
  push:
    branches: [stable]
    paths:
      - 'source code/**'
      - 'configs/app-links/**'
      - 'README.md'
      - '.github/scripts/verify-hcf-alerts-ui.py'
      - '.github/scripts/verify-release-readiness.py'
      - '.github/workflows/build-stable-v10000098.yml'
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable source
        uses: actions/checkout@v4

      - name: Run Stable source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          python3 -m json.tool configs/app-links/assetlinks.json >/dev/null

      - name: Verify live sanitized ban configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          urls = {
              "config": "https://raw.githubusercontent.com/markhitchk/hcf-app/main/configs/ban-system.config",
              "list": "https://raw.githubusercontent.com/markhitchk/hcf-app/main/configs/ban-list.json",
          }
          for name, url in urls.items():
              with urllib.request.urlopen(url, timeout=10) as response:
                  data = response.read().decode("utf-8")
              if name == "config":
                  assert "enabled=true" in data
                  assert "[ban_list]" in data
                  assert "cloudfunctions.net" not in data
              else:
                  parsed = json.loads(data)
                  assert parsed.get("schema_version") == 1
                  assert isinstance(parsed.get("users"), dict)
                  assert isinstance(parsed.get("ip_sha256"), dict)
          print("Static HCF ban configuration verified.")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile full Stable source through identity overlay
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HCF_UNSIGNED_ONLY: '1'
          HCF_OUTPUT_DIR: ${{ github.workspace }}/out-v10000098
        run: |
          set -euo pipefail
          test -n "${DISCORD_WEBHOOK_URL:-}" || { echo "DISCORD_WEBHOOK_URL is not configured"; exit 1; }
          'source code/build-release.sh'

      - name: Verify Stable APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='out-v10000098/HCF-Stable-v10000098-aligned-unsigned.apk'
          test -f "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | head -1 | tee out-v10000098/APK-BADGING.txt
          grep -q "name='com.harleytg.forum'" out-v10000098/APK-BADGING.txt
          grep -q "versionCode='10000098'" out-v10000098/APK-BADGING.txt
          grep -q "versionName='1.0 (10000098)'" out-v10000098/APK-BADGING.txt
          unzip -p "$APK" classes.dex | strings > out-v10000098/DEX-STRINGS.txt
          grep -Fq 'Stable Update Available' out-v10000098/DEX-STRINGS.txt
          grep -Fq 'same build code, revised APK hash' out-v10000098/DEX-STRINGS.txt
          grep -Fq 'HcfDiscordSecret' out-v10000098/DEX-STRINGS.txt
          grep -Fq 'configs/ban-list.json' out-v10000098/DEX-STRINGS.txt
          ! grep -Fq 'Beta Update Available' out-v10000098/DEX-STRINGS.txt
          ! grep -Fq 'com.harleytg.forum.dev' out-v10000098/DEX-STRINGS.txt
          ! grep -Fq 'cloudfunctions.net/hcfBanApi' out-v10000098/DEX-STRINGS.txt
          sha256sum "$APK" | tee out-v10000098/SHA256SUMS.txt

      - name: Upload verified unsigned Stable APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000098-Unsigned
          path: out-v10000098/
          if-no-files-found: error
          retention-days: 7
