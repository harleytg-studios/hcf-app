name: Sign iPhone & iPad Dev IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-ios:
    name: Sign iOS / iPadOS IPA
    runs-on: macos-15
    timeout-minutes: 20

    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IOS_CERTIFICATE_P12_BASE64:-}" || { echo 'Missing IOS_CERTIFICATE_P12_BASE64'; exit 1; }
          test -n "${IOS_CERTIFICATE_PASSWORD:-}" || { echo 'Missing IOS_CERTIFICATE_PASSWORD'; exit 1; }
          test -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" || { echo 'Missing IOS_PROVISIONING_PROFILE_BASE64'; exit 1; }

      - name: Download latest compiled iPhone/iPad build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(python3 - <<'PY'
          import json
          with open('ios/build-status.json', 'r', encoding='utf-8') as f:
              d=json.load(f)
          if d.get('status') != 'success':
              raise SystemExit('Latest iOS build did not report success')
          print(d['run_id'])
          PY
          )"
          echo "Unsigned build run: $RUN_ID"
          mkdir -p "$RUNNER_TEMP/unsigned"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n HarleysClanForum-iOS-v1.0-dev -D "$RUNNER_TEMP/unsigned"
          test -s "$RUNNER_TEMP/unsigned/HarleysClanForum-iOS-v1.0-dev-unsigned.ipa"

      - name: Install Apple signing certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/hcf-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"

          case "$APP_IDENTIFIER" in
            *com.harleytg.forum.dev) ;;
            *) echo "Provisioning profile does not match com.harleytg.forum.dev: $APP_IDENTIFIER"; exit 1 ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          test -n "$SIGN_IDENTITY" || { echo 'No Apple code-signing identity found in the P12'; exit 1; }

          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PLIST=$RUNNER_TEMP/profile.plist" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Signing identity: $SIGN_IDENTITY"
          echo "Provisioning profile: $PROFILE_NAME"
          echo "Team: $TEAM_ID"

      - name: Sign compiled iPhone/iPad app
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/signed"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          unzip -q "$RUNNER_TEMP/unsigned/HarleysClanForum-iOS-v1.0-dev-unsigned.ipa"

          APP="$(find Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP" || { echo 'App bundle missing from IPA'; exit 1; }

          cp "$PROFILE_PATH" "$APP/embedded.mobileprovision"
          /usr/bin/plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/signing-entitlements.plist" "$PROFILE_PLIST"

          /usr/bin/codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/signing-entitlements.plist" \
            --timestamp=none \
            "$APP"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/final-entitlements.plist" 2>/dev/null || true

          /usr/bin/zip -qry "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-signed.ipa" Payload
          shasum -a 256 "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-signed.ipa" > "$GITHUB_WORKSPACE/HarleysClanForum-iOS-v1.0-dev-signed.sha256"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: HarleysClanForum-iOS-v1.0-dev-signed
          if-no-files-found: error
          retention-days: 30
          path: |
            HarleysClanForum-iOS-v1.0-dev-signed.ipa
            HarleysClanForum-iOS-v1.0-dev-signed.sha256
