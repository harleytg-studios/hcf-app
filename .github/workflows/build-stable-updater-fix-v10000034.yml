name: Build Stable v10000034 Updater Fix

on:
  push:
    branches:
      - fix/stable-updater-unavailable-v10000034
    paths-ignore:
      - 'build-output-ci/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater-fix branch
        uses: actions/checkout@v4

      - name: Verify Stable identity
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source code"
          test -f "$SRC/AndroidManifest.xml"
          test -f "$SRC/build-release.sh"
          grep -q 'package="com.harleytg.forum"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionCode="10000034"' "$SRC/AndroidManifest.xml"
          grep -q 'android:versionName="1.0 (10000034)"' "$SRC/AndroidManifest.xml"

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create CI-only signer
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hcf-ci.jks" \
            -storepass hcf-ci-v10000034 \
            -keypass hcf-ci-v10000034 \
            -alias hcf-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HCF Stable CI Updater Fix,O=Harley's Studios,C=US"
          printf '%s\n' hcf-ci-v10000034 > "$RUNNER_TEMP/hcf-pass.txt"

      - name: Build corrected APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source code"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          chmod +x "$SRC/build-release.sh"
          ANDROID_SDK_ROOT="$ANDROID_HOME" \
          BUILD_TOOLS_VERSION='35.0.0' \
          ANDROID_PLATFORM_VERSION='35' \
          HCF_KEYSTORE="$RUNNER_TEMP/hcf-ci.jks" \
          HCF_KEY_ALIAS='hcf-release' \
          HCF_KEY_PASSWORD_FILE="$RUNNER_TEMP/hcf-pass.txt" \
          HCF_OUTPUT_DIR="$OUT" \
          "$SRC/build-release.sh"
          mv "$OUT/HarleysClanForum-1.0.apk" "$OUT/HCF-Stable-v10000034-UpdaterFix-CI.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/HCF-Stable-v10000034-UpdaterFix-CI.apk" | tee "$OUT/APK-BADGING.txt"
          grep -q "package: name='com.harleytg.forum' versionCode='10000034' versionName='1.0 (10000034)'" "$OUT/APK-BADGING.txt"
          sha256sum "$OUT/HCF-Stable-v10000034-UpdaterFix-CI.apk" | tee "$OUT/APK-SHA256.txt"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000034-UpdaterFix-CI
          path: |
            out/HCF-Stable-v10000034-UpdaterFix-CI.apk
            out/APK-BADGING.txt
            out/APK-SHA256.txt
          if-no-files-found: error

      - name: Publish CI APK on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output-ci
          cp out/HCF-Stable-v10000034-UpdaterFix-CI.apk build-output-ci/
          cp out/APK-BADGING.txt build-output-ci/
          cp out/APK-SHA256.txt build-output-ci/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output-ci/
          git commit -m "[skip ci] Publish Stable v10000034 updater-fix CI APK" || exit 0
          git push origin HEAD:fix/stable-updater-unavailable-v10000034
