name: Apply Widget App Theme Settings

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-widget-app-theme-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply widget theme settings
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-widget-app-theme-settings.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code' '.github/scripts/verify-release-readiness.py'
          git diff --cached --check
          git commit -m 'Add app-theme controls for HCF widget'
          git push origin HEAD:dev
