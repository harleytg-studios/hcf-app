name: Temporary Dev APK Build

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-dev-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Checkout MAIN config
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build unsigned zipaligned APK and publish validation output
        shell: bash
        run: |
          set -u
          SRC="$GITHUB_WORKSPACE/source code"
          MAIN="$GITHUB_WORKSPACE/main-repo"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-apk-build"
          GEN="$RUNNER_TEMP/hcf-generated"
          OUT="$GITHUB_WORKSPACE/.build-output"
          rm -rf "$WORK" "$GEN" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$GEN/assets" "$OUT"

          build_status=0
          {
            set -euo pipefail
            test -f "$MAIN/configs/domains.config"
            test -f "$MAIN/configs/firebase.config"
            test -f "$SRC/AndroidManifest.xml.in"
            test ! -e "$SRC/AndroidManifest.xml"
            test ! -e "$SRC/assets/firebase-config.js"

            if [[ -d "$SRC/assets" ]]; then cp -a "$SRC/assets/." "$GEN/assets/"; fi
            cp "$MAIN/configs/domains.config" "$GEN/assets/domains.runtime"
            cp "$MAIN/configs/firebase.config" "$GEN/assets/firebase.runtime"

            mapfile -t HOSTS < <(awk '
              /^\[primary\]$/ {s="primary"; next}
              /^\[backups\]$/ {s="backups"; next}
              /^\[/ {s=""; next}
              s=="primary" && /^domain=/ {sub(/^domain=/, ""); print}
              s=="backups" && /^domain_[0-9]+=/ {sub(/^domain_[0-9]+=/, ""); print}
            ' "$MAIN/configs/domains.config")
            [ "${#HOSTS[@]}" -ge 1 ]
            declare -A seen=()
            for host in "${HOSTS[@]}"; do
              [ -n "$host" ]
              [ "$host" = "${host,,}" ]
              [[ "$host" =~ ^[a-z0-9.-]+$ ]]
              [[ "$host" == *.* ]]
              [[ "$host" != *..* ]]
              [[ "$host" != .* && "$host" != *. ]]
              [[ "$host" != *".online" ]]
              [[ "$host" != *"://"* && "$host" != *"/"* ]]
              [ -z "${seen[$host]:-}" ]
              seen[$host]=1
            done
            grep -q '^https_only=true$' "$MAIN/configs/domains.config"
            ! grep -qi '\.online' "$MAIN/configs/domains.config"

            for key in api_key auth_domain project_id storage_bucket messaging_sender_id app_id measurement_id; do
              grep -Eq "^${key}=.+$" "$MAIN/configs/firebase.config"
            done

            if grep -R -n -E 'forum\.harleytg\.com|harleysclan\.freeflarum\.com|forum\.harleytg\.online' "$SRC/src" --include='*.java'; then
              echo 'Hardcoded forum domain found in Java source' >&2
              exit 20
            fi

            declare -A fb=()
            while IFS='=' read -r key value; do
              case "$key" in api_key|auth_domain|project_id|storage_bucket|messaging_sender_id|app_id|measurement_id) fb[$key]="$value" ;; esac
            done < "$MAIN/configs/firebase.config"
            cat > "$GEN/assets/firebase-config.js" <<EOF
          // GENERATED from MAIN configs/firebase.config. Do not edit or commit.
          const firebaseConfig = {
            apiKey: "${fb[api_key]}",
            authDomain: "${fb[auth_domain]}",
            projectId: "${fb[project_id]}",
            storageBucket: "${fb[storage_bucket]}",
            messagingSenderId: "${fb[messaging_sender_id]}",
            appId: "${fb[app_id]}",
            measurementId: "${fb[measurement_id]}"
          };
          EOF

            python3 - "$SRC/AndroidManifest.xml.in" "$GEN/AndroidManifest.xml" "${HOSTS[@]}" <<'PY'
          import sys
          template, output, *hosts = sys.argv[1:]
          text = open(template, encoding='utf-8').read()
          filters = []
          for host in hosts:
              filters.append(f'''            <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="{host}" />
                      </intent-filter>''')
          if '@@HCF_APP_LINK_FILTERS@@' not in text:
              raise SystemExit('manifest placeholder missing')
          text = text.replace('@@HCF_APP_LINK_FILTERS@@', '\n'.join(filters))
          open(output, 'w', encoding='utf-8').write(text)
          PY

            "$BT/aapt" package -f -m -J "$WORK/gen" -M "$GEN/AndroidManifest.xml" -S "$SRC/res" -A "$GEN/assets" -I "$ANDROID_JAR" -F "$WORK/resources.apk"
            java -m jdk.compiler/com.sun.tools.javac.Main --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" $(find "$WORK/gen" "$SRC/src" -name '*.java' -print)
            "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" $(find "$WORK/classes" -name '*.class' -print)
            cp "$WORK/resources.apk" "$WORK/unsigned.apk"
            (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
            "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk"
            "$BT/zipalign" -c -p 4 "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk"
            cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"

            "$BT/aapt" dump badging "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk" > "$OUT/APK-BADGING.txt"
            head -n 8 "$OUT/APK-BADGING.txt"
            grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
            grep -q "versionCode='10000035'" "$OUT/APK-BADGING.txt"
            grep -q "versionName='1.0 (10000035)'" "$OUT/APK-BADGING.txt"
            grep -q "sdkVersion:'26'" "$OUT/APK-BADGING.txt"
            grep -q "targetSdkVersion:'34'" "$OUT/APK-BADGING.txt"
            unzip -p "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk" assets/domains.runtime > "$OUT/DOMAINS-RUNTIME.txt"
            grep -q '^domain=forum.harleytg.com$' "$OUT/DOMAINS-RUNTIME.txt"
            grep -q '^domain_1=harleysclan.freeflarum.com$' "$OUT/DOMAINS-RUNTIME.txt"
            unzip -l "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk" | grep -q 'assets/firebase.runtime'
            unzip -l "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk" | grep -q 'assets/firebase-config.js'

            {
              echo 'STATUS=PASS'
              echo "DEV_COMMIT=$(git rev-parse HEAD)"
              echo 'PACKAGE=com.harleytg.forum.dev'
              echo 'VERSION_CODE=10000035'
              echo 'VERSION_NAME=1.0 (10000035)'
              echo 'MIN_SDK=26'
              echo 'TARGET_SDK=34'
              echo "JAVA_FILE_COUNT=$(find "$SRC/src" -name '*.java' | wc -l | tr -d ' ')"
              echo 'CONFIG_SOURCE=main:configs/domains.config,main:configs/firebase.config'
              echo 'ZIPALIGN=PASS'
              echo 'SIGNED=NO'
            } > "$OUT/BUILD-STATUS.txt"
            sha256sum "$OUT/HCF-Beta-v10000035-UNSIGNED-ZIPALIGNED.apk" > "$OUT/UNSIGNED-SHA256.txt"
          } > "$OUT/BUILD.log" 2>&1 || build_status=$?

          if [[ "$build_status" -ne 0 ]]; then
            {
              echo 'STATUS=FAIL'
              echo "EXIT_CODE=$build_status"
              echo "DEV_COMMIT=$(git rev-parse HEAD)"
            } > "$OUT/BUILD-STATUS.txt"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .build-output
          git commit -m 'TEMP: Dev APK compile output'
          git push origin HEAD:dev

          exit "$build_status"
