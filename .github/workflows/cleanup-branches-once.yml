name: One-time HCF branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with authenticated origin
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail

          echo "Keeping only: main, dev, stable"
          git ls-remote --heads origin \
            | sed -E 's#^[0-9a-f]+[[:space:]]+refs/heads/##' \
            | sort > "$RUNNER_TEMP/branches.txt"

          while IFS= read -r branch; do
            case "$branch" in
              main|dev|stable)
                echo "KEEP   $branch"
                ;;
              *)
                echo "DELETE $branch"
                deleted=false
                for attempt in 1 2 3; do
                  if git push origin --delete "$branch"; then
                    deleted=true
                    break
                  fi
                  echo "Retry $attempt for $branch" >&2
                  sleep 2
                done
                if [ "$deleted" != true ]; then
                  echo "Could not delete $branch" >&2
                  exit 1
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/branches.txt"

          git ls-remote --heads origin \
            | sed -E 's#^[0-9a-f]+[[:space:]]+refs/heads/##' \
            | sort > "$RUNNER_TEMP/remaining.txt"

          echo "Remaining branches:"
          sed 's/^/ - /' "$RUNNER_TEMP/remaining.txt"

          expected=$'dev\nmain\nstable'
          actual="$(cat "$RUNNER_TEMP/remaining.txt")"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected branches remain after cleanup." >&2
            exit 1
          fi
