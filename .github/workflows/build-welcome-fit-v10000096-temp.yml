name: HCF Beta v10000096 Welcome Rebuild

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v10000096:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Package source as v10000096
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('source code/AndroidManifest.xml')
          app = Path('source code/src/com/harleytg/forum/HcfApplication.java')
          readme = Path('README.md')

          def replace_all(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected {old!r} in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_all(manifest, '10000095', '10000096')
          replace_all(app, '10000095', '10000096')
          text = app.read_text(encoding='utf-8')
          if 'static final int INTERNAL_BUILD = 115;' in text:
              app.write_text(text.replace('static final int INTERNAL_BUILD = 115;', 'static final int INTERNAL_BUILD = 116;'), encoding='utf-8')
          replace_all(readme, '10000095', '10000096')
          text = readme.read_text(encoding='utf-8')
          if 'Internal build: `115`' in text:
              readme.write_text(text.replace('Internal build: `115`', 'Internal build: `116`'), encoding='utf-8')
          PY

          grep -Fq 'android:versionCode="10000096"' 'source code/AndroidManifest.xml'
          grep -Fq 'android:versionName="1.0 (10000096)"' 'source code/AndroidManifest.xml'
          grep -Fq 'VERSION_CODE = 10000096;' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'WelcomeScreenFitter' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq '@drawable/nav_button_background' 'source code/res/layout/activity_main.xml'
          test "$(find 'source code/src/com/harleytg/forum' -maxdepth 1 -name '*.java' | wc -l)" -eq 8

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and package unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          W="$RUNNER_TEMP/hcf-v10000096"
          O="$GITHUB_WORKSPACE/out-v10000096"
          mkdir -p "$W/gen" "$W/classes" "$W/dex" "$O/signing-tools/lib"

          "$BT/aapt" package -f -m -J "$W/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$AJ" -F "$W/resources.apk"
          mapfile -t JAVA_FILES < <(find "$W/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$AJ" -d "$W/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$W/classes" -name '*.class' -print)
          "$BT/d8" --lib "$AJ" --min-api 26 --release --output "$W/dex" "${CLASS_FILES[@]}"

          cp "$W/resources.apk" "$W/unsigned.apk"
          (cd "$W/dex" && "$BT/aapt" add "$W/unsigned.apk" classes.dex)
          APK="$O/HCF-Beta-v10000096-WelcomeFit-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$W/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$O/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$O/APK-BADGING.txt"
          grep -q "versionCode='10000096'" "$O/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000096)'" "$O/APK-BADGING.txt"
          unzip -p "$APK" classes.dex | strings > "$O/DEX-STRINGS.txt"
          grep -Fq 'WelcomeScreenFitter' "$O/DEX-STRINGS.txt"
          grep -Fq 'Welcome To' "$O/DEX-STRINGS.txt"
          cp "$BT/apksigner" "$O/signing-tools/apksigner"
          cp "$BT/lib/apksigner.jar" "$O/signing-tools/lib/apksigner.jar"
          sha256sum "$APK" | tee "$O/SHA256SUMS.txt"

      - name: Upload v10000096 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000096-WelcomeFit-Unsigned
          path: out-v10000096/
          if-no-files-found: error
          retention-days: 7
