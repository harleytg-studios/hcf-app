name: TEMP Build Stable v10000075 From Dev

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-build-stable-v10000075.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Prepare Stable source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stable-promotion
          mkdir -p stable-promotion
          cp -a 'source code' 'stable-promotion/source code'
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('stable-promotion/source code')
          version_code = '10000075'
          version_name = '1.0 (10000075)'

          # Stable Java namespace throughout: no .dev package identity.
          for p in root.rglob('*.java'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('com.harleytg.forum.dev', 'com.harleytg.forum')
              p.write_text(s, encoding='utf-8')

          # Stable manifest identity/channel/version.
          manifest = root / 'AndroidManifest.xml.in'
          s = manifest.read_text(encoding='utf-8')
          s = s.replace('package="com.harleytg.forum.dev"', 'package="com.harleytg.forum"')
          s = re.sub(r'android:versionCode="\d+"', f'android:versionCode="{version_code}"', s, count=1)
          s = re.sub(r'android:versionName="[^"]+"', f'android:versionName="{version_name}"', s, count=1)
          s = s.replace('android:value="dev"', 'android:value="stable"')
          s = re.sub(r'<meta-data android:name="com\.harleytg\.APP_VERSION" android:value="[^"]+" />',
                     f'<meta-data android:name="com.harleytg.APP_VERSION" android:value="{version_name}" />', s)
          s = re.sub(r'<meta-data android:name="com\.harleytg\.APP_VERSION_CODE" android:value="[^"]+" />',
                     f'<meta-data android:name="com.harleytg.APP_VERSION_CODE" android:value="{version_code}" />', s)
          s = s.replace('com.harleytg.forum.dev.updatefiles', 'com.harleytg.forum.updatefiles')
          manifest.write_text(s, encoding='utf-8')

          # Stable build constants while retaining the shared Dev feature code.
          appconfig = root / 'src/com/harleytg/forum/AppConfig.java'
          s = appconfig.read_text(encoding='utf-8')
          s = re.sub(r'static final int VERSION_CODE = \d+;', f'static final int VERSION_CODE = {version_code};', s)
          s = re.sub(r'static final int INTERNAL_BUILD = \d+;', 'static final int INTERNAL_BUILD = 89;', s)
          s = re.sub(r'static final String CHANNEL = "[^"]+";', 'static final String CHANNEL = "Stable";', s)
          s = re.sub(r'static final String APK_FILE_NAME = "[^"]+";', 'static final String APK_FILE_NAME = "Harley\'s Clan Forum.apk";', s)
          s = re.sub(r'static final String DEVELOPMENT_BUILD_LABEL = "[^"]+";', 'static final String DEVELOPMENT_BUILD_LABEL = "Harley\'s Clan Forum v1.0 [Stable]";', s)
          s = re.sub(r'static final String META_LINE = "[^"]+";', 'static final String META_LINE = "1.0 • Stable";', s)
          s = re.sub(r'static final String VERSION_BUILD_LINE = "[^"]+";', 'static final String VERSION_BUILD_LINE = "1.0 • Stable • Foundation Release";', s)
          s = re.sub(r'static final String DEFAULT_UPDATE_CHANNEL = "[^"]+";', 'static final String DEFAULT_UPDATE_CHANNEL = "stable";', s)
          s = re.sub(r'static final boolean ALLOW_UPDATE_CHANNEL_SWITCH = (true|false);', 'static final boolean ALLOW_UPDATE_CHANNEL_SWITCH = false;', s)
          appconfig.write_text(s, encoding='utf-8')

          # Stable app label.
          strings = root / 'res/values/strings.xml'
          s = strings.read_text(encoding='utf-8')
          s = s.replace("Harley\\'s Clan Forum [Beta]", "Harley\\'s Clan Forum")
          s = s.replace("Harley\\'s Clan Forum [DevBuild]", "Harley\\'s Clan Forum")
          strings.write_text(s, encoding='utf-8')

          # No separate round launcher artwork in the Stable source package.
          for p in list(root.glob('res/mipmap-*/ic_launcher_round.png')) + list(root.glob('res/mipmap-*/ic_launcher_round.xml')):
              if p.exists(): p.unlink()

          # Promote the v10000072 notification latency fixes into source.
          svc = root / 'src/com/harleytg/forum/InstantNotificationService.java'
          s = svc.read_text(encoding='utf-8')
          s = re.sub(r'private static final long FAILURE_MIN_MS = [0-9_]+L;', 'private static final long FAILURE_MIN_MS = 1_000L;', s)
          s = re.sub(r'private static final long FAILURE_MAX_MS = [0-9_]+L;', 'private static final long FAILURE_MAX_MS = 1_000L;', s)
          svc.write_text(s, encoding='utf-8')

          # Basic safety assertions before compilation.
          for p in root.rglob('*.java'):
              txt = p.read_text(encoding='utf-8')
              if 'package com.harleytg.forum.dev;' in txt:
                  raise SystemExit(f'.dev package remains in {p}')
          m = manifest.read_text(encoding='utf-8')
          assert 'package="com.harleytg.forum"' in m
          assert f'android:versionCode="{version_code}"' in m
          assert 'android:value="stable"' in m
          PY

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create temporary CI signer
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hcf-ci.jks" \
            -storepass hcf-ci-v10000075 \
            -keypass hcf-ci-v10000075 \
            -alias hcf-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HCF Stable v10000075 CI,O=Harley's Studios,C=US"
          printf '%s\n' hcf-ci-v10000075 > "$RUNNER_TEMP/hcf-pass.txt"
          FP="$(keytool -list -v -keystore "$RUNNER_TEMP/hcf-ci.jks" -storepass hcf-ci-v10000075 -alias hcf-ci | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "CI_FP=$FP" >> "$GITHUB_ENV"

      - name: Adapt build script for Stable promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path('stable-promotion/source code/build-release.sh')
          s = p.read_text(encoding='utf-8')
          fp = os.environ['CI_FP']
          s = re.sub(r'expected_signer_sha256="[A-Fa-f0-9]+"', f'expected_signer_sha256="{fp}"', s)
          s = re.sub(r'expected_package="[^"]+"', 'expected_package="com.harleytg.forum"', s)
          s = re.sub(r'expected_version_code="[^"]+"', 'expected_version_code="10000075"', s)
          s = re.sub(r'expected_version_name="[^"]+"', 'expected_version_name="1.0 (10000075)"', s)
          s = s.replace('keystore_alias="${HCF_KEY_ALIAS:-hcf-beta-v2}"', 'keystore_alias="${HCF_KEY_ALIAS:-hcf-ci}"')
          s = re.sub(r'output_apk="\$output_dir/[^"]+"', 'output_apk="$output_dir/HCF-Stable-v10000075-FullDevPromotion-CI.apk"', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build Stable APK from source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/stable-promotion/source code"
          OUT="$GITHUB_WORKSPACE/stable-promotion/out"
          mkdir -p "$OUT"
          chmod +x "$SRC/build-release.sh"
          ANDROID_SDK_ROOT="$ANDROID_HOME" \
          BUILD_TOOLS_VERSION='35.0.0' \
          ANDROID_PLATFORM_VERSION='35' \
          HCF_KEYSTORE="$RUNNER_TEMP/hcf-ci.jks" \
          HCF_KEY_ALIAS='hcf-ci' \
          HCF_KEY_PASSWORD_FILE="$RUNNER_TEMP/hcf-pass.txt" \
          HCF_OUTPUT_DIR="$OUT" \
          "$SRC/build-release.sh"

      - name: Verify Stable identity
        shell: bash
        run: |
          set -euo pipefail
          APK='stable-promotion/out/HCF-Stable-v10000075-FullDevPromotion-CI.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee stable-promotion/APK-BADGING.txt
          grep -q "package: name='com.harleytg.forum' versionCode='10000075' versionName='1.0 (10000075)'" stable-promotion/APK-BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee stable-promotion/APK-SIGNATURE.txt
          if grep -R -n 'package com\.harleytg\.forum\.dev;' 'stable-promotion/source code/src'; then exit 31; fi
          sha256sum "$APK" | tee stable-promotion/APK-SHA256.txt
          (cd stable-promotion && zip -qr HCF-Stable-v10000075-FullDevPromotion-source.zip 'source code')

      - name: Upload Stable promotion artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000075-FullDevPromotion
          path: |
            stable-promotion/out/HCF-Stable-v10000075-FullDevPromotion-CI.apk
            stable-promotion/HCF-Stable-v10000075-FullDevPromotion-source.zip
            stable-promotion/APK-BADGING.txt
            stable-promotion/APK-SIGNATURE.txt
            stable-promotion/APK-SHA256.txt
          retention-days: 2
