name: One-time v10000093 UI Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10000093-ui-polish-once.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/status/v10000093-ui-run-${GITHUB_RUN_ID} --force

      - name: Apply requested URL controls and welcome title polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          layout = root / 'source code/res/layout/activity_main.xml'
          main = root / 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          drawable = root / 'source code/res/drawable/url_control_button_background.xml'

          xml = layout.read_text(encoding='utf-8')
          for view_id in ('urlBackButton', 'reloadButton', 'copyUrlButton', 'urlHomeButton'):
              pattern = rf'(android:id="@\+id/{re.escape(view_id)}"\s*\n\s*android:background=")@drawable/nav_button_background(")'
              xml2, count = re.subn(pattern, rf'\1@drawable/url_control_button_background\2', xml, count=1)
              if count != 1:
                  raise SystemExit(f'could not patch URL control background for {view_id}')
              xml = xml2

          copy_block = re.compile(r'(android:id="@\+id/copyUrlButton".*?android:tint=")@color/hcf_muted(".*?android:contentDescription="@string/copy_url"/>)', re.S)
          xml, count = copy_block.subn(r'\1@color/hcf_cyan_bright\2', xml, count=1)
          if count != 1:
              raise SystemExit('could not patch copy URL tint')
          layout.write_text(xml, encoding='utf-8')

          java = main.read_text(encoding='utf-8')
          old = 'String value = "Welcome to Harley\'s Clan Forum";'
          new = 'String value = "Welcome To\\nHarley\'s Clan Forum";'
          if old not in java:
              raise SystemExit('welcome title source string not found')
          java = java.replace(old, new, 1)
          main.write_text(java, encoding='utf-8')

          drawable.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<selector xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:state_pressed="true">\n        <shape android:shape="rectangle">\n            <solid android:color="@color/hcf_nav_pressed"/>\n            <corners android:radius="12dp"/>\n            <stroke android:width="1dp" android:color="@color/hcf_cyan_bright"/>\n        </shape>\n    </item>\n    <item>\n        <shape android:shape="rectangle">\n            <solid android:color="@color/hcf_nav_bg"/>\n            <corners android:radius="12dp"/>\n            <stroke android:width="1dp" android:color="@color/hcf_cyan"/>\n        </shape>\n    </item>\n</selector>\n''', encoding='utf-8')
          PY

          grep -Fq 'String value = "Welcome To\nHarley'"'"'s Clan Forum";' 'source code/src/com/harleytg/forum/HcfMainActivities.java'
          for id in urlBackButton reloadButton copyUrlButton urlHomeButton; do
            python3 - "$id" <<'PY'
          from pathlib import Path
          import re, sys
          text = Path('source code/res/layout/activity_main.xml').read_text(encoding='utf-8')
          i = sys.argv[1]
          p = rf'android:id="@\+id/{re.escape(i)}"\s*\n\s*android:background="@drawable/url_control_button_background"'
          if not re.search(p, text): raise SystemExit(f'missing styled {i}')
          PY
          done
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .

      - name: Commit requested UI polish to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/res/layout/activity_main.xml' \
                  'source code/res/drawable/url_control_button_background.xml' \
                  'source code/src/com/harleytg/forum/HcfMainActivities.java'
          git commit -m 'Polish URL controls and welcome title'
          git push origin HEAD:dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build revised v10000093 unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          W="$RUNNER_TEMP/hcf-v10000093-ui"
          O="$GITHUB_WORKSPACE/out-v10000093-ui"
          mkdir -p "$W/gen" "$W/classes" "$W/dex" "$O"
          "$BT/aapt" package -f -m -J "$W/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$AJ" -F "$W/resources.apk"
          mapfile -t JF < <(find "$W/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$AJ" -d "$W/classes" "${JF[@]}"
          mapfile -t CF < <(find "$W/classes" -name '*.class' -print)
          "$BT/d8" --lib "$AJ" --min-api 26 --release --output "$W/dex" "${CF[@]}"
          cp "$W/resources.apk" "$W/unsigned.apk"
          (cd "$W/dex" && "$BT/aapt" add "$W/unsigned.apk" classes.dex)
          APK="$O/HCF-Beta-v10000093-UI-Polish-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$W/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | head -1 | tee "$O/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$O/APK-BADGING.txt"
          grep -q "versionCode='10000093'" "$O/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000093)'" "$O/APK-BADGING.txt"
          sha256sum "$APK" | tee "$O/SHA256SUMS.txt"
          cp "$BT/apksigner" "$O/apksigner"
          cp "$BT/lib/apksigner.jar" "$O/apksigner.jar"

      - name: Upload revised unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000093-UI-Polish-Unsigned
          path: out-v10000093-ui/
          if-no-files-found: error
          retention-days: 7
