name: HCF Beta v10000097 Release Gate

on:
  push:
    branches: [dev]
    paths:
      - 'source code/**'
      - 'configs/app-links/**'
      - 'README.md'
      - '.github/scripts/verify-hcf-alerts-ui.py'
      - '.github/scripts/verify-release-readiness.py'
      - '.github/workflows/build-dev-v10000097.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-source-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Fix startup loader first visible frame
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          source = path.read_text(encoding='utf-8')

          if 'LOADER_FIRST_FRAME_HOLD_MS' in source:
              print('Startup loader timing fix already present.')
              raise SystemExit(0)

          old_constants = '''        private static final long LOADER_FADE_MS = 220L;
        private static final long WEBVIEW_HANDOFF_DELAY_MS = 80L;
'''
          new_constants = '''        private static final long LOADER_FADE_MS = 220L;
        private static final long LOADER_FIRST_FRAME_HOLD_MS = 300L;
        private static final long WEBVIEW_HANDOFF_DELAY_MS = 80L;
'''
          if old_constants not in source:
              raise SystemExit('Could not locate startup timing constants')
          source = source.replace(old_constants, new_constants, 1)

          old_method = '''        private void startSystemLoader() {
            if (!resumed || loaderStarted || handoffStarted || destroyed) return;
            loaderStarted = true;

            publishStage(4, "Loading app preferences", "Applying theme, performance and saved native settings.");
            AppLogger.info(this, "startup_loader", "begin");

            Thread worker = new Thread(new Runnable() {
                @Override public void run() {
                    runSystemChecks();
                }
            }, "hcf-startup-checks");
            worker.setPriority(Thread.NORM_PRIORITY);
            worker.start();
        }
'''
          new_method = '''        private void startSystemLoader() {
            if (!resumed || loaderStarted || handoffStarted || destroyed) return;
            loaderStarted = true;

            // Always give both first-run and returning users a real visible 0% frame
            // before any background check is allowed to advance the progress bar.
            if (loaderOverlay != null) {
                loaderOverlay.animate().cancel();
                loaderOverlay.setAlpha(1.0f);
                loaderOverlay.setVisibility(View.VISIBLE);
            }
            if (loaderBackdrop != null) {
                loaderBackdrop.animate().cancel();
                loaderBackdrop.setAlpha(1.0f);
                loaderBackdrop.setVisibility(View.VISIBLE);
            }
            if (loaderPanel != null) {
                loaderPanel.animate().cancel();
                loaderPanel.setAlpha(1.0f);
                loaderPanel.setVisibility(View.VISIBLE);
            }
            if (retryButton != null) retryButton.setVisibility(View.GONE);
            if (loaderTitle != null) loaderTitle.setText("Starting Harley's Clan Forum");
            if (loaderStatus != null) loaderStatus.setText("Starting native systems");
            if (loaderDetail != null) {
                loaderDetail.setText("Preparing system checks before the forum opens.");
            }
            if (loaderProgress != null) loaderProgress.setProgress(0, false);

            AppLogger.info(this, "startup_loader", "visible_zero");

            mainHandler.postDelayed(new Runnable() {
                @Override public void run() {
                    if (destroyed || isFinishing() || isDestroyed() || handoffStarted) return;
                    if (!resumed) {
                        loaderStarted = false;
                        return;
                    }

                    publishStage(4, "Loading app preferences", "Applying theme, performance and saved native settings.");
                    AppLogger.info(StartupActivity.this, "startup_loader", "begin_after_visible_frame");

                    Thread worker = new Thread(new Runnable() {
                        @Override public void run() {
                            runSystemChecks();
                        }
                    }, "hcf-startup-checks");
                    worker.setPriority(Thread.NORM_PRIORITY);
                    worker.start();
                }
            }, LOADER_FIRST_FRAME_HOLD_MS);
        }
'''
          if old_method not in source:
              raise SystemExit('Could not locate startSystemLoader()')
          source = source.replace(old_method, new_method, 1)
          path.write_text(source, encoding='utf-8')
          print('Patched startup loader: visible 0% frame before checks.')
          PY

          git diff --check
          if git diff --quiet -- 'source code/src/com/harleytg/forum/HcfUITheme.java'; then
            echo 'No source commit needed.'
          else
            git config user.name 'Harleys Studios Build Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add 'source code/src/com/harleytg/forum/HcfUITheme.java'
            git commit -m 'Fix startup loader first visible frame'
            git push origin HEAD:dev
          fi

      - name: Run release source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          python3 -m json.tool configs/app-links/assetlinks.json >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile full source and package unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-v10000097"
          OUT="$GITHUB_WORKSPACE/out-v10000097"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000097-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000097'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000097)'" "$OUT/APK-BADGING.txt"

          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq 'same build code, revised APK hash' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'APK SHA-256 does not match' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'App Setup' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'HCF Alerts are the real forum alerts.' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'begin_after_visible_frame' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'Method not decompiled' "$OUT/DEX-STRINGS.txt"
          ! grep -Fq 'Code decompiled incorrectly' "$OUT/DEX-STRINGS.txt"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"

      - name: Upload verified unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000097-Unsigned
          path: out-v10000097/
          if-no-files-found: error
          retention-days: 7
