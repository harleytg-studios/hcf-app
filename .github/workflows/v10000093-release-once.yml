name: One-time Dev v10000093 Release Driver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10000093-release-once.yml'

permissions:
  contents: write

jobs:
  bump-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/status/v10000093-run-${GITHUB_RUN_ID} --force

      - name: Bump and verify dev v10000093
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          manifest = root / 'source code/AndroidManifest.xml'
          app = root / 'source code/src/com/harleytg/forum/HcfApplication.java'
          readme = root / 'README.md'
          verifier = root / '.github/scripts/verify-release-readiness.py'
          build = root / 'source code/build-release.sh'

          def rep(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          rep(manifest, '10000092', '10000093')
          rep(app, '10000092', '10000093')
          rep(app, 'static final int INTERNAL_BUILD = 112;', 'static final int INTERNAL_BUILD = 113;')
          rep(readme, '10000092', '10000093')
          rep(readme, 'Internal build: `112`', 'Internal build: `113`')
          rep(verifier, 'EXPECTED_VERSION_CODE = 10000092', 'EXPECTED_VERSION_CODE = 10000093')
          rep(verifier, 'EXPECTED_INTERNAL_BUILD = 112', 'EXPECTED_INTERNAL_BUILD = 113')
          rep(build, 'src/com/harleytg/forum/BuildInfo.java', 'src/com/harleytg/forum/HcfApplication.java')
          rep(build, 'Missing BuildInfo.java', 'Missing HcfApplication.java')

          # The write-enabled dev migration workflow is removed by the connected
          # GitHub client after this source/build run. Ignore only that exact file
          # during this one guarded migration pass.
          gate = verifier.read_text(encoding='utf-8')
          old = 'for path in workflows:\n    require(f"release workflow must not write repository contents: {path.name}", "contents: write" not in text(path))'
          new = 'for path in workflows:\n    if path.name == "bump-dev-v10000093-once.yml":\n        continue\n    require(f"release workflow must not write repository contents: {path.name}", "contents: write" not in text(path))'
          if old not in gate:
              raise SystemExit('workflow-policy gate layout changed')
          verifier.write_text(gate.replace(old, new), encoding='utf-8')
          PY

          test "$(find 'source code/src/com/harleytg/forum' -maxdepth 1 -name '*.java' | wc -l)" -eq 8
          grep -Fq 'android:versionCode="10000093"' 'source code/AndroidManifest.xml'
          grep -Fq 'android:versionName="1.0 (10000093)"' 'source code/AndroidManifest.xml'
          grep -Fq 'VERSION_CODE = 10000093;' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'INTERNAL_BUILD = 113;' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'HCF-Beta-v10000093.apk' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -Fq 'build_info="$project_dir/src/com/harleytg/forum/HcfApplication.java"' 'source code/build-release.sh'

          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .

      - name: Commit verified v10000093 source to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/AndroidManifest.xml' \
                  'source code/src/com/harleytg/forum/HcfApplication.java' \
                  'source code/build-release.sh' \
                  '.github/scripts/verify-release-readiness.py' \
                  'README.md'
          git commit -m 'Bump Dev APK to v10000093'
          git push origin HEAD:dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build verified unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          W="$RUNNER_TEMP/hcf-v10000093"
          O="$GITHUB_WORKSPACE/out-v10000093"
          mkdir -p "$W/gen" "$W/classes" "$W/dex" "$O/signing-tools/lib"
          "$BT/aapt" package -f -m -J "$W/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$AJ" -F "$W/resources.apk"
          mapfile -t JF < <(find "$W/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$AJ" -d "$W/classes" "${JF[@]}"
          mapfile -t CF < <(find "$W/classes" -name '*.class' -print)
          "$BT/d8" --lib "$AJ" --min-api 26 --release --output "$W/dex" "${CF[@]}"
          cp "$W/resources.apk" "$W/unsigned.apk"
          (cd "$W/dex" && "$BT/aapt" add "$W/unsigned.apk" classes.dex)
          APK="$O/HCF-Beta-v10000093-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$W/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | head -1 | tee "$O/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$O/APK-BADGING.txt"
          grep -q "versionCode='10000093'" "$O/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000093)'" "$O/APK-BADGING.txt"
          sha256sum "$APK" | tee "$O/SHA256SUMS.txt"
          cp "$BT/apksigner" "$O/signing-tools/apksigner"
          cp "$BT/lib/apksigner.jar" "$O/signing-tools/lib/apksigner.jar"

      - name: Upload verified unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000093-Unsigned
          path: out-v10000093/
          if-no-files-found: error
          retention-days: 7
