name: TEMP Export Dev Source For Stable v10000075

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/temp-export-dev-source-for-stable75.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Record run locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .temp-stable75-export-run
          printf 'RUN_ID=%s\nHEAD_SHA=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .temp-stable75-export-run/INFO.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .temp-stable75-export-run/INFO.txt
          git commit -m '[skip ci] Record Stable v10000075 source export run'
          git push origin HEAD:dev

      - name: Package current Dev source and MAIN configs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export
          mkdir -p export/configs
          cp -a 'source code' export/
          git show origin/main:configs/domains.config > export/configs/domains.config
          git show origin/main:configs/firebase.config > export/configs/firebase.config
          printf 'SOURCE_BRANCH=dev\nSOURCE_SHA=%s\n' "$(git rev-parse HEAD^)" > export/SOURCE-REVISION.txt
          (cd export && zip -qr ../HCF-Dev-current-source-for-Stable-v10000075.zip .)

      - name: Upload source export
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Dev-current-source-for-Stable-v10000075
          path: HCF-Dev-current-source-for-Stable-v10000075.zip
          retention-days: 2
