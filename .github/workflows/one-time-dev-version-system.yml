name: One-time compact Dev version system migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-dev-version-system.yml'

permissions:
  contents: write

jobs:
  migrate-version-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply compact version system
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '1.1-hf1-a1'
          VERSION_TAG = 'v' + VERSION
          VERSION_CODE = 100000102
          INTERNAL_BUILD = 120
          PATCH_NAME = 'FGS-Crash-Fix'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          manifest_path = Path('source code/AndroidManifest.xml')
          manifest = read(manifest_path)
          manifest = sub_once(manifest, r'android:versionCode="\d+"', f'android:versionCode="{VERSION_CODE}"', 'manifest versionCode')
          manifest = sub_once(manifest, r'android:versionName="[^"]+"', f'android:versionName="{VERSION} ({VERSION_CODE})"', 'manifest versionName')
          manifest = sub_once(manifest, r'(<meta-data android:name="com\.harleytg\.APP_VERSION" android:value=")[^"]+("/>)', rf'\g<1>{VERSION} ({VERSION_CODE})\g<2>', 'manifest APP_VERSION')
          manifest = sub_once(manifest, r'(<meta-data android:name="com\.harleytg\.APP_VERSION_CODE" android:value=")\d+("/>)', rf'\g<1>{VERSION_CODE}\g<2>', 'manifest APP_VERSION_CODE')
          write(manifest_path, manifest)

          core_path = Path('source code/src/com/harleytg/forum/HcfCore.java')
          core = read(core_path)
          string_values = {
              'APK_FILE_NAME': f'HCF-Beta-{VERSION_TAG}.apk',
              'DEVELOPMENT_BUILD_LABEL': f"Harley's Clan Forum {VERSION_TAG} [Development / Beta / RC]",
              'META_LINE': f'{VERSION_TAG} • Hotfix 1 • Alpha 1',
              'USER_AGENT_MARKER': f'HarleysClanForumApp/{VERSION} Build/{VERSION_CODE}',
              'VERSION': VERSION,
              'VERSION_CODE_SCHEME': 'dev-hotfix-alpha-v1',
              'VERSION_TAG': VERSION_TAG,
          }
          for key, value in string_values.items():
              core = sub_once(core, rf'^    static final String {key} = ".*";$', f'    static final String {key} = "{value}";', f'BuildInfo {key}')
          core = sub_once(core, r'^    static final int INTERNAL_BUILD = \d+;$', f'    static final int INTERNAL_BUILD = {INTERNAL_BUILD};', 'BuildInfo INTERNAL_BUILD')
          core = sub_once(core, r'^    static final int VERSION_CODE = \d+;$', f'    static final int VERSION_CODE = {VERSION_CODE};', 'BuildInfo VERSION_CODE')
          core = sub_once(core, r'^    static final String VERSION_BUILD_LINE = .*;$', '    static final String VERSION_BUILD_LINE = "v" + VERSION + " • Hotfix 1 • Alpha 1 • Build " + VERSION_CODE;', 'BuildInfo VERSION_BUILD_LINE')
          if 'static final String PATCH_NAME =' not in core:
              needle = f'    static final String META_LINE = "{VERSION_TAG} • Hotfix 1 • Alpha 1";\n'
              addition = needle + f'    static final String PATCH_NAME = "{PATCH_NAME}";\n    static final String RELEASE_STAGE = "Hotfix Alpha";\n'
              if needle not in core:
                  raise SystemExit('BuildInfo META_LINE insertion point missing')
              core = core.replace(needle, addition, 1)
          write(core_path, core)

          build_path = Path('source code/build-release.sh')
          build = read(build_path)
          old_output = '    output_name="HCF-Beta-v${version_code}.apk"'
          if old_output not in build:
              raise SystemExit('Dev build output naming rule missing')
          build = build.replace(old_output, '    output_name="$buildinfo_apk_name"', 1)
          write(build_path, build)

          verifier_path = Path('.github/scripts/verify-release-readiness.py')
          verifier = read(verifier_path)
          verifier = sub_once(verifier, r'^EXPECTED_VERSION_CODE = \d+$', f'EXPECTED_VERSION_CODE = {VERSION_CODE}', 'verifier versionCode')
          verifier = sub_once(verifier, r'^EXPECTED_INTERNAL_BUILD = \d+$', f'EXPECTED_INTERNAL_BUILD = {INTERNAL_BUILD}', 'verifier internalBuild')
          if 'EXPECTED_VERSION =' not in verifier:
              verifier = verifier.replace(f'EXPECTED_VERSION_CODE = {VERSION_CODE}\n', f'EXPECTED_VERSION_CODE = {VERSION_CODE}\nEXPECTED_VERSION = "{VERSION}"\n', 1)
          else:
              verifier = sub_once(verifier, r'^EXPECTED_VERSION = ".*"$', f'EXPECTED_VERSION = "{VERSION}"', 'verifier version')
          verifier = sub_once(verifier, r'^require\("wrong versionName", .*$','require("wrong versionName", name_match.group(1) == f"{EXPECTED_VERSION} ({version_code})")', 'verifier versionName rule')
          verifier = sub_once(verifier, r'^require\("BuildInfo APK name mismatch", .*$','require("BuildInfo APK name mismatch", f\'HCF-Beta-v{EXPECTED_VERSION}.apk\' in build_info)', 'verifier APK name rule')
          verifier = sub_once(verifier, r'^require\("canonical v100000101 workflow missing", .*$','require("canonical Dev workflow missing", any(path.name == "build-dev.yml" for path in workflows))', 'verifier workflow rule')
          ua_rule = 'require("BuildInfo user agent mismatch", f"Build/{version_code}" in build_info)\n'
          if 'BuildInfo version tag mismatch' not in verifier:
              extra = 'require("BuildInfo version tag mismatch", f\'VERSION_TAG = "v{EXPECTED_VERSION}"\' in build_info)\nrequire("BuildInfo version scheme mismatch", \'VERSION_CODE_SCHEME = "dev-hotfix-alpha-v1"\' in build_info)\n'
              if ua_rule not in verifier:
                  raise SystemExit('verifier user-agent rule insertion point missing')
              verifier = verifier.replace(ua_rule, ua_rule + extra, 1)
          write(verifier_path, verifier)

          readme_path = Path('README.md')
          readme = read(readme_path)
          readme = sub_once(readme, r'^- Version name: `[^`]+`$', f'- Version name: `{VERSION} ({VERSION_CODE})`', 'README version name')
          readme = sub_once(readme, r'^- Version code: `\d+`$', f'- Version code: `{VERSION_CODE}`', 'README version code')
          readme = sub_once(readme, r'^- Internal build: `\d+`$', f'- Internal build: `{INTERNAL_BUILD}`', 'README internal build')
          if '- Version tag:' not in readme:
              readme = readme.replace(f'- Version name: `{VERSION} ({VERSION_CODE})`\n', f'- Version name: `{VERSION} ({VERSION_CODE})`\n- Version tag: `{VERSION_TAG}`\n- Patch: `{PATCH_NAME}`\n', 1)
          readme = readme.replace('v100000101 adds the resizable **HCF Notifications** Android App Widget.', 'The current dev line includes the resizable **HCF Notifications** Android App Widget.', 1)
          readme = readme.replace('The v100000101 workflow compiles', 'The generic Dev release workflow compiles', 1)
          readme = readme.replace('v100000101 uses a backend-free manual moderation design:', 'The current dev build uses a backend-free manual moderation design:', 1)
          if '## Dev version system' not in readme:
              lines = [
                  '## Dev version system',
                  '',
                  'The `dev` branch is the shared Development → Beta → RC testing line. Human-facing versions use a compact suffix while Android `versionCode` remains a strictly increasing install/update number.',
                  '',
                  '- Normal development: `v1.1-a1`, `v1.1-a2`, `v1.1-b1`, `v1.1-rc1`',
                  '- Hotfix development: `v1.1-hf1-a1`, `v1.1-hf1-a2`, `v1.1-hf1-rc1`',
                  '- Next hotfix train: `v1.1-hf2-a1`',
                  '- Stable promotion may drop the dev suffix and use the stable branch release version.',
                  f'- Current dev build: `{VERSION_TAG}` / Android versionCode `{VERSION_CODE}`.',
                  '',
                  'Future dev bumps should keep the version tag, Android versionCode, internal build, manifest, BuildInfo, verifier, and README synchronized.',
                  '',
              ]
              section = '\n'.join(lines) + '\n'
              readme = readme.replace('## HCF Notifications home-screen widget\n', section + '## HCF Notifications home-screen widget\n', 1)
          write(readme_path, readme)

          old_workflow = Path('.github/workflows/build-dev-v100000101.yml')
          new_workflow = Path('.github/workflows/build-dev.yml')
          workflow = read(old_workflow)
          workflow = workflow.replace('name: HCF Beta v100000101 Release Gate', 'name: HCF Beta Dev Release Gate', 1)
          workflow = workflow.replace("      - '.github/workflows/build-dev-v100000101.yml'", "      - '.github/workflows/build-dev.yml'", 1)
          checkout = '      - name: Checkout Dev source\n        uses: actions/checkout@v4\n'
          identity_lines = [
              '',
              '      - name: Load build identity',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          HCF_VERSION_CODE="$(sed -n \'s/.*android:versionCode="\\([0-9][0-9]*\\)".*/\\1/p\' \'source code/AndroidManifest.xml\' | head -1)"',
              '          HCF_VERSION_NAME="$(sed -n \'s/.*android:versionName="\\([^"]*\\)".*/\\1/p\' \'source code/AndroidManifest.xml\' | head -1)"',
              '          HCF_VERSION_TAG="$(sed -n \'s/.*VERSION_TAG = "\\([^"]*\\)";.*/\\1/p\' \'source code/src/com/harleytg/forum/HcfCore.java\' | head -1)"',
              '          test -n "$HCF_VERSION_CODE"',
              '          test -n "$HCF_VERSION_NAME"',
              '          test -n "$HCF_VERSION_TAG"',
              '          echo "HCF_VERSION_CODE=$HCF_VERSION_CODE" >> "$GITHUB_ENV"',
              '          echo "HCF_VERSION_NAME=$HCF_VERSION_NAME" >> "$GITHUB_ENV"',
              '          echo "HCF_VERSION_TAG=$HCF_VERSION_TAG" >> "$GITHUB_ENV"',
          ]
          load_identity = '\n'.join(identity_lines) + '\n'
          if 'Load build identity' not in workflow:
              if checkout not in workflow:
                  raise SystemExit('workflow checkout insertion point missing')
              workflow = workflow.replace(checkout, checkout + load_identity, 1)
          workflow = workflow.replace('WORK="$RUNNER_TEMP/hcf-beta-v100000101"', 'WORK="$RUNNER_TEMP/hcf-beta-${HCF_VERSION_TAG}"', 1)
          workflow = workflow.replace('OUT="$GITHUB_WORKSPACE/out-v100000101"', 'OUT="$GITHUB_WORKSPACE/out-${HCF_VERSION_TAG}"', 1)
          workflow = workflow.replace('APK="$OUT/HCF-Beta-v100000101-aligned-unsigned.apk"', 'APK="$OUT/HCF-Beta-${HCF_VERSION_TAG}-aligned-unsigned.apk"', 1)
          workflow = workflow.replace('grep -q "versionCode=\'100000101\'" "$OUT/APK-BADGING.txt"', 'grep -q "versionCode=\'${HCF_VERSION_CODE}\'" "$OUT/APK-BADGING.txt"', 1)
          workflow = workflow.replace('grep -q "versionName=\'1.1 (100000101)\'" "$OUT/APK-BADGING.txt"', 'grep -Fq "versionName=\'${HCF_VERSION_NAME}\'" "$OUT/APK-BADGING.txt"', 1)
          workflow = workflow.replace('name: HCF-Beta-v100000101-Unsigned', 'name: HCF-Beta-${{ env.HCF_VERSION_TAG }}-Unsigned', 1)
          workflow = workflow.replace('path: out-v100000101/', 'path: out-${{ env.HCF_VERSION_TAG }}/', 1)
          write(new_workflow, workflow)
          old_workflow.unlink()
          PY

          rm -f .github/workflows/one-time-dev-version-system.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Adopt compact dev hotfix versioning v1.1-hf1-a1'
          git push origin HEAD:dev
