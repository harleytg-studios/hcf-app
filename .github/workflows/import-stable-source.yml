name: Extract Stable Source ZIP

on:
  push:
    branches:
      - stable
    paths:
      - '.github/workflows/import-stable-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-stable-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP='HCF-Stable-v10000032-source(5).zip'
          test -f "$ZIP"
          ACTUAL_SHA="$(git hash-object "$ZIP")"
          EXPECTED_SHA='48a2e21f26dbb6f654470f582086b760d48a652f'
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Unexpected ZIP blob SHA: $ACTUAL_SHA" >&2
            exit 1
          fi

      - name: Extract ZIP into source code folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 'source code'
          mkdir -p 'source code'
          unzip -q 'HCF-Stable-v10000032-source(5).zip' -d 'source code'

          FILE_COUNT="$(find 'source code' -type f | wc -l | tr -d ' ')"
          if [ "$FILE_COUNT" -ne 165 ]; then
            echo "Expected 165 extracted files, found $FILE_COUNT" >&2
            exit 1
          fi

          test -f 'source code/AndroidManifest.xml'
          test -f 'source code/src/com/harleytg/forum/BuildInfo.java'
          echo "Extracted $FILE_COUNT files into source code/"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- 'source code'
          git rm -- '.github/workflows/import-stable-source.yml'

          git commit -m 'Extract Stable v10000032 source into source code'
          git push origin HEAD:stable
