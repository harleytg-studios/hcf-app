name: Prepare HCF Notifications v2 Source

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/prepare-hcf-notifications-v2-source.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Normalize patch target
        shell: bash
        run: |
          set -euo pipefail
          FILE='source code/src/com/harleytg/forum/HcfNotificationEngine.java'
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(encoding='utf-8'); old='            if (z) {\\n                builder.setGroup(FORUM_GROUP_KEY);\\n            }'; new='if (z) {\\n        builder.setGroup(FORUM_GROUP_KEY);\\n    }'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding='utf-8')"
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m 'ci: normalize Notifications v2 patch target'
          git push origin HEAD:dev
