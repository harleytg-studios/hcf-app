name: TEMP Build Exact Beta UI as Stable v10000076

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-full-dev-to-stable.yml'

permissions:
  contents: write

jobs:
  build-parity-test:
    runs-on: ubuntu-latest
    steps:
      - name: Record parity build run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/TEMP-UI-PARITY-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record Stable UI parity build run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout exact Beta Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-repo

      - name: Checkout Stable repair/branding source
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo

      - name: Checkout temporary output branch
        uses: actions/checkout@v4
        with:
          ref: stable-ui-parity-test
          path: output-repo
          token: ${{ github.token }}

      - name: Promote exact Beta UI source to Stable test identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/promoted" "$RUNNER_TEMP/stable-source-backup"
          cp -a 'stable-repo/source code' "$RUNNER_TEMP/stable-source-backup"

          # Keep the historical full-Dev promotion helper compatible with today's Stable tree.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('control/.github/scripts/temp-promote-full-dev-to-stable.py')
          s=p.read_text(encoding='utf-8')
          old="logs=extract(STROOT/'src/com/harleytg/forum/LogsActivity.java',r'^\\s*private void renderLogs\\(\\)').replace('private void renderLogs()','public void renderLogs()',1)"
          new="logs=extract(STROOT/'src/com/harleytg/forum/LogsActivity.java',r'^\\s*(?:private|public) void renderLogs\\(\\)')\nlogs=re.sub(r'^\\s*(?:private|public) void renderLogs\\(\\)', '    public void renderLogs()', logs, count=1, flags=re.M)"
          if old in s:
              s=s.replace(old,new)
          old_logo="stable_res=STROOT/'res'; logo=stable_res/'drawable-nodpi/htg_app_logo.png'"
          new_logo="stable_res=STROOT/'res'; logo=stable_res/'drawable-nodpi/htg_app_logo.png'\nif not logo.exists(): logo=stable_res/'drawable-nodpi-v4/htg_app_logo.png'"
          if old_logo not in s:
              raise SystemExit('Stable logo promotion line not found')
          s=s.replace(old_logo,new_logo)
          p.write_text(s,encoding='utf-8')
          PY

          python3 control/.github/scripts/temp-promote-full-dev-to-stable.py \
            'dev-repo/source code' \
            "$RUNNER_TEMP/promoted" \
            "$RUNNER_TEMP/stable-source-backup"

          rm -f "$RUNNER_TEMP/promoted/res/values/public.xml"

          # Stable identity/wording plus repairs for four JADX-damaged methods in the exact Beta source.
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          root = Path(os.environ['RUNNER_TEMP'])/'promoted'

          def method_span(text, pattern):
              m=re.search(pattern,text,re.M)
              if not m: raise RuntimeError('method not found: '+pattern)
              brace=text.find('{',m.end()-1)
              depth=0; i=brace; string=False; quote=''; esc=False; line=False; block=False
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif string:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: string=False
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c in ('\"', "'"): string=True; quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return m.start(),i+1
                  i+=1
              raise RuntimeError('unclosed method: '+pattern)

          def replace_method(path, pattern, replacement):
              s=path.read_text(encoding='utf-8')
              a,b=method_span(s,pattern)
              path.write_text(s[:a]+replacement+s[b:],encoding='utf-8')

          # General Stable branding while retaining the exact Beta UI/resource structure.
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.java','.xml','.txt','.md','.json','.sh'}:
                  continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              s=s.replace('10000072','10000076')
              s=s.replace('Required alerts, silent background alerts and Beta test alerts',
                          'Required alerts, silent background alerts and notification tools')
              s=s.replace('Beta test alerts','notification tools')
              s=s.replace('Beta Test Alerts','Notification Tools')
              s=s.replace('Preview Releases','Official Releases')
              s=s.replace('Preview releases','Official releases')
              s=s.replace('preview release','Stable release')
              s=s.replace('Preview release','Stable release')
              s=s.replace('development build is ready','Stable build is ready')
              s=s.replace('Development build is ready','Stable build is ready')
              s=s.replace("Harley's Clan Forum v1.0 [Stable]", "Harley's Clan Forum v1.0")
              s=s.replace('Harley&apos;s Clan Forum v1.0 [Stable]', 'Harley&apos;s Clan Forum v1.0')
              p.write_text(s,encoding='utf-8')

          # LogsActivity: restore safe document-provider export from maintained source behavior.
          replace_method(root/'src/com/harleytg/forum/LogsActivity.java',
              r'^\s*protected void onActivityResult\(', r'''    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode != EXPORT_TEXT || resultCode != RESULT_OK || data == null || data.getData() == null) return;
        pendingExportUri = data.getData();
        String text = visiblePlainText == null ? "" : visiblePlainText;
        try (OutputStream out = getContentResolver().openOutputStream(pendingExportUri, "w")) {
            if (out == null) throw new IllegalStateException("No output stream");
            out.write(text.getBytes(StandardCharsets.UTF_8));
            out.flush();
            AppLogger.info(this, MODE_DIAGNOSTICS.equals(currentMode) ? "diagnostics_exported" : "logs_exported", "document-provider");
            Toast.makeText(this, "Export complete.", Toast.LENGTH_SHORT).show();
        } catch (Throwable t) {
            AppLogger.error(this, "logs_export_failed", t.getClass().getSimpleName());
            Toast.makeText(this, "Could not export this content.", Toast.LENGTH_LONG).show();
        } finally {
            pendingExportUri = null;
        }
    }''')

          # TelemetryService: fix the recovered Preview listener reference.
          p=root/'src/com/harleytg/forum/TelemetryService.java'
          s=p.read_text(encoding='utf-8')
          s=s.replace('TelemetryService.showTextDialog(r0, "Crash report preview", TelemetryService.previewPendingReport(activity, editText.getText().toString(), r10.isChecked()));',
                      'TelemetryService.showTextDialog(activity, "Crash report preview", TelemetryService.previewPendingReport(activity, editText.getText().toString(), r10.isChecked()));')
          p.write_text(s,encoding='utf-8')

          # TelemetryService: replace the malformed network-send try/catch with the maintained logic.
          replace_method(p, r'^\s*private static boolean postReport\(Context context, JSONObject', r'''    private static boolean postReport(Context context, JSONObject report) {
        HttpsURLConnection connection = null;
        String reportId = report == null ? "HCF-REPORT" : report.optString("reportId", "HCF-REPORT");
        String type = report == null ? "event" : report.optString("type", "event");
        try {
            String endpoint = decryptWebhook(context);
            if (endpoint == null || !endpoint.startsWith("https://discord.com/api/webhooks/")) {
                saveResult(context, "Blocked: endpoint verification failed");
                addHistory(context, reportId, type, "blocked");
                return false;
            }
            JSONObject rootPayload = discordPayload(report);
            byte[] body = rootPayload.toString().getBytes(StandardCharsets.UTF_8);
            connection = (HttpsURLConnection) new URL(endpoint).openConnection();
            connection.setConnectTimeout(8000);
            connection.setReadTimeout(8000);
            connection.setRequestMethod("POST");
            connection.setDoOutput(true);
            connection.setInstanceFollowRedirects(false);
            connection.setRequestProperty("Content-Type", "application/json; charset=utf-8");
            connection.setRequestProperty("User-Agent", "HarleysClanForumTelemetry/" + BuildInfo.VERSION);
            connection.setFixedLengthStreamingMode(body.length);
            try (OutputStream output = connection.getOutputStream()) {
                output.write(body);
                output.flush();
            }
            int code = connection.getResponseCode();
            if (code >= 200 && code < 300) {
                saveResult(context, "Last send succeeded • " + reportId);
                addHistory(context, reportId, type, "sent");
                AppLogger.info(context, "telemetry_sent", reportId + " | " + type);
                return true;
            }
            saveResult(context, "Last send failed (HTTP " + code + ")");
            addHistory(context, reportId, type, "HTTP " + code);
            AppLogger.warn(context, "telemetry_http", reportId + " | " + code);
        } catch (Throwable t) {
            saveResult(context, "Last send failed");
            addHistory(context, reportId, type, "failed");
            AppLogger.warn(context, "telemetry_failed", reportId + " | " + t.getClass().getSimpleName());
        } finally {
            if (connection != null) connection.disconnect();
        }
        return false;
    }''')

          # FirebaseConfigLoader: reconstruct the remote refresh callback without decompiler artifacts.
          replace_method(root/'src/com/harleytg/forum/FirebaseConfigLoader.java',
              r'^\s*static /\* synthetic \*/ void lambda\$refresh\$1\(', r'''    static /* synthetic */ void lambda$refresh$1(String urlText, SharedPreferences sharedPreferences, Context context, final Callback callback) {
        Config result;
        String message;
        HttpURLConnection connection = null;
        try {
            connection = (HttpURLConnection) new URL(urlText).openConnection();
            connection.setConnectTimeout(8000);
            connection.setReadTimeout(8000);
            connection.setInstanceFollowRedirects(true);
            connection.setRequestProperty("User-Agent", "HarleysClanForumApp/1.0 FirebaseConfig");
            int code = connection.getResponseCode();
            if (code < 200 || code >= 300) throw new IllegalStateException("HTTP " + code);
            String raw = readAll(connection.getInputStream());
            Config parsed = parse(raw, "HTTPS config");
            if (parsed == null || !parsed.isValid()) throw new IllegalStateException("Invalid Firebase config");
            sharedPreferences.edit().putString("firebase_config_cache", raw).putString("firebase_config_source", "HTTPS config").apply();
            result = parsed;
            message = "Firebase config refreshed from HTTPS.";
        } catch (Throwable t) {
            result = load(context);
            message = "Remote refresh failed; kept " + (result == null ? "no config" : result.source) + ".";
            AppLogger.error(context, "firebase_config_refresh", t.getClass().getSimpleName() + ": " + String.valueOf(t.getMessage()));
        } finally {
            if (connection != null) connection.disconnect();
        }
        final Config callbackConfig = result;
        final String callbackMessage = message;
        new Handler(Looper.getMainLooper()).post(new Runnable() {
            @Override public void run() { callback.onResult(callbackConfig, callbackMessage); }
        });
    }''')

          # MainActivity: recovered r0 was the screen width used to detect a right-edge swipe.
          p=root/'src/com/harleytg/forum/MainActivity.java'
          s=p.read_text(encoding='utf-8')
          s=s.replace('this.drawerSwipeStartX < r0 - max',
                      'this.drawerSwipeStartX < getResources().getDisplayMetrics().widthPixels - max')
          p.write_text(s,encoding='utf-8')

          # Runtime channel must remain Stable throughout the promoted feature surface.
          for name in ['UpdateAutomation.java','MainActivity.java','SettingsActivity.java','HcfApplication.java','BootReceiver.java','UpdateDownloadReceiver.java','TelemetryService.java']:
              p=root/'src/com/harleytg/forum'/name
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('UpdateChecker.check(this, "dev"','UpdateChecker.check(this, "stable"')
              s=s.replace('UpdateChecker.check(applicationContext, "dev"','UpdateChecker.check(applicationContext, "stable"')
              s=s.replace('getString("update_channel", "dev")','getString("update_channel", "stable")')
              s=s.replace('putString("update_channel", "dev")','putString("update_channel", "stable")')
              s=s.replace('final String str = "dev";','final String str = "stable";')
              s=s.replace('jSONObject.put("channel", "Dev")','jSONObject.put("channel", "Stable")')
              s=s.replace('optString("channel", "Dev")','optString("channel", "Stable")')
              p.write_text(s,encoding='utf-8')

          p=root/'src/com/harleytg/forum/BuildInfo.java'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'static final String APK_FILE_NAME = ".*?";', 'static final String APK_FILE_NAME = "HCF-Stable-v10000076.apk";', s)
          s=re.sub(r'static final String DEVELOPMENT_BUILD_LABEL = ".*?";', 'static final String DEVELOPMENT_BUILD_LABEL = "Harley\'s Clan Forum v1.0";', s)
          s=re.sub(r'static final String VERSION_BUILD_LINE = ".*?";', 'static final String VERSION_BUILD_LINE = "1.0 • Stable • Build 10000076";', s)
          s=re.sub(r'static final int VERSION_CODE = [0-9]+;', 'static final int VERSION_CODE = 10000076;', s)
          s=s.replace('static final String CHANNEL = "Dev";', 'static final String CHANNEL = "Stable";')
          s=s.replace('static final String DEFAULT_UPDATE_CHANNEL = "dev";', 'static final String DEFAULT_UPDATE_CHANNEL = "stable";')
          s=s.replace('static final boolean ENABLE_DEV_TEST_MENU = true;', 'static final boolean ENABLE_DEV_TEST_MENU = false;')
          p.write_text(s,encoding='utf-8')

          p=root/'AndroidManifest.xml'; s=p.read_text(encoding='utf-8')
          s=re.sub(r'android:versionCode="[0-9]+"','android:versionCode="10000076"',s,count=1)
          s=re.sub(r'android:versionName="[^"]+"','android:versionName="1.0 (10000076)"',s,count=1)
          s=s.replace('android:value="dev"','android:value="stable"')
          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'package="com.harleytg.forum"' "$RUNNER_TEMP/promoted/AndroidManifest.xml"
          grep -q 'android:versionCode="10000076"' "$RUNNER_TEMP/promoted/AndroidManifest.xml"
          grep -q 'DEFAULT_UPDATE_CHANNEL = "stable"' "$RUNNER_TEMP/promoted/src/com/harleytg/forum/BuildInfo.java"
          grep -q 'ENABLE_DEV_TEST_MENU = false' "$RUNNER_TEMP/promoted/src/com/harleytg/forum/BuildInfo.java"
          ! grep -RInE 'Harley.s Clan Forum \[Beta\]|Development Build / Beta|Beta test alerts|Preview Releases|development build is ready' \
            "$RUNNER_TEMP/promoted/res" "$RUNNER_TEMP/promoted/src" || exit 31

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and align unsigned Stable parity APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/promoted"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/build"
          rm -rf "$WORK"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex"

          "$BT/aapt" package -f -m -J "$WORK/gen" -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" -A "$ROOT/assets" -I "$ANDROID_JAR" -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$WORK/aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$WORK/aligned-unsigned.apk"

          "$BT/aapt" dump badging "$WORK/aligned-unsigned.apk" | head -1 | tee "$WORK/badging.txt"
          grep -q "name='com.harleytg.forum'" "$WORK/badging.txt"
          grep -q "versionCode='10000076'" "$WORK/badging.txt"

          OUT='output-repo/build-output/ui-parity-v10000076'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$WORK/aligned-unsigned.apk" "$OUT/HCF-Stable-v10000076-UI-Parity-aligned-unsigned.apk"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp "$WORK/badging.txt" "$OUT/APK-BADGING.txt"
          printf 'run_id=%s\nsource=dev exact Beta UI generation\npackage=com.harleytg.forum\nversionCode=10000076\nchannel=stable\n' "$GITHUB_RUN_ID" > "$OUT/BUILD.txt"

      - name: Publish temporary unsigned build tools/output
        shell: bash
        run: |
          set -euo pipefail
          cd output-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/ui-parity-v10000076/
          git commit -m '[skip ci] Add Stable v10000076 UI parity unsigned build'
          git push origin HEAD:stable-ui-parity-test
