name: TEMP Full Dev v10000072 to Stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-full-dev-to-stable.yml'

permissions:
  contents: write

jobs:
  promote-build:
    runs-on: ubuntu-latest
    steps:
      - name: Record promotion run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/TEMP-FULL-PROMOTION-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record full Dev-to-Stable promotion run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout promotion controls
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout exact Dev v10000072
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-repo

      - name: Checkout Stable target
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo
          fetch-depth: 1

      - name: Set up Android tools
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare full Dev-to-Stable source
        shell: bash
        run: |
          set -euo pipefail
          cp -a 'stable-repo/source code' "$RUNNER_TEMP/stable-source-backup"
          python3 control/.github/scripts/temp-promote-full-dev-to-stable.py \
            'dev-repo/source code' \
            'stable-repo/source code' \
            "$RUNNER_TEMP/stable-source-backup"
          rm -f 'stable-repo/source code/res/values/public.xml'
          python3 control/.github/scripts/temp-repair-dev-decompile-artifacts.py \
            'stable-repo/source code' \
            "$RUNNER_TEMP/stable-source-backup"
          test "$(find 'stable-repo/source code/src/com/harleytg/forum' -maxdepth 1 -name '*.java' | wc -l)" -eq 46
          ! grep -R -q 'Method not decompiled' 'stable-repo/source code/src'
          ! grep -R -q 'com.harleytg.forum.dev' 'stable-repo/source code/src'
          grep -q 'DEFAULT_UPDATE_CHANNEL = "stable"' 'stable-repo/source code/src/com/harleytg/forum/BuildInfo.java'
          grep -q 'ENABLE_DEV_TEST_MENU = false' 'stable-repo/source code/src/com/harleytg/forum/BuildInfo.java'
          grep -q 'return "stable";' 'stable-repo/source code/src/com/harleytg/forum/SettingsActivity.java'

      - name: Compile full promoted Stable source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/stable-repo/source code"
          WORK="$RUNNER_TEMP/hcf-full-stable"
          OUT="$GITHUB_WORKSPACE/out"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"
          "$BT/aapt" package -f -m \
            -J "$WORK/gen" -M "$SRC/AndroidManifest.xml" -S "$SRC/res" -A "$SRC/assets" \
            -I "$ANDROID_JAR" -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$SRC/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Stable-v10000072-full-dev-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/HCF-Stable-v10000072-full-dev-aligned-unsigned.apk"
          "$BT/aapt" dump badging "$OUT/HCF-Stable-v10000072-full-dev-aligned-unsigned.apk" | head -n 1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000072'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000072)'" "$OUT/APK-BADGING.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$OUT/HCF-Stable-v10000072-full-dev-aligned-unsigned.apk" > "$OUT/UNSIGNED-SHA256.txt"

      - name: Commit full Dev promotion to Stable
        shell: bash
        run: |
          set -euo pipefail
          cd stable-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'source code'
          if git diff --cached --quiet; then
            echo 'No Stable source changes to commit.'
          else
            git commit -m 'Promote full Dev v10000072 to Stable'
            git push origin HEAD:stable
          fi
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/out/STABLE-COMMIT.txt"

      - name: Upload unsigned full Stable build
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Stable-v10000072-full-dev-unsigned
          path: |
            out/HCF-Stable-v10000072-full-dev-aligned-unsigned.apk
            out/apksigner.jar
            out/APK-BADGING.txt
            out/UNSIGNED-SHA256.txt
            out/STABLE-COMMIT.txt
          if-no-files-found: error
          retention-days: 1

# fresh-run: targeted Java decompile repair pass
