name: TEMP Full Dev v10000072 to Stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-full-dev-to-stable.yml'

permissions:
  contents: write

jobs:
  overwrite-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Record promotion run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/TEMP-FULL-PROMOTION-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record direct Dev-to-Stable overwrite run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout promotion controls
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout exact Dev v10000072
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-repo

      - name: Checkout Stable target
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo
          fetch-depth: 1

      - name: Overwrite Stable from full Dev and restore Stable items
        shell: bash
        run: |
          set -euo pipefail
          cp -a 'stable-repo/source code' "$RUNNER_TEMP/stable-source-backup"
          python3 control/.github/scripts/temp-promote-full-dev-to-stable.py \
            'dev-repo/source code' \
            'stable-repo/source code' \
            "$RUNNER_TEMP/stable-source-backup"

          # Decoded APK resource-table metadata is not authored source.
          rm -f 'stable-repo/source code/res/values/public.xml'

          # Promotion guards: full Dev surface, Stable identity.
          test "$(find 'stable-repo/source code/src/com/harleytg/forum' -maxdepth 1 -name '*.java' | wc -l)" -eq 46
          ! grep -R -q 'com.harleytg.forum.dev' 'stable-repo/source code/src'
          grep -q 'package="com.harleytg.forum"' 'stable-repo/source code/AndroidManifest.xml'
          grep -q 'android:versionCode="10000072"' 'stable-repo/source code/AndroidManifest.xml'
          grep -q 'android:value="stable"' 'stable-repo/source code/AndroidManifest.xml'
          grep -q 'DEFAULT_UPDATE_CHANNEL = "stable"' 'stable-repo/source code/src/com/harleytg/forum/BuildInfo.java'
          grep -q 'ENABLE_DEV_TEST_MENU = false' 'stable-repo/source code/src/com/harleytg/forum/BuildInfo.java'
          test -d 'stable-repo/source code/branding'
          test -d 'stable-repo/source code/signing'
          test -f 'stable-repo/source code/build-release.sh'

      - name: Commit overwrite to Stable
        shell: bash
        run: |
          set -euo pipefail
          cd stable-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'source code'
          if git diff --cached --quiet; then
            echo 'No Stable source changes to commit.'
          else
            git commit -m 'Overwrite Stable with full Dev v10000072 and restore Stable items'
            git push origin HEAD:stable
          fi
          git rev-parse HEAD
