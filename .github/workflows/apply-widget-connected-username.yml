name: Apply Widget Connected Username

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-widget-connected-username.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply connected username patch
        run: python3 .github/scripts/apply-widget-connected-username.py

      - name: Run release source gates
        run: python3 .github/scripts/verify-release-readiness.py .

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "source code/src/com/harleytg/forum/HcfUI.java" "source code/src/com/harleytg/forum/HcfWidget.java" README.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Show connected @username in HCF widget"
          git push origin dev
