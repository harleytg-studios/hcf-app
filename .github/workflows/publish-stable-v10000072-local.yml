name: Publish pre-signed Stable v10000072

on:
  push:
    branches:
      - stable
    paths:
      - 'build-output/.v10000072-parts/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable branch
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Wait for complete local APK payload
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          dir='build-output/.v10000072-parts'
          complete=true
          for n in 00 01 02 03 04 05 06 07 08; do
            test -f "$dir/part-$n" || complete=false
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Reassemble and verify exact locally signed APK
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir='build-output/.v10000072-parts'
          mkdir -p build-output
          cat "$dir"/part-* | base64 -d > build-output/HCF-Stable-v10000072.apk
          echo 'f6c2f0022c891676c025fc833b2cbeb05ed8e854b74cbab9ec0f8d08b8ec507d  build-output/HCF-Stable-v10000072.apk' | sha256sum -c -
          file build-output/HCF-Stable-v10000072.apk

      - name: Publish APK and clean temporary payload
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-output/.v10000072-parts
          rm -f .github/workflows/publish-stable-v10000072-local.yml
          cat > build-output/BUILD.txt <<'EOF'
          artifact=HCF-Stable-v10000072.apk
          package=com.harleytg.forum
          versionName=1.0 (10000072)
          versionCode=10000072
          channel=stable
          signerSha256=9D:46:75:EC:2A:CB:83:22:AB:14:FD:97:0D:A5:B0:61:F5:9E:42:FA:5E:8E:45:3B:67:15:57:B2:13:13:78:05
          apkSha256=f6c2f0022c891676c025fc833b2cbeb05ed8e854b74cbab9ec0f8d08b8ec507d
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- build-output/HCF-Stable-v10000072.apk build-output/BUILD.txt
          git add -u -- build-output/.v10000072-parts .github/workflows/publish-stable-v10000072-local.yml
          git commit -m '[skip ci] publish pre-signed Stable v10000072 APK'
          git push origin HEAD:stable
