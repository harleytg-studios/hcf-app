name: One-time v1.1-hf1-a3 About label patch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-a3-about-label.yml'

permissions:
  contents: write

jobs:
  patch-a3-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply a3 version and About/build labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '1.1-hf1-a3'
          VERSION_TAG = 'v' + VERSION
          BASE_VERSION = '1.1'
          VERSION_CODE = 100000104
          INTERNAL_BUILD = 122
          PATCH_NAME = 'Build-Label-About'
          CHANNEL_LABEL = 'Beta / Development Build'

          def sub_once(text, pattern, repl, label, flags=re.M):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return out

          # Android manifest identity.
          manifest_path = Path('source code/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = sub_once(manifest, r'android:versionCode="\d+"', f'android:versionCode="{VERSION_CODE}"', 'manifest versionCode')
          manifest = sub_once(manifest, r'android:versionName="[^"]+"', f'android:versionName="{VERSION} ({VERSION_CODE})"', 'manifest versionName')
          manifest = sub_once(manifest, r'(<meta-data android:name="com\.harleytg\.APP_VERSION" android:value=")[^"]+("/>)', rf'\g<1>{VERSION} ({VERSION_CODE})\g<2>', 'manifest APP_VERSION')
          manifest = sub_once(manifest, r'(<meta-data android:name="com\.harleytg\.APP_VERSION_CODE" android:value=")\d+("/>)', rf'\g<1>{VERSION_CODE}\g<2>', 'manifest APP_VERSION_CODE')
          manifest_path.write_text(manifest, encoding='utf-8')

          # BuildInfo identity and public-facing build label.
          core_path = Path('source code/src/com/harleytg/forum/HcfCore.java')
          core = core_path.read_text(encoding='utf-8')
          values = {
              'APK_FILE_NAME': f'HCF-Beta-{VERSION_TAG}.apk',
              'DEVELOPMENT_BUILD_LABEL': CHANNEL_LABEL,
              'META_LINE': f'{VERSION_TAG} • Hotfix 1 • Alpha 3',
              'PATCH_NAME': PATCH_NAME,
              'USER_AGENT_MARKER': f'HarleysClanForumApp/{VERSION} Build/{VERSION_CODE}',
              'VERSION': VERSION,
              'VERSION_TAG': VERSION_TAG,
          }
          for key, value in values.items():
              core = sub_once(core, rf'^    static final String {key} = ".*";$', f'    static final String {key} = "{value}";', f'BuildInfo {key}')
          core = sub_once(core, r'^    static final int INTERNAL_BUILD = \d+;$', f'    static final int INTERNAL_BUILD = {INTERNAL_BUILD};', 'BuildInfo INTERNAL_BUILD')
          core = sub_once(core, r'^    static final int VERSION_CODE = \d+;$', f'    static final int VERSION_CODE = {VERSION_CODE};', 'BuildInfo VERSION_CODE')
          core = sub_once(
              core,
              r'^    static final String VERSION_BUILD_LINE = .*;$',
              '    static final String VERSION_BUILD_LINE = "v" + VERSION + " • Beta / Development Build • Build " + VERSION_CODE;',
              'BuildInfo VERSION_BUILD_LINE',
          )
          # Add a stable product-version constant once, used by About.
          if 'static final String BASE_VERSION = "1.1";' not in core:
              anchor = '    static final String BRAND = "Harley\'s Studios";\n'
              if anchor not in core:
                  raise SystemExit('BuildInfo BRAND anchor missing')
              core = core.replace(anchor, anchor + f'    static final String BASE_VERSION = "{BASE_VERSION}";\n', 1)
          core_path.write_text(core, encoding='utf-8')

          # About card: product version + dev build + Android code + simple channel label.
          ui_path = Path('source code/src/com/harleytg/forum/HcfUI.java')
          ui = ui_path.read_text(encoding='utf-8')
          about_patterns = [
              r'getString\(R\.string\.app_name\) \+ "\\nVersion " \+ BuildInfo\.VERSION \+ " • Build " \+ installedVersionCode\(\) \+ "\\n" \+ BuildInfo\.DEVELOPMENT_BUILD_LABEL',
              r'getString\(R\.string\.app_name\) \+ "\nVersion " \+ BuildInfo\.VERSION \+ " • Build " \+ installedVersionCode\(\) \+ "\n" \+ BuildInfo\.DEVELOPMENT_BUILD_LABEL',
          ]
          about_replacement = (
              'getString(R.string.app_name) + "\\nVersion " + BuildInfo.BASE_VERSION'
              ' + "\\nDev build " + BuildInfo.VERSION_TAG + " • Android build " + installedVersionCode()'
              ' + "\\n" + BuildInfo.DEVELOPMENT_BUILD_LABEL'
          )
          replaced = False
          for pattern in about_patterns:
              new_ui, count = re.subn(pattern, lambda m: about_replacement, ui, count=1, flags=re.M)
              if count == 1:
                  ui = new_ui
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('About App identity version block not found')
          ui_path.write_text(ui, encoding='utf-8')

          # Release verifier identity and regression guards.
          verifier_path = Path('.github/scripts/verify-release-readiness.py')
          verifier = verifier_path.read_text(encoding='utf-8')
          verifier = sub_once(verifier, r'^EXPECTED_VERSION_CODE = \d+$', f'EXPECTED_VERSION_CODE = {VERSION_CODE}', 'verifier versionCode')
          verifier = sub_once(verifier, r'^EXPECTED_VERSION = ".*"$', f'EXPECTED_VERSION = "{VERSION}"', 'verifier version')
          verifier = sub_once(verifier, r'^EXPECTED_INTERNAL_BUILD = \d+$', f'EXPECTED_INTERNAL_BUILD = {INTERNAL_BUILD}', 'verifier internalBuild')
          if 'About base version missing' not in verifier:
              marker = 'require("BuildInfo version scheme mismatch", \'VERSION_CODE_SCHEME = "dev-hotfix-alpha-v1"\' in build_info)\n'
              if marker not in verifier:
                  raise SystemExit('verifier version scheme insertion point missing')
              verifier = verifier.replace(
                  marker,
                  marker
                  + 'require("About base version missing", \'BASE_VERSION = "1.1"\' in build_info)\n'
                  + 'require("RC remains in public Dev build label", \'DEVELOPMENT_BUILD_LABEL = "Beta / Development Build"\' in build_info and \'Beta / Development Build • Build \' in build_info)\n'
                  + 'require("About does not show product/dev versions", \'Version " + BuildInfo.BASE_VERSION\' in ui_source and \'Dev build " + BuildInfo.VERSION_TAG\' in ui_source)\n',
                  1,
              )
          verifier_path.write_text(verifier, encoding='utf-8')

          # README current-build metadata and wording.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = sub_once(readme, r'^- Version name: `[^`]+`$', f'- Version name: `{VERSION} ({VERSION_CODE})`', 'README version name')
          readme = sub_once(readme, r'^- Version tag: `[^`]+`$', f'- Version tag: `{VERSION_TAG}`', 'README version tag')
          readme = sub_once(readme, r'^- Patch: `[^`]+`$', f'- Patch: `{PATCH_NAME}`', 'README patch')
          readme = sub_once(readme, r'^- Version code: `\d+`$', f'- Version code: `{VERSION_CODE}`', 'README version code')
          readme = sub_once(readme, r'^- Internal build: `\d+`$', f'- Internal build: `{INTERNAL_BUILD}`', 'README internal build')
          readme = re.sub(r'- Current dev build: `v[^`]+` / Android versionCode `\d+`\.', f'- Current dev build: `{VERSION_TAG}` / Android versionCode `{VERSION_CODE}`.', readme, count=1)
          if '- Product version: `1.1`' not in readme:
              anchor = '- Version name: `' + VERSION + ' (' + str(VERSION_CODE) + ')`\n'
              if anchor in readme:
                  readme = readme.replace(anchor, anchor + '- Product version: `1.1`\n- Channel label: `Beta / Development Build`\n', 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/AndroidManifest.xml' 'source code/src/com/harleytg/forum/HcfCore.java' 'source code/src/com/harleytg/forum/HcfUI.java' '.github/scripts/verify-release-readiness.py' README.md
          git commit -m 'Update Dev build label and About for v1.1-hf1-a3'
          git push origin HEAD:dev
