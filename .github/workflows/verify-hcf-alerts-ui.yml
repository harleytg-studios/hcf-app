name: Verify Approved HCF Alerts UI

on:
  push:
    branches: [stable]
    paths:
      - 'source code/src/com/harleytg/forum/HcfSubActivities.java'
      - 'source code/stable-build-overlay.py'
      - '.github/scripts/verify-hcf-alerts-ui.py'
      - '.github/workflows/verify-hcf-alerts-ui.yml'
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stable-alerts-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable
        uses: actions/checkout@v4

      - name: Reject obsolete HCF Alerts layouts
        shell: bash
        run: python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'

      - name: Verify Stable identity overlay still preserves alerts source
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/hcf-stable-alerts"
          python3 'source code/stable-build-overlay.py' 'source code' "$TMP/src" "$TMP/res"
          python3 - <<'PY' "$TMP/src/com/harleytg/forum/HcfSubActivities.java"
          import pathlib
          import sys
          body = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          required = (
              'HCF_ALERTS_RENDER_FINAL_V10000090',
              'Background notification sync',
              'HCF Alerts are the real forum alerts.',
              'HCF Silent Alerts is only the silent service-status channel.',
              'Open Android settings',
          )
          for item in required:
              assert item in body, item
          assert 'HCF Beta > Battery' not in body
          print('Stable HCF Alerts overlay verification: PASS')
          PY
