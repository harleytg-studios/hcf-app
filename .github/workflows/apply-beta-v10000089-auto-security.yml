name: Apply Beta v10000089 Automatic Security Sync

on:
  push:
    branches:
      - dev
    paths:
      - build-output/V10000089-AUTOSECURITY-SOURCE-TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply automatic security and Notifications UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-v10000089-auto-security.py 'source code'
          grep -q 'VERSION_CODE = 10000089' 'source code/src/com/harleytg/forum/BuildInfo.java'
          grep -q 'android:versionCode="10000089"' 'source code/AndroidManifest.xml'
          grep -q 'var autoSecurity=function()' 'source code/src/com/harleytg/forum/MainActivity.java'
          grep -q 'hcf_native_sync=1' 'source code/src/com/harleytg/forum/MainActivity.java'
          grep -Fq "Harley's Clan Forum v1.0 [Development Build / Beta]" 'source code/src/com/harleytg/forum/BuildInfo.java'
          ! grep -Fq 'Open Account Security once to sync linked sign-in providers.' 'source code/src/com/harleytg/forum/IdentityActivity.java'
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          grep -Fq 'Background notification sync' 'source code/src/com/harleytg/forum/SettingsActivity.java'
          grep -Fq 'Service-status channel' 'source code/src/com/harleytg/forum/SettingsActivity.java'
          grep -Fq 'Developer test channel' 'source code/src/com/harleytg/forum/SettingsActivity.java'

      - name: Commit Dev source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'source code/src/com/harleytg/forum/MainActivity.java' \
                     'source code/src/com/harleytg/forum/IdentityActivity.java' \
                     'source code/src/com/harleytg/forum/ForumSecurity.java' \
                     'source code/src/com/harleytg/forum/SettingsActivity.java'
          if git diff --cached --quiet; then
            echo 'Source already patched.'
          else
            git commit -m 'Redesign Notifications UI and preserve automatic security sync'
            git push origin HEAD:dev
          fi
