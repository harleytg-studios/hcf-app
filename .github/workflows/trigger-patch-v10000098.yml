name: Trigger HCF Beta v10000098 Patch Build
# run patch build now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-patch-v10000098.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patched APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/patch-build-dev-v10000098.yml/dispatches \
            -d '{"ref":"main"}'
