name: One-time finalize v10000095

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10000095-home-button-style-once.yml'

permissions:
  contents: write

jobs:
  finalize-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Finalize v10000095 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/verify-release-readiness.py')
          text = p.read_text(encoding='utf-8')
          for old, new in [
              ('EXPECTED_VERSION_CODE = 10000094', 'EXPECTED_VERSION_CODE = 10000095'),
              ('EXPECTED_INTERNAL_BUILD = 114', 'EXPECTED_INTERNAL_BUILD = 115'),
              ('canonical v10000094 workflow missing', 'canonical v10000095 workflow missing'),
              ('build-dev-v10000094.yml', 'build-dev-v10000095.yml'),
          ]:
              if old not in text:
                  raise SystemExit(f'missing expected verifier text: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          rm -f 'source code/res/drawable/url_control_button_background.xml'
          grep -Fq 'EXPECTED_VERSION_CODE = 10000095' .github/scripts/verify-release-readiness.py
          grep -Fq 'EXPECTED_INTERNAL_BUILD = 115' .github/scripts/verify-release-readiness.py
          ! grep -Rq '@drawable/url_control_button_background' 'source code/res'

      - name: Commit final metadata to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v10000095 Home-style URL controls'
          git push origin HEAD:dev
