name: Build Hardware Guard APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'hardware-guard/**'
      - '.github/workflows/build-hardware-guard.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable debug APK
        working-directory: hardware-guard
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp hardware-guard/app/build/outputs/apk/debug/app-debug.apk HardwareGuard-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HardwareGuard-v0.1.0
          path: HardwareGuard-v0.1.0.apk
          if-no-files-found: error
