name: Fix What's New Java Source

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-whats-new-java-escapes.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary What''s New source fix workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Normalize source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-whats-new-java-escapes.py
          python3 -m py_compile .github/scripts/verify-release-readiness.py

      - name: Commit source fix and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'source code/src/com/harleytg/forum/HcfForum.java' \
            'source code/src/com/harleytg/forum/HcfUpdates.java' \
            '.github/scripts/verify-release-readiness.py'
          git rm '.github/scripts/fix-whats-new-java-escapes.py' '.github/workflows/fix-whats-new-java-escapes.yml'
          git diff --cached --check
          git commit -m "Normalize What's New build metadata and release notes"
          git push origin HEAD:dev
