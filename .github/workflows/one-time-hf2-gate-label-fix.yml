name: One-time hf2 release gate label fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-hf2-gate-label-fix.yml'

permissions:
  contents: write

jobs:
  fix-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Update public Dev build tag guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/verify-release-readiness.py')
          s = p.read_text(encoding='utf-8')
          old = 'require("public Dev build tag mismatch", \'BUILD_TAG = "Development Build / Beta"\' in build_info)'
          new = 'require("public Dev build tag mismatch", \'BUILD_TAG = "Beta / Development Build"\' in build_info)'
          if old not in s:
              raise SystemExit('old public Dev build tag guard not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/verify-release-readiness.py
          git commit -m 'Update release gate for Beta Development label'
          git push origin HEAD:dev
