name: One-time UI Playground patch

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/one-time-ui-playground-patch.yml'

permissions:
  contents: write

jobs:
  patch-ui-playground:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Add UI Playground to Developer Tools
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source code/src/com/harleytg/forum/SettingsActivity.java')
          source = path.read_text(encoding='utf-8')

          search_anchor = '''            new SettingTarget("force_notification_sync", "Force Notification Sync", "notification force sync test developer", "advanced", "developer_tools"),\n'''
          search_insert = search_anchor + '''            new SettingTarget("ui_playground", "UI Playground", "ui user interface screen preview testing components cards buttons dialogs toast developer playground", "advanced", "developer_tools"),\n'''
          if 'new SettingTarget("ui_playground"' not in source:
              if search_anchor not in source:
                  raise SystemExit('Could not find Developer Tools search-index anchor')
              source = source.replace(search_anchor, search_insert, 1)

          tools_anchor = '''        card.addView(target(actionButton("Force Notification Sync", v -> {\n            InstantNotificationService.requestImmediateSync(this);\n            Toast.makeText(this, "Immediate notification sync requested.", Toast.LENGTH_SHORT).show();\n        }), "force_notification_sync"));\n        return card;\n'''
          tools_insert = '''        card.addView(target(actionButton("Force Notification Sync", v -> {\n            InstantNotificationService.requestImmediateSync(this);\n            Toast.makeText(this, "Immediate notification sync requested.", Toast.LENGTH_SHORT).show();\n        }), "force_notification_sync"));\n\n        card.addView(settingsSubsectionHeader(\n                "UI Playground",\n                "Preview and test HCF screens, components, dialogs and visual states",\n                R.drawable.fa_gear\n        ));\n        card.addView(target(actionButton("Open UI Playground", v -> showUiPlayground()), "ui_playground"));\n        return card;\n'''
          if 'actionButton("Open UI Playground"' not in source:
              if tools_anchor not in source:
                  raise SystemExit('Could not find Developer Tools card anchor')
              source = source.replace(tools_anchor, tools_insert, 1)

          method_anchor = '''    private String developerToolsSubtitle() {\n        return "stable".equals(effectiveUpdateChannel()) ? "Stable test tools" : "Dev/Beta test controls";\n    }\n\n'''
          method_insert = method_anchor + '''    private void showUiPlayground() {\n        AppLogger.info(this, "ui_playground_open", BuildInfo.VERSION);\n\n        ScrollView scroll = new ScrollView(this);\n        LinearLayout content = new LinearLayout(this);\n        content.setOrientation(LinearLayout.VERTICAL);\n        content.setPadding(dp(14), dp(8), dp(14), dp(12));\n        scroll.addView(content, new ScrollView.LayoutParams(-1, -2));\n\n        content.addView(settingsInfoCard(\n                "Developer visual test area",\n                "Use UI Playground to preview HCF screens and reusable UI components without changing normal app settings.",\n                R.drawable.fa_bug\n        ));\n\n        content.addView(settingsSubsectionHeader(\n                "Screen previews",\n                "Open real app screens to check theme, spacing and responsive layout",\n                R.drawable.fa_circle_info\n        ));\n        content.addView(actionButton("Preview App Setup Center", v ->\n                startActivity(new Intent(this, SetupActivity.class))));\n\n        content.addView(settingsSubsectionHeader(\n                "Component tests",\n                "Preview common HCF feedback and component states",\n                R.drawable.fa_gear\n        ));\n        content.addView(settingsInfoCard(\n                "Sample information card",\n                "This card uses the same HCF surface, border, typography and spacing system as App Settings.",\n                R.drawable.fa_circle_info\n        ));\n        content.addView(actionButton("Test HCF Dialog", v -> showUiPlaygroundDialogPreview()));\n        content.addView(actionButton("Test Toast", v ->\n                Toast.makeText(this, "UI Playground test toast", Toast.LENGTH_SHORT).show()));\n\n        new AlertDialog.Builder(this)\n                .setTitle("UI Playground")\n                .setView(scroll)\n                .setNegativeButton("Close", null)\n                .show();\n    }\n\n    private void showUiPlaygroundDialogPreview() {\n        new AlertDialog.Builder(this)\n                .setTitle("HCF Dialog Preview")\n                .setMessage("Sample developer-only dialog for checking text, spacing, theme and button rendering.")\n                .setPositiveButton("Primary", null)\n                .setNegativeButton("Secondary", null)\n                .show();\n    }\n\n'''
          if 'private void showUiPlayground()' not in source:
              if method_anchor not in source:
                  raise SystemExit('Could not find Developer Tools method anchor')
              source = source.replace(method_anchor, method_insert, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit UI Playground
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'source code/src/com/harleytg/forum/SettingsActivity.java'
          if git diff --cached --quiet; then
            echo 'UI Playground already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'Add UI Playground developer tool'
          git push origin HEAD:dev
