name: Apply Startup Loader Default Off

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-startup-loader-default-off.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Make verbose loader default off
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          sub = Path('source code/src/com/harleytg/forum/HcfSubActivities.java')

          u = ui.read_text(encoding='utf-8')
          s = sub.read_text(encoding='utf-8')

          u = u.replace('private boolean verboseLoader = true;', 'private boolean verboseLoader = false;')
          u = u.replace('boolean verbose = prefs == null || prefs.getBoolean(PREF_STARTUP_LOADER_VERBOSE, true);',
                        'boolean verbose = prefs != null && prefs.getBoolean(PREF_STARTUP_LOADER_VERBOSE, false);')
          s = s.replace('prefs.getBoolean("startup_loader_verbose", true)',
                        'prefs.getBoolean("startup_loader_verbose", false)')

          ui.write_text(u, encoding='utf-8')
          sub.write_text(s, encoding='utf-8')
          PY

      - name: Verify default is off
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'private boolean verboseLoader = false;' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'prefs != null && prefs.getBoolean(PREF_STARTUP_LOADER_VERBOSE, false)' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -Fq 'prefs.getBoolean("startup_loader_verbose", false)' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          ! grep -Fq 'prefs.getBoolean("startup_loader_verbose", true)' 'source code/src/com/harleytg/forum/HcfSubActivities.java'

      - name: Commit source change and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-startup-loader-default-off.yml'
          git add 'source code/src/com/harleytg/forum/HcfUITheme.java' 'source code/src/com/harleytg/forum/HcfSubActivities.java'
          git commit -m 'Default startup loader verbosity to off'
          git push origin HEAD:dev

      - name: Run Beta v10000098 release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-dev-v10000098.yml --ref dev
