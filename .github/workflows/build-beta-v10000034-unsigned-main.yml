name: Build Beta v10000034 Unsigned From Dev

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-beta-v10000034-unsigned-main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-repo

      - name: Checkout main metadata branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          token: ${{ github.token }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile unsigned Beta APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/dev-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-v10000034"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$SRC/AndroidManifest.xml" \
            -S "$SRC/res" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          java -m jdk.compiler/com.sun.tools.javac.Main \
            --release 8 \
            -classpath "$ANDROID_JAR" \
            -d "$WORK/classes" \
            $(find "$WORK/gen" "$SRC/src" -name '*.java' -print)

          "$BT/d8" \
            --lib "$ANDROID_JAR" \
            --min-api 26 \
            --release \
            --output "$WORK/dex" \
            $(find "$WORK/classes" -name '*.class' -print)

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (
            cd "$WORK/dex"
            "$BT/aapt" add "$WORK/unsigned.apk" classes.dex
          )
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Beta-v10000034-unsigned.apk"

      - name: Verify unsigned package
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/out/HCF-Beta-v10000034-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "package: name='com.harleytg.forum.dev' versionCode='10000034' versionName='1.0 (10000034)'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          unzip -t "$APK" | tee "$GITHUB_WORKSPACE/out/ZIP-VERIFY.txt"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000034-unsigned
          path: |
            out/HCF-Beta-v10000034-unsigned.apk
            out/APK-BADGING.txt
            out/ZIP-VERIFY.txt
          if-no-files-found: error

      - name: Record artifact run ID
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE/main-repo"
          mkdir -p "$REPO/build-output"
          printf 'run_id=%s\nartifact=HCF-Beta-v10000034-unsigned\ndev_commit=%s\nversionCode=10000034\nversionName=1.0 (10000034)\n' \
            "$GITHUB_RUN_ID" "$(git -C "$GITHUB_WORKSPACE/dev-repo" rev-parse HEAD)" \
            > "$REPO/build-output/BETA-V10000034-UNSIGNED.txt"
          cd "$REPO"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/BETA-V10000034-UNSIGNED.txt
          git commit -m '[skip ci] Record Beta v10000034 unsigned build run'
          git push origin HEAD:main
