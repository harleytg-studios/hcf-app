name: Diagnose Remaining Grok Stubs

on:
  push:
    branches: [dev]
    paths:
      - build-output/V10000090-GROK-STUB-DIAG.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Record diagnostic run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/HCF-Beta-v10000090-STUB-DIAG-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'dev'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'dev', sha,
              message: '[skip ci] Record Grok diagnostic run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo
      - name: Apply repair and print remaining blockers
        shell: bash
        run: |
          set +e
          python3 .github/scripts/fix-grok-guide-v10000090.py "$GITHUB_WORKSPACE/source code" "$GITHUB_WORKSPACE/stable-repo/source code"
          rc=$?
          set -e
          echo "repair script exit=$rc"
          echo '=== REMAINING METHOD NOT DECOMPILED ==='
          grep -R -n 'Method not decompiled:' 'source code/src' || true
          echo '=== REMAINING UNSUPPORTED OPERATION ==='
          grep -R -n 'throw new UnsupportedOperationException' 'source code/src' || true
          echo '=== OLD MAINACTIVITY BUILD 10000072 ==='
          grep -n -C 2 '10000072' 'source code/src/com/harleytg/forum/MainActivity.java' || true
          echo '=== OLD UPDATER BUILD 10000071 ==='
          grep -n -C 2 '10000071' 'source code/src/com/harleytg/forum/AppUpdateDownloader.java' || true
          echo '=== OLD SERVICE BUILD v10000047 ==='
          grep -n -C 2 '10000047' 'source code/src/com/harleytg/forum/InstantNotificationService.java' || true
          exit 0
