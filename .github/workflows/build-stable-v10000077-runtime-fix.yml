name: Build Stable v10000079 VersionCode UI Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-stable-v10000077-runtime-fix.yml'

permissions:
  contents: write

jobs:
  build-stable-v10000079:
    runs-on: ubuntu-latest
    steps:
      - name: Record build run ID
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'build-output/STABLE-v10000079-RUN.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: '[skip ci] Record Stable v10000079 build run',
              content: Buffer.from(String(context.runId) + '\n').toString('base64')
            });

      - name: Checkout Stable source
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-repo
          token: ${{ github.token }}

      - name: Apply v10000079 source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('stable-repo')
          src = repo / 'source code'
          code = '10000079'

          # BuildInfo is the canonical versionCode source used by UI.
          p = src / 'src/com/harleytg/forum/BuildInfo.java'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'static final String APK_FILE_NAME = "[^"]+";', f'static final String APK_FILE_NAME = "HCF-Stable-v{code}.apk";', s)
          s = re.sub(r'static final String VERSION_BUILD_LINE = "[^"]+";', f'static final String VERSION_BUILD_LINE = "1.0 • Stable • Build {code}";', s)
          s = re.sub(r'static final int VERSION_CODE = [0-9]+;', f'static final int VERSION_CODE = {code};', s)
          p.write_text(s, encoding='utf-8')

          # Android package versionCode/versionName and metadata.
          p = src / 'AndroidManifest.xml'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'android:versionCode="[0-9]+"', f'android:versionCode="{code}"', s, count=1)
          s = re.sub(r'android:versionName="[^"]+"', f'android:versionName="1.0 ({code})"', s, count=1)
          s = re.sub(r'(android:name="com\.harleytg\.APP_VERSION"\s*\n\s*android:value=")[^"]+("/>)', rf'\g<1>1.0 ({code})\g<2>', s, count=1)
          s = re.sub(r'(android:name="com\.harleytg\.APP_VERSION_CODE"\s*\n\s*android:value=")[^"]+("/>)', rf'\g<1>{code}\g<2>', s, count=1)
          p.write_text(s, encoding='utf-8')

          # Keep the build/versionCode visible, but derive it from BuildInfo.VERSION_CODE.
          p = src / 'src/com/harleytg/forum/SettingsActivity.java'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'text\("1\.0 • Build [0-9]+\\n\\nSettings UI recovered from: " \+ th\.getClass\(\)\.getSimpleName\(\),',
                     'text("1.0 • Build " + BuildInfo.VERSION_CODE + "\\n\\nSettings UI recovered from: " + th.getClass().getSimpleName(),', s)
          s = re.sub(r'"Harley\'s Clan Forum\\nVersion 1\.0 • Build [0-9]+\\nHarley\'s Clan Forum v1\.0 \[Stable\]"',
                     '"Harley\'s Clan Forum\\nVersion 1.0 • Build " + BuildInfo.VERSION_CODE + "\\nHarley\'s Clan Forum v1.0 [Stable]"', s)
          s = re.sub(r'"Beta-only tools • " \+ getPackageName\(\) \+ "\\nBuild [0-9]+ • channel Stable • update feed stable"',
                     '"Stable tools • " + getPackageName() + "\\nBuild " + BuildInfo.VERSION_CODE + " • channel Stable • update feed stable"', s)
          p.write_text(s, encoding='utf-8')

          # Keep other user-visible installed-build strings current for this release.
          p = src / 'src/com/harleytg/forum/MainActivity.java'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Stable v1000007[0-9]', f'Stable v{code}', s)
          s = re.sub(r'Installed: v1\.0 \(1000007[0-9]\)', f'Installed: v1.0 ({code})', s)
          s = re.sub(r'Installed build 1\.0 \(1000007[0-9]\)', f'Installed build 1.0 ({code})', s)
          p.write_text(s, encoding='utf-8')

          # Release notes identify the actual current Stable versionCode.
          p = src / 'src/com/harleytg/forum/ReleaseNotes.java'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'1000007[0-9]', code, s)
          p.write_text(s, encoding='utf-8')

          # Preserve prior runtime fixes if the Stable source still contains the old code.
          p = src / 'src/com/harleytg/forum/UpdateAutomation.java'
          s = p.read_text(encoding='utf-8')
          s = s.replace('final String str = "dev";', 'final String str = BuildInfo.DEFAULT_UPDATE_CHANNEL;')
          s = s.replace('UpdateChecker.check(applicationContext, "dev",', 'UpdateChecker.check(applicationContext, BuildInfo.DEFAULT_UPDATE_CHANNEL,')
          p.write_text(s, encoding='utf-8')

          p = src / 'src/com/harleytg/forum/NotificationHelper.java'
          s = p.read_text(encoding='utf-8')
          old = '        AppLogger.info(context, "notification_count",\n                (source == null ? "sync" : source) + " | count=" + normalized + " previous=" + previous);'
          if old in s:
              s = s.replace(old, '        if (!hadBaseline || normalized != previous) {\n            AppLogger.info(context, "notification_count",\n                    (source == null ? "sync" : source) + " | count=" + normalized + " previous=" + previous);\n        }', 1)
          p.write_text(s, encoding='utf-8')

          p = src / 'src/com/harleytg/forum/MainActivity.java'
          s = p.read_text(encoding='utf-8')
          old = '''    public String chooseInitialHost() {
        if (this.prefs.getBoolean("auto_failover", true)) {
            return System.currentTimeMillis() < this.prefs.getLong("fallback_until", 0L) ? "harleysclan.freeflarum.com" : "forum.harleytg.com";
        }
        return "forum.harleytg.com";
    }'''
          if old in s:
              s = s.replace(old, '''    public String chooseInitialHost() {
        return ForumConfig.PRIMARY_HOST;
    }''', 1)
          p.write_text(s, encoding='utf-8')

          for rel in ('README.md', 'STABLE-RELEASE.md'):
              p = repo / rel
              if p.exists():
                  t = p.read_text(encoding='utf-8')
                  t = re.sub(r'1000007[0-9]', code, t)
                  p.write_text(t, encoding='utf-8')

          # Fail the build if the visible About build line is still hard-coded to an old code.
          settings = (src / 'src/com/harleytg/forum/SettingsActivity.java').read_text(encoding='utf-8')
          buildinfo = (src / 'src/com/harleytg/forum/BuildInfo.java').read_text(encoding='utf-8')
          manifest = (src / 'AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'Build " + BuildInfo.VERSION_CODE' in settings
          assert f'VERSION_CODE = {code}' in buildinfo
          assert f'android:versionCode="{code}"' in manifest
          assert f'android:versionName="1.0 ({code})"' in manifest
          print('Stable versionCode UI is dynamic and build is', code)
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and align Stable v10000079
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/stable-repo/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/build"
          rm -rf "$WORK" "$GITHUB_WORKSPACE/out"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$GITHUB_WORKSPACE/out"
          "$BT/aapt" package -f -m -J "$WORK/gen" -M "$ROOT/AndroidManifest.xml" -S "$ROOT/res" -A "$ROOT/assets" -I "$ANDROID_JAR" -F "$WORK/resources.apk"
          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"
          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$GITHUB_WORKSPACE/out/HCF-Stable-v10000079-aligned-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$GITHUB_WORKSPACE/out/HCF-Stable-v10000079-aligned-unsigned.apk"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/out/HCF-Stable-v10000079-aligned-unsigned.apk" | head -1 | tee "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          grep -q "versionCode='10000079'" "$GITHUB_WORKSPACE/out/APK-BADGING.txt"
          cp "$BT/lib/apksigner.jar" "$GITHUB_WORKSPACE/out/apksigner.jar"

      - name: Publish Stable v10000079 source
        shell: bash
        run: |
          set -euo pipefail
          cd stable-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code' README.md STABLE-RELEASE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Fix displayed Stable versionCode v10000079'
            git push origin HEAD:stable
          fi

      - name: Upload unsigned Stable v10000079
        uses: actions/upload-artifact@v4
        with:
          name: hcf-stable-v10000079-versioncode-fix
          path: out/
          if-no-files-found: error
          retention-days: 1
