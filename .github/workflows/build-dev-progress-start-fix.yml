name: HCF Beta Progress Start Fix Build

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-dev-progress-start-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-progress-start-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev source
        uses: actions/checkout@v4

      - name: Patch startup progress for this build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source code/src/com/harleytg/forum/HcfUITheme.java')
          s = p.read_text(encoding='utf-8')
          old_initial = 'loaderProgress.setProgress(0);'
          old_visible = 'loaderProgress.setProgress(0, false);'
          if s.count(old_initial) != 1:
              raise SystemExit(f'Expected one initial 0%% progress call, found {s.count(old_initial)}')
          if s.count(old_visible) != 1:
              raise SystemExit(f'Expected one visible 0%% progress call, found {s.count(old_visible)}')
          s = s.replace(old_initial, 'loaderProgress.setProgress(4);', 1)
          s = s.replace(old_visible, 'loaderProgress.setProgress(4, false);', 1)
          s = s.replace('must see a real 0% loader frame', 'must see the first real startup stage')
          s = s.replace('"visible_zero"', '"visible_first_stage"')
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'loaderProgress.setProgress(4);' 'source code/src/com/harleytg/forum/HcfUITheme.java'
          grep -F 'loaderProgress.setProgress(4, false);' 'source code/src/com/harleytg/forum/HcfUITheme.java'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile patched source and package aligned APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-beta-progress-start-fix"
          OUT="$GITHUB_WORKSPACE/out-progress-start-fix"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT/tools/lib"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"
          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          APK="$OUT/HCF-Beta-v10000097-ProgressStartFix-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

          "$BT/aapt" dump badging "$APK" | head -1 | tee "$OUT/APK-BADGING.txt"
          grep -q "name='com.harleytg.forum.dev'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='10000097'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0 (10000097)'" "$OUT/APK-BADGING.txt"
          unzip -p "$APK" classes.dex | strings > "$OUT/DEX-STRINGS.txt"
          grep -Fq 'visible_first_stage' "$OUT/DEX-STRINGS.txt"
          grep -Fq 'begin_after_visible_frame' "$OUT/DEX-STRINGS.txt"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"

          cp "$BT/apksigner" "$OUT/tools/apksigner"
          cp "$BT/lib/apksigner.jar" "$OUT/tools/lib/apksigner.jar"
          cp "$BT/zipalign" "$OUT/tools/zipalign"
          chmod +x "$OUT/tools/apksigner" "$OUT/tools/zipalign"

      - name: Upload patched APK build kit
        uses: actions/upload-artifact@v4
        with:
          name: HCF-Beta-v10000097-ProgressStartFix-BuildKit
          path: out-progress-start-fix/
          if-no-files-found: error
          retention-days: 1
