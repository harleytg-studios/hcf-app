name: Align HCF v100000101 Release Verifier

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-widget-v100000101.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update release verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/verify-release-readiness.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('EXPECTED_VERSION_CODE = 10000099', 'EXPECTED_VERSION_CODE = 100000101'),
              ('EXPECTED_INTERNAL_BUILD = 118', 'EXPECTED_INTERNAL_BUILD = 119'),
              ('require("wrong versionName", name_match.group(1) == f"1.0 ({version_code})")',
               'require("wrong versionName", name_match.group(1) == f"1.1 ({version_code})")'),
              ('    "HcfUI.java",\n}', '    "HcfUI.java",\n    "HcfWidget.java",\n}'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected verifier fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/verify-release-readiness.py
          git diff --cached --check
          git commit -m 'Align release verifier for Beta 1.1 (100000101)'
          git push origin HEAD:dev
