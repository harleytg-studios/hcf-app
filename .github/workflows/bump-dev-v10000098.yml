name: Bump Dev to v10000098

# Trigger after workflow registration on main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-dev-v10000098.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bump Dev identity to v10000098
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('source code/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          required = [
              'android:versionCode="10000097"',
              'android:versionName="1.0 (10000097)"',
              'android:value="1.0 (10000097)"',
              'android:value="10000097"',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing expected manifest marker: {marker}')
          manifest.write_text(text.replace('10000097', '10000098'), encoding='utf-8')

          app = Path('source code/src/com/harleytg/forum/HcfApplication.java')
          text = app.read_text(encoding='utf-8')
          replacements = {
              'HCF-Beta-v10000097.apk': 'HCF-Beta-v10000098.apk',
              'static final int INTERNAL_BUILD = 117;': 'static final int INTERNAL_BUILD = 118;',
              'HarleysClanForumApp/1.0 Build/10000097': 'HarleysClanForumApp/1.0 Build/10000098',
              'static final int VERSION_CODE = 10000097;': 'static final int VERSION_CODE = 10000098;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected BuildInfo marker: {old}')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if '10000097' not in text or 'Internal build: `117`' not in text:
              raise SystemExit('README build identity markers missing')
          text = text.replace('10000097', '10000098').replace('Internal build: `117`', 'Internal build: `118`')
          readme.write_text(text, encoding='utf-8')

          old_workflow = Path('.github/workflows/build-dev-v10000097.yml')
          new_workflow = Path('.github/workflows/build-dev-v10000098.yml')
          if not old_workflow.exists():
              raise SystemExit('Expected v10000097 Dev workflow is missing')
          text = old_workflow.read_text(encoding='utf-8').replace('10000097', '10000098')
          new_workflow.write_text(text, encoding='utf-8')
          old_workflow.unlink()

          assert '10000097' not in manifest.read_text(encoding='utf-8')
          assert 'HCF-Beta-v10000097.apk' not in app.read_text(encoding='utf-8')
          assert 'VERSION_CODE = 10000097' not in app.read_text(encoding='utf-8')
          assert 'Build/10000097' not in app.read_text(encoding='utf-8')
          assert '10000097' not in readme.read_text(encoding='utf-8')
          assert '10000097' not in new_workflow.read_text(encoding='utf-8')
          print('Dev source identity bumped to v10000098.')
          PY

      - name: Verify bumped source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:versionCode="10000098"' 'source code/AndroidManifest.xml'
          grep -q 'android:versionName="1.0 (10000098)"' 'source code/AndroidManifest.xml'
          grep -q 'APK_FILE_NAME = "HCF-Beta-v10000098.apk"' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -q 'VERSION_CODE = 10000098' 'source code/src/com/harleytg/forum/HcfApplication.java'
          grep -q 'INTERNAL_BUILD = 118' 'source code/src/com/harleytg/forum/HcfApplication.java'
          test -f '.github/workflows/build-dev-v10000098.yml'
          test ! -e '.github/workflows/build-dev-v10000097.yml'

      - name: Commit Dev v10000098
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'source code/AndroidManifest.xml' 'source code/src/com/harleytg/forum/HcfApplication.java' README.md .github/workflows/
          if git diff --cached --quiet; then
            echo 'Dev is already v10000098.'
            exit 0
          fi
          git commit -m 'Bump Dev to v10000098'
          git push origin HEAD:dev
