name: Temporary clean DEV Android artifact build

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'TEMP-ANDROID-BUILD-TRIGGER.txt'

permissions:
  contents: read

jobs:
  build:
    name: Build exact clean DEV APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned clean DEV source
        uses: actions/checkout@v4
        with:
          ref: 9ed3a8fc2bc28037cbf7f19e9b216c4628199f8d

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Android SDK and install components
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            -o "$RUNNER_TEMP/cmdline-tools.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$RUNNER_TEMP/cmdline-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-unpacked"
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/cmdline-unpacked/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Build aligned unsigned APK from source code
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source code"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-clean-build"
          OUT="$GITHUB_WORKSPACE/out"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" "$OUT"

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$SRC/AndroidManifest.xml" \
            -S "$SRC/res" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -d '' JAVA_SOURCES < <(find "$WORK/gen" "$SRC/src" -name '*.java' -print0)
          java -m jdk.compiler/com.sun.tools.javac.Main \
            --release 8 \
            -classpath "$ANDROID_JAR" \
            -d "$WORK/classes" \
            "${JAVA_SOURCES[@]}"

          mapfile -d '' CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print0)
          "$BT/d8" \
            --lib "$ANDROID_JAR" \
            --min-api 26 \
            --release \
            --output "$WORK/dex" \
            "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" "$OUT/HCF-Beta-v10000033-clean-unsigned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/HCF-Beta-v10000033-clean-unsigned.apk"

          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          "$BT/aapt" dump badging "$OUT/HCF-Beta-v10000033-clean-unsigned.apk" > "$OUT/APK-BADGING.txt"
          sha256sum "$OUT/HCF-Beta-v10000033-clean-unsigned.apk" > "$OUT/APK-SHA256.txt"
          git rev-parse HEAD > "$OUT/DEV-COMMIT.txt"
          git rev-parse HEAD:"source code" > "$OUT/SOURCE-TREE.txt"

      - name: Upload unsigned APK and local signing tool
        uses: actions/upload-artifact@v4
        with:
          name: HCF-clean-dev-unsigned-and-apksigner
          retention-days: 1
          if-no-files-found: error
          path: |
            out/HCF-Beta-v10000033-clean-unsigned.apk
            out/apksigner.jar
            out/APK-BADGING.txt
            out/APK-SHA256.txt
            out/DEV-COMMIT.txt
            out/SOURCE-TREE.txt
