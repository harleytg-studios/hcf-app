name: Finalize Dev v1.2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/finalize-dev-v1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set clean v1.2 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('source code/AndroidManifest.xml')
          core = Path('source code/src/com/harleytg/forum/HcfCore.java')
          verifier = Path('.github/scripts/verify-release-readiness.py')

          def replace_all(path, old, new, min_count=1):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < min_count:
                  raise SystemExit(f'{path}: missing {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_all(manifest, 'android:versionName="1.2-a1 (100000106)"', 'android:versionName="1.2 (100000106)"')

          pairs = [
              ('HCF-Beta-v1.2-a1.apk', 'HCF-Beta-v1.2.apk'),
              ('v1.2-a1 (100000106)', 'v1.2 (100000106)'),
              ('v1.2-a1 • Alpha 1', 'v1.2'),
              ('Alpha-1', 'v1.2'),
              ('static final String RELEASE_STAGE = "Alpha";', 'static final String RELEASE_STAGE = "Development";'),
              ('HarleysClanForumApp/1.2-a1 Build/100000106', 'HarleysClanForumApp/1.2 Build/100000106'),
              ('static final String VERSION = "1.2-a1";', 'static final String VERSION = "1.2";'),
              ('static final String VERSION_TAG = "v1.2-a1";', 'static final String VERSION_TAG = "v1.2";'),
              ('static final String VERSION_CODE_SCHEME = "dev-alpha-v1";', 'static final String VERSION_CODE_SCHEME = "dev-version-v1";'),
          ]
          for old, new in pairs:
              replace_all(core, old, new)

          replace_all(verifier, 'EXPECTED_VERSION = "1.2-a1"', 'EXPECTED_VERSION = "1.2"')
          replace_all(verifier, 'VERSION_CODE_SCHEME = "dev-alpha-v1"', 'VERSION_CODE_SCHEME = "dev-version-v1"')
          PY

      - name: Remove temporary build trigger and workflow
        shell: bash
        run: |
          rm -f 'source code/ci/manual-v1.2-a1-build-trigger.txt'
          rm -f '.github/workflows/finalize-dev-v1.2.yml'

      - name: Verify release readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-hcf-alerts-ui.py 'source code'
          python3 .github/scripts/verify-hcf-notifications-v2.py 'source code'
          python3 .github/scripts/verify-release-readiness.py .
          grep -Fq 'android:versionCode="100000106"' 'source code/AndroidManifest.xml'
          grep -Fq 'android:versionName="1.2 (100000106)"' 'source code/AndroidManifest.xml'
          grep -Fq 'static final String VERSION = "1.2";' 'source code/src/com/harleytg/forum/HcfCore.java'
          grep -Fq 'static final String VERSION_TAG = "v1.2";' 'source code/src/com/harleytg/forum/HcfCore.java'

      - name: Commit clean v1.2 identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use clean Dev v1.2 version identity'
          git push origin HEAD:dev
