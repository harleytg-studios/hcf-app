name: TEMP Delete obsolete HCF recovery branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-delete-unused-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete recovery branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'v10000072-backup-before-restore',
              'v10000072-restore-safe',
              'v10000072-source-restore-candidate',
              'v10000072-source-restore-finalwork',
              'v10000072-source-restore-staging',
              'v10000072-source-restore-work',
              'temp-v10000072-source-apply'
            ];
            const deleted = [];
            const absent = [];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                deleted.push(branch);
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  absent.push(branch);
                  core.info(`Already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }
            const path = 'build-output/TEMP-BRANCH-CLEANUP-DONE.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = `run=${context.runId}\ndeleted=${deleted.join(',')}\nalready_absent=${absent.join(',')}\n`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              sha,
              message: '[skip ci] Record obsolete branch cleanup',
              content: Buffer.from(body).toString('base64')
            });
